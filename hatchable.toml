[mcp]
enabled = true

[[api]]
name = "linear"
auth = "api_key"
base_url = "https://api.linear.app/graphql"
key_header = "Authorization"
key_prefix = ""
description = "Archive terminal Linear issues from the bounded portfolio execution surface."
required = true

# GitHub repository mutations authenticate through the installed GitHub App below.

[[secret]]
key = "GITHUB_APP_ID"
required = true
description = "GitHub App ID for repository-scoped Portfolio Control Plane mutations."

[[secret]]
key = "GITHUB_APP_PRIVATE_KEY"
required = true
description = "Private key for the narrowly installed Portfolio Control Plane GitHub App. Stored as a Hatchable project secret."
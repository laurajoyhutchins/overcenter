[mcp]
enabled = true

[[api]]
name = "linear"
auth = "api_key"
base_url = "https://api.linear.app/graphql"
key_header = "Authorization"
key_prefix = ""
description = "Archive terminal Linear issues from the bounded portfolio execution surface."
required = true

[[api]]
name = "github"
auth = "oauth2"
base_url = "https://api.github.com"
authorize_url = "https://github.com/login/oauth/authorize"
token_url = "https://github.com/login/oauth/access_token"
scopes = ["repo"]
description = "Apply atomic, optimistic-concurrency-protected Git changesets to repositories the connected GitHub identity may write."
required = false

[api.headers]
Accept = "application/vnd.github+json"
X-GitHub-Api-Version = "2026-03-10"
User-Agent = "Hatchable-Portfolio-Control-Plane/1.0"

[[secret]]
key = "GITHUB_APP_ID"
required = true
description = "GitHub App ID used by the GitHub App authentication proof of concept."

[[secret]]
key = "GITHUB_APP_PRIVATE_KEY"
required = true
description = "PEM private key for the narrowly installed GitHub App authentication proof of concept."
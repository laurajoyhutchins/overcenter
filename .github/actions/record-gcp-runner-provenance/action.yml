name: Record GCP runner provenance
description: Validate and record substrate-owned provenance for an Overcenter GCP self-hosted runner.
outputs:
  provider:
    description: Execution substrate provider.
    value: ${{ steps.provenance.outputs.provider }}
  runner-name:
    description: Exact GitHub runner name.
    value: ${{ steps.provenance.outputs.runner_name }}
  repository:
    description: Repository executed by the runner.
    value: ${{ steps.provenance.outputs.repository }}
  job-id:
    description: Exact GitHub workflow job ID bound by the JIT runner launcher.
    value: ${{ steps.provenance.outputs.job_id }}
  scheduling-label:
    description: Exact admitted GCP scheduling label used for this job.
    value: ${{ steps.provenance.outputs.scheduling_label }}
  run-id:
    description: GitHub workflow run ID.
    value: ${{ steps.provenance.outputs.run_id }}
  run-attempt:
    description: GitHub workflow run attempt.
    value: ${{ steps.provenance.outputs.run_attempt }}
  job:
    description: GitHub job key.
    value: ${{ steps.provenance.outputs.job }}
runs:
  using: composite
  steps:
    - id: provenance
      shell: bash
      env:
        OC_RUNNER_NAME: ${{ runner.name }}
        OC_REPOSITORY: ${{ github.repository }}
        OC_RUN_ID: ${{ github.run_id }}
        OC_RUN_ATTEMPT: ${{ github.run_attempt }}
        OC_JOB: ${{ github.job }}
      run: bash "$GITHUB_ACTION_PATH/record-gcp-runner-provenance.sh"

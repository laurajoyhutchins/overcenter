name: Temporary lease worker artifact generation

on:
  push:
    branches: [tmp/lease-worker-generation]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install canonical dependencies
        run: npm ci
      - name: Install contract evidence tooling
        run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Generate and verify canonical artifacts
        run: node scripts/tmp-generate-lease-worker-artifacts.mjs
      - name: Commit generated source alignment
        run: |
          git config user.name "overcenter-artifact-bot"
          git config user.email "overcenter-artifact-bot@users.noreply.github.com"
          git add src/semantic/semantic-command-descriptors.ts lib/semantic-command-descriptors.js scripts/verify-semantic-command-descriptors.test.mjs generated/contracts/catalog.json docs/generated/data-contracts.md docs/generated/data-contract-authority-atlas.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: align lease worker contracts and generated evidence"
          git push origin HEAD:tmp/lease-worker-generation

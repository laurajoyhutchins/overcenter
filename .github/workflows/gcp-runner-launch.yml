name: GCP runner launch

on:
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository requesting a runner
        required: true
        type: string
      repository_id:
        description: Immutable GitHub repository id
        required: true
        type: string
      job_id:
        description: Queued GitHub workflow job id
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-runner-${{ inputs.repository_id }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      RUNNER_IMAGE: us-west1-docker.pkg.dev/project-6b810532-a302-48dc-b56/cloud-run-source-deploy/overcenter-gcp-runner:git-${{ github.sha }}
      TARGET_REPOSITORY: ${{ inputs.repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.repository_id }}
      TARGET_JOB_ID: ${{ inputs.job_id }}

    steps:
      - name: Check out exact controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate dispatch authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/gcp-cloud-run-cloud-sql-bootstrap"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - "$TARGET_REPOSITORY" "$TARGET_REPOSITORY_ID" <<'PY'
          import json
          import sys

          repository, repository_id = sys.argv[1:]
          with open("config/gcp-runner-autoscaler.json", encoding="utf-8") as handle:
              config = json.load(handle)

          bindings = {
              (str(item.get("full_name") or ""), str(item.get("repository_id") or ""))
              for item in config.get("repositories", [])
          }
          if (repository, repository_id) not in bindings:
              raise SystemExit("repository is outside the runner allowlist")
          PY
          [[ "$TARGET_JOB_ID" =~ ^[0-9]+$ ]]

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Launch disposable runner
        shell: bash
        run: bash infra/gcp/launch-ephemeral-github-runner.sh

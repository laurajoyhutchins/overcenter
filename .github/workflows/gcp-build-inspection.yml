name: Inspect GCP runner builds

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .overcenter/gcp-build-inspection-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: inspect-gcp-runner-builds
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prove inspection authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/gcp-cloud-run-cloud-sql-bootstrap"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Inspect exact builds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/build-ids
          import json
          with open('.overcenter/gcp-build-inspection-request.json', encoding='utf-8') as f:
              body=json.load(f)
          assert body.get('schema') == 'overcenter-gcp-build-inspection/v1'
          ids=body.get('build_ids')
          assert isinstance(ids,list) and 1 <= len(ids) <= 10
          for value in ids:
              assert isinstance(value,str) and value
              print(value)
          PY
          while IFS= read -r build_id; do
            echo "=== BUILD $build_id ==="
            gcloud builds describe "$build_id"               --project="$GCP_PROJECT_ID"               --region="$GCP_REGION"               --format='yaml(id,status,failureInfo,logUrl,steps.id,steps.status)'
          done < /tmp/build-ids

name: Contract evidence verification

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  contract-evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install contract evidence tooling
        run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Run contract evidence tests
        run: node --test scripts/contract-evidence/*.test.mjs scripts/contract-evidence/overcenter/*.test.mjs
      - name: Generate candidate contract evidence once
        run: |
          mkdir -p "$RUNNER_TEMP/contract-evidence/generated/contracts" "$RUNNER_TEMP/contract-evidence/docs/generated"
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog "$RUNNER_TEMP/contract-evidence/generated/contracts/catalog.json" \
            --docs "$RUNNER_TEMP/contract-evidence/docs/generated/data-contracts.md" \
            --atlas "$RUNNER_TEMP/contract-evidence/docs/generated/data-contract-authority-atlas.md"
      - name: Emit exact contract evidence replacement plan
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { canonicalJson } from './packages/contract-evidence/index.mjs';
          const current=JSON.parse(await readFile('generated/contracts/catalog.json','utf8'));
          const next=JSON.parse(await readFile(process.env.RUNNER_TEMP + '/contract-evidence/generated/contracts/catalog.json','utf8'));
          const replacements=[];
          function planArray(field,key){
            const before=current[field]||[];
            const after=next[field]||[];
            const beforeBy=new Map(before.map((value,index)=>[value[key],{value,index}]));
            const afterBy=new Map(after.map((value,index)=>[value[key],{value,index}]));
            const removed=before.filter(value=>!afterBy.has(value[key]));
            if(removed.length) throw new Error(`${field} removals require explicit diagnostic handling: ${removed.map(value=>value[key]).join(',')}`);
            for(const value of after){
              const prior=beforeBy.get(value[key]);
              if(prior && canonicalJson(prior.value)!==canonicalJson(value)) {
                replacements.push({path:'generated/contracts/catalog.json',old:canonicalJson(prior.value),new_text:canonicalJson(value),expected_count:1,reason:`${field} changed ${value[key]}`});
              }
            }
            const added=after.filter(value=>!beforeBy.has(value[key]));
            let offset=0;
            while(offset<added.length){
              const first=added[offset];
              const firstIndex=afterBy.get(first[key]).index;
              const group=[first];
              offset+=1;
              while(offset<added.length && afterBy.get(added[offset][key]).index===firstIndex+group.length){ group.push(added[offset]); offset+=1; }
              let anchorIndex=firstIndex-1;
              while(anchorIndex>=0 && !beforeBy.has(after[anchorIndex][key])) anchorIndex-=1;
              if(anchorIndex>=0){
                const anchor=after[anchorIndex];
                replacements.push({path:'generated/contracts/catalog.json',old:canonicalJson(beforeBy.get(anchor[key]).value),new_text:[canonicalJson(beforeBy.get(anchor[key]).value),...group.map(canonicalJson)].join(','),expected_count:1,reason:`${field} add ${group.map(value=>value[key]).join(',')}`});
              } else {
                let successor=firstIndex+group.length;
                while(successor<after.length && !beforeBy.has(after[successor][key])) successor+=1;
                if(successor>=after.length) throw new Error(`${field} has no stable anchor`);
                const anchor=after[successor];
                replacements.push({path:'generated/contracts/catalog.json',old:canonicalJson(beforeBy.get(anchor[key]).value),new_text:[...group.map(canonicalJson),canonicalJson(beforeBy.get(anchor[key]).value)].join(','),expected_count:1,reason:`${field} prepend ${group.map(value=>value[key]).join(',')}`});
              }
            }
          }
          planArray('candidates','source_identity');
          planArray('logical_contracts','id');
          if(canonicalJson(current.unclassified_source_identities)!==canonicalJson(next.unclassified_source_identities)) {
            replacements.push({path:'generated/contracts/catalog.json',old:canonicalJson(current.unclassified_source_identities),new_text:canonicalJson(next.unclassified_source_identities),expected_count:1,reason:'unclassified identities changed'});
          }
          if(canonicalJson(current.summary)!==canonicalJson(next.summary)) replacements.push({path:'generated/contracts/catalog.json',old:canonicalJson(current.summary),new_text:canonicalJson(next.summary),expected_count:1,reason:'summary changed'});
          const docsCurrent=await readFile('docs/generated/data-contracts.md','utf8');
          const docsNext=await readFile(process.env.RUNNER_TEMP + '/contract-evidence/docs/generated/data-contracts.md','utf8');
          if(docsCurrent!==docsNext){
            let prefix=0; while(prefix<docsCurrent.length && prefix<docsNext.length && docsCurrent[prefix]===docsNext[prefix]) prefix+=1;
            let suffix=0; while(suffix<docsCurrent.length-prefix && suffix<docsNext.length-prefix && docsCurrent[docsCurrent.length-1-suffix]===docsNext[docsNext.length-1-suffix]) suffix+=1;
            let start=docsCurrent.lastIndexOf('\n',Math.max(0,prefix-1))+1;
            let oldEnd=docsCurrent.indexOf('\n',docsCurrent.length-suffix); if(oldEnd<0) oldEnd=docsCurrent.length; else oldEnd+=1;
            let newEnd=docsNext.indexOf('\n',docsNext.length-suffix); if(newEnd<0) newEnd=docsNext.length; else newEnd+=1;
            replacements.push({path:'docs/generated/data-contracts.md',old:docsCurrent.slice(start,oldEnd),new_text:docsNext.slice(start,newEnd),expected_count:1,reason:'generated docs changed'});
          }
          console.log('OVERCENTER_CONTRACT_REPLACEMENTS=' + JSON.stringify(replacements));
          console.log('OVERCENTER_CONTRACT_SUMMARY=' + JSON.stringify({before:current.summary,after:next.summary}));
          NODE
      - name: Verify committed generated evidence
        run: |
          node scripts/contract-evidence/cli.mjs check \
            --expected-catalog "$RUNNER_TEMP/contract-evidence/generated/contracts/catalog.json" \
            --expected-docs "$RUNNER_TEMP/contract-evidence/docs/generated/data-contracts.md" \
            --expected-atlas "$RUNNER_TEMP/contract-evidence/docs/generated/data-contract-authority-atlas.md" \
            --catalog generated/contracts/catalog.json \
            --docs docs/generated/data-contracts.md \
            --atlas docs/generated/data-contract-authority-atlas.md
      - name: Enforce historical unclassified ratchet
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          MERGE_BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          if git cat-file -e "$MERGE_BASE:generated/contracts/catalog.json" 2>/dev/null; then
            git show "$MERGE_BASE:generated/contracts/catalog.json" > "$RUNNER_TEMP/base-contract-catalog.json"
            node scripts/contract-evidence/cli.mjs compare \
              --base-catalog "$RUNNER_TEMP/base-contract-catalog.json" \
              --head-catalog generated/contracts/catalog.json
          else
            echo "No merge-base contract catalog exists; establishing the initial evidence baseline."
          fi

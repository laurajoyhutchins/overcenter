name: Lean 4.23 proof bootstrap

on:
  push:
    branches:
      - agent/lean-423-proof-bootstrap-20261002

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download pinned Lean 4.23.0
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            -o lean-4.23.0-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.23.0/lean-4.23.0-linux.tar.zst
          echo "ecd028d6f642b61b451c8687aeeb24dd53789fbfdcb7d4adb8f5cf60eb2022ba  lean-4.23.0-linux.tar.zst" | sha256sum -c -
          tar --zstd -xf lean-4.23.0-linux.tar.zst
      - name: Compile exact 4x4 proof
        run: |
          set -euo pipefail
          ./lean-4.23.0-linux/bin/lean \
            docs/migrations/4x4-strangler/formal/FourByFourEffect.lean

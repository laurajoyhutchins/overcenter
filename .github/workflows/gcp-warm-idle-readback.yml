name: Read GCP warm runner idle state

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .overcenter/gcp-warm-idle-readback-request
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-warm-runner-idle-readback
  cancel-in-progress: false

jobs:
  readback:
    name: Independently read warm VM count
    runs-on: [self-hosted, "overcenter-gcp-${{ github.run_id }}-idle-readback-${{ github.run_attempt }}"]
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_ZONE: us-west1-a
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com

    steps:
      - name: Bind to exact infrastructure revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/gcp-cloud-run-cloud-sql-bootstrap"
          test "$GITHUB_SHA" = "${{ github.sha }}"

      - name: Authenticate existing read-only observation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Observe exact warm group without mutation
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          if ! gcloud compute instance-groups managed describe overcenter-gce-runners \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --format=json > "$workdir/mig.json"; then
            echo "::error::Existing deployer lacks Compute MIG read authority or GCE observation failed. Do not widen IAM automatically."
            exit 1
          fi
          if ! gcloud compute instance-groups managed list-instances overcenter-gce-runners \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --format=json > "$workdir/instances.json"; then
            echo "::error::Existing deployer lacks Compute managed-instance listing or GCE observation failed."
            exit 1
          fi
          if ! gcloud scheduler jobs describe overcenter-runner-reconcile \
            --project="$GCP_PROJECT_ID" --location="$GCP_REGION" --format=json > "$workdir/scheduler.json"; then
            echo "::error::Scheduler job observation failed."
            exit 1
          fi
          python3 - "$workdir/mig.json" "$workdir/instances.json" "$workdir/scheduler.json" <<'PY'
          import datetime as dt
          import json
          import sys

          mig_file, instances_file, scheduler_file = sys.argv[1:]
          def load(path):
              with open(path, encoding="utf-8") as stream:
                  return json.load(stream)

          mig = load(mig_file)
          instances = load(instances_file)
          scheduler = load(scheduler_file)
          policy = ((mig.get("autoscaler") or {}).get("autoscalingPolicy") or {})
          metrics = policy.get("customMetricUtilizations") or []
          expected_filter = 'resource.type="pubsub_subscription" AND resource.labels.subscription_id="overcenter-gce-runners"'
          if not (
              mig.get("name") == "overcenter-gce-runners"
              and str(mig.get("zone") or "").endswith("/us-west1-a")
              and policy.get("minNumReplicas") == 0
              and policy.get("maxNumReplicas") == 1
              and policy.get("stabilizationPeriodSec") == 2700
              and policy.get("mode", "ON") == "ON"
              and len(metrics) == 1
              and metrics[0].get("metric") == "pubsub.googleapis.com/subscription/num_undelivered_messages"
              and metrics[0].get("filter") == expected_filter
              and float(metrics[0].get("singleInstanceAssignment", 0)) == 1.0
              and "cpuUtilization" not in policy
              and "loadBalancingUtilization" not in policy
              and not policy.get("scalingSchedules")
          ):
              raise SystemExit("HOLD: GCE warm autoscaler policy readback differs from approved 0..1 policy")
          if scheduler.get("state") != "ENABLED":
              raise SystemExit("HOLD: private reconciler Scheduler not enabled")
          if not isinstance(instances, list):
              raise SystemExit("HOLD: managed-instance listing has an unexpected shape")
          target = mig.get("targetSize")
          print(f"Observed at: {dt.datetime.now(dt.timezone.utc).isoformat()}")
          print("Warm runner group:", mig.get("name"))
          print("Actual managed group targetSize:", target)
          print("Actual managed instance count:", len(instances))
          print("Scheduler:", scheduler.get("state"))
          print("Policy: approved 0..1 / 2700-second Pub/Sub backlog")
          if target != 0 or len(instances) != 0:
              raise SystemExit("NOT_IDLE_YET: group still has VM capacity; no live scale-to-zero receipt")
          print("GCP_WARM_IDLE_READBACK_PASS: zero target, zero instances, exact autoscaler policy")
          PY

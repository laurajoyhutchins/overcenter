name: Arcata quality tool bootstrap

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
    paths:
      - '.github/workflows/arcata-quality-bootstrap.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture exact Python quality tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/wheels
          python -m pip download --only-binary=:all: --dest payload/wheels             'ruff==0.13.2'             'mypy==1.18.2'
          (
            cd payload/wheels
            sha256sum * | LC_ALL=C sort > ../SHA256SUMS
          )
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
              {"name": p.name, "size": p.stat().st_size}
              for p in sorted(Path("payload/wheels").iterdir())
              if p.is_file()
          ]
          Path("payload/manifest.json").write_text(
              json.dumps(
                  {
                      "schema": "arcata-quality-bootstrap/v1",
                      "python": "3.13",
                      "requirements": ["ruff==0.13.2", "mypy==1.18.2"],
                      "files": files,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload bootstrap payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcata-python-quality-tools
          path: payload
          if-no-files-found: error
          retention-days: 1

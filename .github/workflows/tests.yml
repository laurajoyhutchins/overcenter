name: Evidence

on:
  workflow_call:
    inputs:
      expensive:
        description: Run candidate-only adversarial, formal, production, and self-application evidence
        required: false
        type: boolean
        default: false
      accepted_baseline_sha:
        description: Authoritative claimed source SHA for source transaction validation
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      expensive:
        description: Run candidate-only adversarial, formal, production, and self-application evidence
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evidence:
    name: Candidate evidence
    runs-on: ${{ fromJSON(inputs.expensive && '["ubuntu-24.04"]' || '["self-hosted","overcenter-gcp"]') }}
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ inputs.accepted_baseline_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact evidence revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Fetch accepted TCB baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
      - name: Prepare trusted baseline tools
        shell: bash
        run: |
          set -euo pipefail
          echo "OVERCENTER_NODE_VERSION=$(git show "$BASE_SHA:.node-version")" >> "$GITHUB_ENV"
          echo "OVERCENTER_GO_VERSION=$(git show "$BASE_SHA:.go-version")" >> "$GITHUB_ENV"
          tool_dir="$RUNNER_TEMP/overcenter-trusted-baseline"
          if git cat-file -e "$BASE_SHA:scripts/verify-source-profile.ts" 2>/dev/null; then
            mkdir -p "$tool_dir"
            git archive "$BASE_SHA" \
              scripts/verify-source-profile.ts \
              scripts/replay-base-tests.ts \
              src/source/source-verification-profile.ts \
              src/digest.ts \
              src/validation.ts | tar -x -C "$tool_dir"
            echo "OVERCENTER_TRUSTED_TOOL_DIR=$tool_dir" >> "$GITHUB_ENV"
          else
            echo "OVERCENTER_TRUSTED_TOOL_DIR=" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.OVERCENTER_NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.OVERCENTER_GO_VERSION }}
          cache: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(git show "$BASE_SHA:rust-toolchain.toml" | sed -n 's/^channel = "\([^"]*\)"$/\1/p')"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "$channel"
      - name: Validate source verification profile and protected inputs
        shell: bash
        run: |
          set -euo pipefail
          profile_args=(--check-only)
          if [ -n "${{ inputs.accepted_baseline_sha }}" ]; then
            profile_args+=(--source-candidate)
          fi
          if [ -n "$OVERCENTER_TRUSTED_TOOL_DIR" ]; then
            node --experimental-strip-types "$OVERCENTER_TRUSTED_TOOL_DIR/scripts/verify-source-profile.ts" "${profile_args[@]}"
          else
            node --experimental-strip-types scripts/verify-source-profile.ts "${profile_args[@]}"
          fi
      - name: Install pinned TypeScript toolchain
        run: npm install --ignore-scripts --package-lock=false
      - name: Run verification commands from the exact base profile
        shell: bash
        run: |
          set -euo pipefail
          profile_args=()
          if [ -n "${{ inputs.accepted_baseline_sha }}" ]; then
            profile_args+=(--source-candidate)
          fi
          if [ -n "$OVERCENTER_TRUSTED_TOOL_DIR" ]; then
            node --experimental-strip-types "$OVERCENTER_TRUSTED_TOOL_DIR/scripts/verify-source-profile.ts" "${profile_args[@]}"
          else
            node --experimental-strip-types scripts/verify-source-profile.ts "${profile_args[@]}"
          fi
      - name: Replay immutable base tests against candidate code
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$OVERCENTER_TRUSTED_TOOL_DIR" ]; then
            node --experimental-strip-types "$OVERCENTER_TRUSTED_TOOL_DIR/scripts/replay-base-tests.ts"
          else
            node --experimental-strip-types scripts/replay-base-tests.ts
          fi
      - name: Analyze trusted computing base
        shell: bash
        run: |
          set -euo pipefail
          args=(--summary "$GITHUB_STEP_SUMMARY" --output "$RUNNER_TEMP/overcenter-tcb-report.json")
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            args+=(--baseline "$BASE_SHA")
          fi
          npm run check:tcb -- "${args[@]}"
      - name: Measure semantic scaling marginal TCB
        run: npm run experiment:semantic-scaling:measure -- --tcb-report "$RUNNER_TEMP/overcenter-tcb-report.json" --output "$RUNNER_TEMP/overcenter-semantic-scaling.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Analyze production code witnesses
        run: npm run check:code-witnesses -- --summary "$GITHUB_STEP_SUMMARY" --output "$RUNNER_TEMP/overcenter-code-witness-report.json"
      - name: Check adapter diagnosability
        run: npm run check:adapter-diagnosability
      - name: Install Java for candidate formal proof
        if: ${{ inputs.expensive }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run candidate formal proof
        if: ${{ inputs.expensive }}
        run: |
          set -euo pipefail
          npm run proof:formal

      - name: Prove production computation boundary
        if: ${{ inputs.expensive }}
        env:
          OVERCENTER_PREVERIFIED_COMPUTATION_EXECUTOR: '1'
          OVERCENTER_KEEP_BUILD: '1'
        run: npm run proof:production-boundary
      - name: Prove self-application on the same exact revision
        if: ${{ inputs.expensive }}
        env:
          OVERCENTER_REUSE_EXECUTOR: '1'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/overcenter-self-application.json"
          image="overcenter-self-application:${{ github.run_id }}"
          bash scripts/proof-self-application.sh "$SOURCE_SHA" "$image" "$report"
          {
            echo '## Overcenter self-application'
            echo
            echo '### Report'
            sed 's/^/    /' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

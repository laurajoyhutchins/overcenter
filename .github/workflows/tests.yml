name: Evidence

on:
  workflow_call:
    inputs:
      expensive:
        description: Run candidate-only adversarial, formal, production, and self-application evidence
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      expensive:
        description: Run candidate-only adversarial, formal, production, and self-application evidence
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evidence:
    name: Candidate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact evidence revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Fetch accepted TCB baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "$channel"
      - name: Lint source
        run: npm run lint
      - name: Install pinned TypeScript toolchain
        run: npm install --ignore-scripts --package-lock=false
      - name: Type-check repository
        run: npm run typecheck
      - name: Analyze trusted computing base
        shell: bash
        run: |
          set -euo pipefail
          args=(--summary "$GITHUB_STEP_SUMMARY" --output "$RUNNER_TEMP/overcenter-tcb-report.json")
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            args+=(--baseline "$BASE_SHA")
          fi
          npm run check:tcb -- "${args[@]}"
      - name: Analyze production code witnesses
        run: npm run check:code-witnesses -- --summary "$GITHUB_STEP_SUMMARY" --output "$RUNNER_TEMP/overcenter-code-witness-report.json"
      - name: Check adapter diagnosability
        run: npm run check:adapter-diagnosability
      - name: Check experiment statistics contract
        run: npm run check:experiment-statistics
      - name: Install Java for candidate formal proof
        if: ${{ inputs.expensive }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run deterministic regression and candidate formal proof
        env:
          EXPENSIVE: ${{ inputs.expensive }}
        run: |
          set -euo pipefail

          npm run test:unit &
          unit_pid=$!

          formal_pid=
          if [ "$EXPENSIVE" = true ]; then
            npm run proof:formal &
            formal_pid=$!
          fi

          unit_status=0
          formal_status=0
          wait "$unit_pid" || unit_status=$?
          if [ -n "$formal_pid" ]; then
            wait "$formal_pid" || formal_status=$?
          fi

          test "$unit_status" -eq 0
          test "$formal_status" -eq 0

      - name: Prove production computation boundary
        if: ${{ inputs.expensive }}
        env:
          OVERCENTER_PREVERIFIED_COMPUTATION_EXECUTOR: '1'
          OVERCENTER_KEEP_BUILD: '1'
        run: npm run proof:production-boundary
      - name: Prove self-application on the same exact revision
        if: ${{ inputs.expensive }}
        env:
          OVERCENTER_REUSE_EXECUTOR: '1'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/overcenter-self-application.json"
          image="overcenter-self-application:${{ github.run_id }}"
          bash scripts/proof-self-application.sh "$SOURCE_SHA" "$image" "$report"
          {
            echo '## Overcenter self-application'
            echo
            echo '### Report'
            sed 's/^/    /' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

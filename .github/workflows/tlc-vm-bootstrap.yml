name: TLC VM bootstrap

on:
  push:
    branches:
      - agent/tlc-vm-bootstrap-20261001

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download pinned TLC
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
          sha256sum tla2tools.jar > SHA256SUMS
      - name: Upload TLC
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tla2tools-1.7.4
          path: |
            tla2tools.jar
            SHA256SUMS
          compression-level: 0
          retention-days: 1

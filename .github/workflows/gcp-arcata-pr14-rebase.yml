name: GCP Arcata PR14 rebase
# retry after Cloud Build substitution fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-arcata-pr14-rebase.yml
      - .overcenter/gcp-pr14-rebase.trigger

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-arcata-pr14-rebase
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      ARCATA_REPOSITORY: laurajoyhutchins/arcata
      ARCATA_BRANCH: refactor/structured-provenance
      EXPECTED_OLD_HEAD: 36664d012da6370ba0f7541f35c26eda212bb038
      EXPECTED_MAIN: 0e7a1ec6f864c08fdb11bb0b2397bdc331a03017

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Submit exact-head PR14 repair
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"

          config="$RUNNER_TEMP/cloudbuild-pr14-rebase.yaml"
          cat > "$config" <<'YAML'
          serviceAccount: projects/project-6b810532-a302-48dc-b56/serviceAccounts/overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
          timeout: 900s

          steps:
            - id: github-token
              name: node:22-bookworm
              entrypoint: node
              secretEnv:
                - GITHUB_APP_PRIVATE_KEY
              env:
                - GITHUB_APP_ID=4616688
                - REPOSITORY=${_REPOSITORY}
                - BRANCH=${_BRANCH}
                - EXPECTED_OLD_HEAD=${_EXPECTED_OLD_HEAD}
                - EXPECTED_MAIN=${_EXPECTED_MAIN}
              args:
                - -e
                - |
                  const crypto = require("crypto");
                  const fs = require("fs");

                  const repo = process.env.REPOSITORY;
                  const branch = process.env.BRANCH;
                  const oldHead = process.env.EXPECTED_OLD_HEAD;
                  const mainHead = process.env.EXPECTED_MAIN;
                  const apiVersion = "2026-03-10";
                  const b64 = value => Buffer.from(JSON.stringify(value)).toString("base64url");
                  const now = Math.floor(Date.now() / 1000);
                  const header = b64({alg:"RS256",typ:"JWT"});
                  const payload = b64({iat:now-60,exp:now+540,iss:process.env.GITHUB_APP_ID});
                  const unsigned = header + "." + payload;
                  const signature = crypto.sign(
                    "RSA-SHA256",
                    Buffer.from(unsigned),
                    process.env.GITHUB_APP_PRIVATE_KEY,
                  ).toString("base64url");
                  const jwt = unsigned + "." + signature;
                  const headers = token => ({
                    Accept:"application/vnd.github+json",
                    Authorization:"Bearer " + token,
                    "X-GitHub-Api-Version":apiVersion,
                    "User-Agent":"overcenter-gcp-pr14-rebase",
                  });

                  async function json(response, label) {
                    const text = await response.text();
                    if (!response.ok) throw new Error(label + " HTTP " + response.status + ": " + text.slice(0,500));
                    return text ? JSON.parse(text) : null;
                  }

                  async function main() {
                    const installation = await json(
                      await fetch("https://api.github.com/repos/" + repo + "/installation", {headers:headers(jwt)}),
                      "installation lookup",
                    );
                    const access = await json(
                      await fetch(
                        "https://api.github.com/app/installations/" + installation.id + "/access_tokens",
                        {
                          method:"POST",
                          headers:{...headers(jwt),"Content-Type":"application/json"},
                          body:JSON.stringify({
                            permissions:{contents:"write",pull_requests:"write"},
                          }),
                        },
                      ),
                      "installation token",
                    );
                    const token = access.token;

                    const branchRef = await json(
                      await fetch(
                        "https://api.github.com/repos/" + repo + "/git/ref/heads/" +
                          branch.split("/").map(encodeURIComponent).join("/"),
                        {headers:headers(token)},
                      ),
                      "branch ref",
                    );
                    const mainRef = await json(
                      await fetch(
                        "https://api.github.com/repos/" + repo + "/git/ref/heads/main",
                        {headers:headers(token)},
                      ),
                      "main ref",
                    );
                    if (branchRef.object.sha !== oldHead) throw new Error("branch exact-head lease mismatch");
                    if (mainRef.object.sha !== mainHead) throw new Error("main exact-head lease mismatch");

                    fs.writeFileSync("/workspace/github-token", token, {mode:0o600});
                  }

                  main().catch(error => {
                    console.error(String(error && error.message || error));
                    process.exit(1);
                  });

            - id: rebase
              name: ubuntu:24.04
              entrypoint: bash
              env:
                - REPOSITORY=${_REPOSITORY}
                - BRANCH=${_BRANCH}
                - EXPECTED_OLD_HEAD=${_EXPECTED_OLD_HEAD}
                - EXPECTED_MAIN=${_EXPECTED_MAIN}
              args:
                - -ceu
                - |
                  echo '' | base64 -d | bash
              allowExitCodes: [1]

            - id: resolve-known-pr14-conflict
              name: python:3.13-bookworm
              entrypoint: python
              args:
                - -c
                - |
                  import os
                  import subprocess
                  from pathlib import Path

                  root = Path("/workspace/source")
                  path = Path("packages/ieee1584/tests/test_protection.py")
                  old_head = "36664d012da6370ba0f7541f35c26eda212bb038"
                  expected_main = "0e7a1ec6f864c08fdb11bb0b2397bdc331a03017"

                  def git(*args, check=True):
                      return subprocess.run(
                          ["git", *args],
                          cwd=root,
                          check=check,
                          text=True,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                      )

                  cherry_pick_head = root / ".git" / "CHERRY_PICK_HEAD"
                  new_head_file = Path("/workspace/new-head")
                  if not cherry_pick_head.exists():
                      if new_head_file.exists():
                          raise SystemExit(0)
                      raise SystemExit("rebase failed without a cherry-pick conflict state")

                  conflicts = git("diff", "--name-only", "--diff-filter=U").stdout.splitlines()
                  if conflicts != [path.as_posix()]:
                      raise SystemExit(f"unexpected PR14 conflicts: {conflicts!r}")

                  git("checkout", "--ours", "--", path.as_posix())
                  current_path = root / path
                  current = current_path.read_text(encoding="utf-8")
                  old = git("show", f"{old_head}:{path.as_posix()}").stdout

                  start = "    def test_structured_evidence_rejects_conflicting_legacy_source"
                  end = "    def test_current_limiting_region_fails_closed"
                  if start in current:
                      raise SystemExit("structured-evidence tests unexpectedly already present")
                  if start not in old or end not in old or end not in current:
                      raise SystemExit("expected PR14 conflict anchors are missing")

                  block = old[old.index(start):old.index(end)]
                  current_path.write_text(
                      current.replace(end, block + end, 1),
                      encoding="utf-8",
                  )
                  git("add", path.as_posix())
                  env = os.environ.copy()
                  env["GIT_EDITOR"] = "true"
                  subprocess.run(
                      ["git", "cherry-pick", "--continue"],
                      cwd=root,
                      check=True,
                      env=env,
                  )

                  new_head = git("rev-parse", "HEAD").stdout.strip()
                  count = git("rev-list", "--count", f"{expected_main}..HEAD").stdout.strip()
                  if count != "1":
                      raise SystemExit(f"expected exactly one rebased commit, observed {count}")
                  new_head_file.write_text(new_head, encoding="utf-8")
                  print("OVERCENTER_PR14_CONFLICT_RESOLUTION=keep-both-independent-test-blocks")
                  print(f"OVERCENTER_PR14_REBASED_HEAD={new_head}")

            - id: install-tools
              name: python:3.13-bookworm
              entrypoint: bash
              args:
                - -ceu
                - |
                  cd /workspace/source
                  python tools/verification_tools.py requirements > /workspace/verification-tools.txt
                  python -m venv /workspace/verification-tools
                  /workspace/verification-tools/bin/python -m pip install                     --disable-pip-version-check                     --no-input                     --no-compile                     --only-binary=:all:                     --no-deps                     --require-hashes                     --requirement /workspace/verification-tools.txt
                  /workspace/verification-tools/bin/python -m pip check

            - id: ruff-format
              name: python:3.13-bookworm
              dir: source
              entrypoint: /workspace/verification-tools/bin/ruff
              args: ["format", "--check", "."]

            - id: ruff-lint
              name: python:3.13-bookworm
              dir: source
              entrypoint: /workspace/verification-tools/bin/ruff
              args: ["check", "."]

            - id: mypy
              name: python:3.13-bookworm
              dir: source
              entrypoint: /workspace/verification-tools/bin/python
              args: ["-m", "mypy"]

            - id: tests
              name: python:3.13-bookworm
              dir: source
              entrypoint: python
              args: ["tools/test_all.py"]

            - id: publish
              name: ubuntu:24.04
              entrypoint: bash
              env:
                - REPOSITORY=${_REPOSITORY}
                - BRANCH=${_BRANCH}
                - EXPECTED_OLD_HEAD=${_EXPECTED_OLD_HEAD}
              args:
                - -ceu
                - |
                  echo '' | base64 -d | bash

          availableSecrets:
            secretManager:
              - versionName: projects/project-6b810532-a302-48dc-b56/secrets/overcenter-github-app-private-key/versions/latest
                env: GITHUB_APP_PRIVATE_KEY

          options:
            logging: CLOUD_LOGGING_ONLY
          YAML

          build_id="$(
            gcloud builds submit               --async               --no-source               --project="$PROJECT_ID"               --region="$REGION"               --config="$config"               --substitutions="_REPOSITORY=$ARCATA_REPOSITORY,_BRANCH=$ARCATA_BRANCH,_EXPECTED_OLD_HEAD=$EXPECTED_OLD_HEAD,_EXPECTED_MAIN=$EXPECTED_MAIN"               --format='value(id)'
          )"
          test -n "$build_id"
          echo "Cloud Build: $build_id" | tee -a "$GITHUB_STEP_SUMMARY"

          status=""
          for _ in $(seq 1 450); do
            status="$(
              gcloud builds describe "$build_id"                 --project="$PROJECT_ID"                 --region="$REGION"                 --format='value(status)'
            )"
            case "$status" in
              SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;;
            esac
            sleep 2
          done

          gcloud builds log "$build_id"             --project="$PROJECT_ID"             --region="$REGION" || true

          echo "Status: $status" | tee -a "$GITHUB_STEP_SUMMARY"
          gcloud builds describe "$build_id"             --project="$PROJECT_ID"             --region="$REGION"             --format="table(steps.id,steps.status)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$status" = SUCCESS

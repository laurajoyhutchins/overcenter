name: Inspect stuck GCP runner

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .github/workflows/inspect-stuck-gcp-runner.yml

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      STUCK_JOB_ID: "113003065067"
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Inspect runner control plane
        shell: bash
        run: |
          set -u
          echo '::group::Exact job build'
          gcloud builds list --project="$GCP_PROJECT_ID" --filter="tags:job-$STUCK_JOB_ID" --sort-by='~createTime' --limit=10 --format=json || true
          echo '::endgroup::'
          echo '::group::Recent runner builds'
          gcloud builds list --project="$GCP_PROJECT_ID" --filter="tags:overcenter-runner" --sort-by='~createTime' --limit=10 --format='table(id,status,createTime,startTime,finishTime,tags)' || true
          echo '::endgroup::'
          echo '::group::Available us-west1 zones'
          gcloud compute zones list --project="$GCP_PROJECT_ID" --filter="region:($GCP_REGION) status=UP" --format='value(name)' | sort || true
          echo '::endgroup::'
          echo '::group::Warm Pub/Sub resources'
          gcloud pubsub topics describe overcenter-gce-runners --project="$GCP_PROJECT_ID" --format=json || true
          gcloud pubsub subscriptions describe overcenter-gce-runners --project="$GCP_PROJECT_ID" --format=json || true
          echo '::endgroup::'
          echo '::group::Warm MIG candidates'
          for zone in $(gcloud compute zones list --project="$GCP_PROJECT_ID" --filter="region:($GCP_REGION) status=UP" --format='value(name)' 2>/dev/null); do
            echo "ZONE=$zone"
            gcloud compute instance-groups managed describe overcenter-gce-runners --project="$GCP_PROJECT_ID" --zone="$zone" --format=json || true
          done
          echo '::endgroup::'
          echo '::group::Autoscaler'
          gcloud run services describe overcenter-github-runner-autoscaler --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json || true
          echo '::endgroup::'
          echo '::group::Launcher'
          gcloud run services describe overcenter-gcp-runner-launcher --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json || true
          echo '::endgroup::'

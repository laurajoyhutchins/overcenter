name: Temporary GCP ordinary transition proof

on:
  push:
    branches:
      - ops/gcp-ordinary-transition-proof-20260908
    paths:
      - .github/workflows/tmp-gcp-ordinary-transition-proof.yml

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
      PROJECT_REF: github:laurajoyhutchins/overcenter
    steps:
      - name: Authenticate to authoritative GCP runtime
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          request_reason: Overcenter ordinary GCP transition acceptance probe

      - name: Read authoritative GCP health and project state
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          test -n "$ID_TOKEN"
          health_status="$(curl --silent --show-error -o "$RUNNER_TEMP/health.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            "$SERVICE_AUDIENCE/health")"
          echo "HEALTH_HTTP=$health_status"
          cat "$RUNNER_TEMP/health.json"
          test "$health_status" = 200
          jq -e '.ok == true and .database == "ready" and .authority_mode == "authoritative"' "$RUNNER_TEMP/health.json" >/dev/null

          inspect_status="$(curl --silent --show-error -o "$RUNNER_TEMP/inspect.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'content-type: application/json' \
            -X POST \
            -d "{\"project_ref\":\"$PROJECT_REF\"}" \
            "$SERVICE_AUDIENCE/api/authoritative-state/project-inspect")"
          echo "INSPECT_HTTP=$inspect_status"
          cat "$RUNNER_TEMP/inspect.json"
          test "$inspect_status" = 200
          jq -e '.ok == true and .authority_mode == "authoritative" and .inspection.ok == true' "$RUNNER_TEMP/inspect.json" >/dev/null

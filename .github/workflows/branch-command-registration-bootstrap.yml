name: Branch command registration bootstrap

on:
  push:
    branches:
      - fix/register-branch-role-commands

permissions:
  contents: read

jobs:
  command-registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch-role commands are canonical
        run: node scripts/verify-branch-command-registration.mjs

name: Finalize GCP migration proof dispatcher

on:
  push:
    branches:
      - ops/finalize-gcp-migration-20260908

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_REVISION: 219f4ca6b3ae130cc216fd3425e93e0bebb1f3fc
    steps:
      - name: Check out exact authoritative source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact revision is on dev and main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_REVISION"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$TARGET_REVISION"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET_REVISION"

      - name: Dispatch one exact GCP authoritative deployment through dev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/dispatch-response.json"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -X POST \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/gcp-authoritative-deploy.yml/dispatches" \
            -d "$(jq -nc --arg revision "$TARGET_REVISION" '{ref:"dev",inputs:{exact_revision:$revision}}')")"
          if [[ "$status" != 204 ]]; then
            printf 'workflow_dispatch failed (HTTP %s)\n' "$status" >&2
            cat "$response" >&2
            exit 1
          fi
          printf 'Dispatched exact GCP authoritative deployment for %s through refs/heads/dev\n' "$TARGET_REVISION"

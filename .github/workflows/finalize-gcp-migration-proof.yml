name: Finalize GCP migration proof dispatcher

on:
  push:
    branches:
      - ops/finalize-gcp-migration-20260908

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_REVISION: 82e3b81ce9fd3f925aaeaa0e36c62769ad0f58f9
      WORKFLOW: gcp-authoritative-deploy.yml
    steps:
      - name: Check out exact verified source for ref proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove dev and main are the same verified object
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_REVISION"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$TARGET_REVISION"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET_REVISION"

      - name: Dispatch authority-preserving deployment on authorized dev ref
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(date -u +%s)"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/laurajoyhutchins/overcenter/actions/workflows/$WORKFLOW/dispatches" \
            -d "{\"ref\":\"dev\",\"inputs\":{\"exact_revision\":\"$TARGET_REVISION\"}}"

          run_id=''
          for attempt in $(seq 1 12); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/laurajoyhutchins/overcenter/actions/workflows/$WORKFLOW/runs?branch=dev&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r --arg sha "$TARGET_REVISION" --argjson before "$before" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and ((.created_at | fromdateiso8601) >= ($before - 5)))] | sort_by(.id) | last | .id // empty' <<<"$response")"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched trusted dev workflow run $run_id at exact revision $TARGET_REVISION"

      - name: Publish dispatch identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          body="Authority-preserving GCP deployment dispatched on authorized \`dev\` ref at exact revision \`$TARGET_REVISION\`. Deployment workflow run: **$DEPLOY_RUN_ID**."
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/laurajoyhutchins/overcenter/issues/704/comments" \
            --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null

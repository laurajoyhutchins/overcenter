name: Diagnose GCP project.advance failure

on:
  push:
    branches:
      - ops/finalize-gcp-migration-20260908

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: project-6b810532-a302-48dc-b56
          workload_identity_provider: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
          service_account: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: latest

      - name: Read failing Cloud Run request logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="overcenter-shadow" AND resource.labels.revision_name="overcenter-shadow-00036-xg5" AND timestamp>="2026-09-08T20:02:25Z" AND timestamp<="2026-09-08T20:02:40Z"' \
            --project=project-6b810532-a302-48dc-b56 \
            --limit=200 \
            --order=asc \
            --format=json

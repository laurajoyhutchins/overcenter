name: Cancel duplicate GCP migration dispatch

on:
  push:
    branches:
      - ops/finalize-gcp-migration-20260908

permissions:
  contents: read
  actions: write

jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel duplicate queued deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DUPLICATE_RUN_ID: '34283334816'
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/cancel-response.json"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -X POST \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DUPLICATE_RUN_ID}/cancel")"
          if [[ "$status" != 202 && "$status" != 409 ]]; then
            printf 'cancel failed (HTTP %s)\n' "$status" >&2
            cat "$response" >&2
            exit 1
          fi
          printf 'Duplicate deployment run %s cancel response: HTTP %s\n' "$DUPLICATE_RUN_ID" "$status"

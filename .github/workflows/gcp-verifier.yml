name: GCP exact-head verifier

on:
  push:
    branches: [dev]
    paths:
      - .overcenter/gcp-verifier/request.json
      - .github/workflows/gcp-verifier.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-exact-head-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com

    steps:
      - name: Check out controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate verification request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          path = Path(".overcenter/gcp-verifier/request.json")
          body = json.loads(path.read_text(encoding="utf-8"))
          if set(body) != {"schema", "request_id", "profile", "revision"}:
              raise SystemExit("verification request has unexpected keys")
          if body["schema"] != "overcenter-gcp-verifier/request/v1":
              raise SystemExit("unsupported verification request schema")
          request_id = str(body["request_id"])
          if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,63}", request_id):
              raise SystemExit("invalid request_id")
          if body["profile"] != "arcata-ci":
              raise SystemExit("unsupported verification profile")
          revision = str(body["revision"])
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("revision must be an exact 40-hex commit")
          print("request_id=" + request_id)
          print("profile=arcata-ci")
          print("revision=" + revision)
          PY

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Submit exact-head verifier
        id: build
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          PROFILE: ${{ steps.request.outputs.profile }}
          REVISION: ${{ steps.request.outputs.revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$PROFILE" = "arcata-ci"

          BUILD_CONFIG="$RUNNER_TEMP/cloudbuild-exact-head-verifier.yaml"
          cat > "$BUILD_CONFIG" <<'YAML'
          serviceAccount: projects/project-6b810532-a302-48dc-b56/serviceAccounts/overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
          timeout: 600s

          steps:
            - id: private-source
              name: node:22-bookworm
              entrypoint: node
              secretEnv:
                - GITHUB_APP_PRIVATE_KEY
              env:
                - GITHUB_APP_ID=4616688
                - SOURCE_REVISION=${_REVISION}
              args:
                - -e
                - |
                  const crypto = require("crypto");
                  const fs = require("fs");

                  const expectedRepositoryId = 1402666660;
                  const expectedOwnerId = 219002713;
                  const repository = "laurajoyhutchins/arcata";
                  const revision = process.env.SOURCE_REVISION;

                  const b64 = value => Buffer.from(JSON.stringify(value)).toString("base64url");
                  const now = Math.floor(Date.now() / 1000);
                  const header = b64({ alg: "RS256", typ: "JWT" });
                  const payload = b64({
                    iat: now - 60,
                    exp: now + 540,
                    iss: process.env.GITHUB_APP_ID,
                  });
                  const unsigned = header + "." + payload;
                  const signature = crypto.sign(
                    "RSA-SHA256",
                    Buffer.from(unsigned),
                    process.env.GITHUB_APP_PRIVATE_KEY,
                  ).toString("base64url");
                  const appJwt = unsigned + "." + signature;

                  const baseHeaders = {
                    Accept: "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "overcenter-gcp-verifier",
                  };
                  const appHeaders = Object.assign(
                    {},
                    baseHeaders,
                    { Authorization: "Bearer " + appJwt },
                  );

                  async function json(response, what) {
                    if (!response.ok) {
                      throw new Error(what + " failed with HTTP " + response.status);
                    }
                    return response.json();
                  }

                  async function main() {
                    const repo = await json(
                      await fetch("https://api.github.com/repos/" + repository, {
                        headers: appHeaders,
                      }),
                      "repository identity lookup",
                    );
                    if (
                      repo.id !== expectedRepositoryId ||
                      !repo.owner ||
                      repo.owner.id !== expectedOwnerId ||
                      repo.full_name !== repository
                    ) {
                      throw new Error("private source repository identity mismatch");
                    }

                    const installation = await json(
                      await fetch(
                        "https://api.github.com/repos/" + repository + "/installation",
                        { headers: appHeaders },
                      ),
                      "installation lookup",
                    );
                    const tokenBody = await json(
                      await fetch(
                        "https://api.github.com/app/installations/" +
                          installation.id +
                          "/access_tokens",
                        {
                          method: "POST",
                          headers: Object.assign(
                            {},
                            appHeaders,
                            { "Content-Type": "application/json" },
                          ),
                          body: JSON.stringify({ permissions: { contents: "read" } }),
                        },
                      ),
                      "installation token",
                    );
                    const tokenHeaders = Object.assign(
                      {},
                      baseHeaders,
                      { Authorization: "Bearer " + tokenBody.token },
                    );

                    const commit = await json(
                      await fetch(
                        "https://api.github.com/repos/" +
                          repository +
                          "/commits/" +
                          revision,
                        { headers: tokenHeaders },
                      ),
                      "exact revision lookup",
                    );
                    if (commit.sha !== revision) {
                      throw new Error("exact revision mismatch");
                    }

                    const archive = await fetch(
                      "https://api.github.com/repos/" +
                        repository +
                        "/tarball/" +
                        revision,
                      { headers: tokenHeaders, redirect: "follow" },
                    );
                    if (!archive.ok) {
                      throw new Error(
                        "source archive failed with HTTP " + archive.status,
                      );
                    }
                    const bytes = Buffer.from(await archive.arrayBuffer());
                    if (bytes.length < 1024) {
                      throw new Error("source archive unexpectedly small");
                    }
                    fs.writeFileSync(
                      "/workspace/source.tar.gz",
                      bytes,
                      { mode: 0o600 },
                    );
                  }

                  main().catch(error => {
                    console.error(String(error && error.message || error));
                    process.exit(1);
                  });

            - id: extract-source
              name: python:3.13-bookworm
              entrypoint: python
              args:
                - -c
                - |
                  from pathlib import Path
                  import shutil
                  import tarfile

                  archive = Path("/workspace/source.tar.gz")
                  unpack = Path("/workspace/unpack")
                  target = Path("/workspace/source")
                  shutil.rmtree(unpack, ignore_errors=True)
                  shutil.rmtree(target, ignore_errors=True)
                  unpack.mkdir()
                  with tarfile.open(archive, "r:gz") as source:
                      source.extractall(unpack, filter="data")
                  entries = list(unpack.iterdir())
                  if len(entries) != 1 or not entries[0].is_dir():
                      raise SystemExit(
                          "GitHub source archive did not contain exactly one root directory"
                      )
                  shutil.move(str(entries[0]), target)

            - id: install-tools
              name: python:3.13-bookworm
              entrypoint: bash
              args:
                - -ceu
                - |
                  cd /workspace/source
                  python tools/verification_tools.py requirements > /workspace/verification-tools.txt
                  python -m venv /workspace/verification-tools
                  /workspace/verification-tools/bin/python -m pip install \
                    --disable-pip-version-check \
                    --no-input \
                    --no-compile \
                    --only-binary=:all: \
                    --no-deps \
                    --require-hashes \
                    --requirement /workspace/verification-tools.txt
                  /workspace/verification-tools/bin/python -m pip check

            - id: ruff-format
              name: python:3.13-bookworm
              dir: source
              entrypoint: /workspace/verification-tools/bin/ruff
              args: ["format", "--check", "."]

            - id: ruff-lint
              name: python:3.13-bookworm
              dir: source
              entrypoint: /workspace/verification-tools/bin/ruff
              args: ["check", "."]

            - id: mypy
              name: python:3.13-bookworm
              dir: source
              entrypoint: /workspace/verification-tools/bin/python
              args: ["-m", "mypy"]

            - id: tests
              name: python:3.13-bookworm
              dir: source
              entrypoint: python
              args: ["tools/test_all.py"]

          availableSecrets:
            secretManager:
              - versionName: projects/project-6b810532-a302-48dc-b56/secrets/overcenter-github-app-private-key/versions/latest
                env: GITHUB_APP_PRIVATE_KEY

          options:
            logging: NONE
          YAML

          BUILD_ID="$(
            gcloud builds submit \
              --async \
              --no-source \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --config="$BUILD_CONFIG" \
              --substitutions="_REVISION=$REVISION" \
              --format='value(id)'
          )"
          test -n "$BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          STATUS=""
          for _ in $(seq 1 240); do
            STATUS="$(
              gcloud builds describe "$BUILD_ID" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --format='value(status)'
            )"
            case "$STATUS" in
              SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                break
                ;;
            esac
            sleep 2
          done

          BUILD_JSON="$RUNNER_TEMP/build.json"
          gcloud builds describe "$BUILD_ID" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json > "$BUILD_JSON"

          python - "$BUILD_JSON" "$REQUEST_ID" "$PROFILE" "$REVISION" "$GITHUB_SHA" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          path, request_id, profile, revision, controller_revision = sys.argv[1:]
          body = json.load(open(path, encoding="utf-8"))
          print("## GCP exact-head verification")
          print()
          print(f"- request: `{request_id}`")
          print(f"- profile: `{profile}`")
          print(f"- source revision: `{revision}`")
          print(f"- controller revision: `{controller_revision}`")
          print(f"- Cloud Build: `{body.get('id', 'unknown')}`")
          print(f"- status: `{body.get('status', 'unknown')}`")
          print()
          print("| phase | status |")
          print("| --- | --- |")
          for step in body.get("steps", []):
              print(
                  "| `" +
                  str(step.get("id") or "unnamed") +
                  "` | `" +
                  str(step.get("status") or "unknown") +
                  "` |"
              )
          PY

          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Exact-head verification finished with Cloud Build status: $STATUS" >&2
            exit 1
          fi

name: GCP semantic command branch ingress
run-name: "GCP semantic branch ${{ github.ref_name }}"

on:
  push:
    branches:
      - 'overcenter-command/*'

permissions:
  actions: write
  contents: write

jobs:
  relay:
    if: github.actor == github.repository_owner || github.actor == 'overcenter-app[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMAND_FILE: .overcenter-command.json
    steps:
      - name: Check out exact command branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify bounded exact-revision transport envelope
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^overcenter-command/[A-Za-z0-9._-]{1,96}$ ]]
          test -f "$COMMAND_FILE"
          test "$(stat -c %s "$COMMAND_FILE")" -le 16384

          git fetch --no-tags --depth=1 origin dev
          dev_head="$(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse HEAD^)" = "$dev_head"
          test "$(git rev-list --count "$dev_head..HEAD")" = 1
          changed="$(git diff --name-only "$dev_head" "$GITHUB_SHA")"
          test "$changed" = "$COMMAND_FILE"
          expected_head="$(jq -r '.expected_head // empty' "$COMMAND_FILE")"
          test "$expected_head" = "$dev_head"

          owner="$GITHUB_REPOSITORY_OWNER"
          repo_name="${GITHUB_REPOSITORY#*/}"
          jq -n \
            --arg owner "$owner" \
            --arg repo_name "$repo_name" \
            --arg full_name "$GITHUB_REPOSITORY" \
            --rawfile body "$COMMAND_FILE" \
            '{action:"opened",issue:{number:1,title:"[overcenter-command]",body:$body,user:{login:$owner}},repository:{name:$repo_name,full_name:$full_name,owner:{login:$owner}}}' \
            > "$RUNNER_TEMP/synthetic-command-event.json"

          node scripts/github-command-issue.mjs "$RUNNER_TEMP/synthetic-command-event.json" "$dev_head" \
            > "$RUNNER_TEMP/prepared-command.json"
          jq -e '.schema == "overcenter-github-command-prepared-v1" and (.payload | type == "object")' \
            "$RUNNER_TEMP/prepared-command.json" >/dev/null

          request_id="github-command-branch-${GITHUB_SHA}"
          command="$(jq -r '.payload.command' "$RUNNER_TEMP/prepared-command.json")"
          input="$(jq -c '.payload.input' "$RUNNER_TEMP/prepared-command.json")"
          project_ref=''
          transition_id=''
          resume_ref=''
          execution_result_json=''
          command_input_0=''

          case "$command" in
            project.inspect)
              project_ref="$(jq -r '.project_ref' <<<"$input")"
              ;;
            project.advance)
              project_ref="$(jq -r '.project_ref' <<<"$input")"
              transition_id="$(jq -r '.transition_id // ""' <<<"$input")"
              resume_ref="$(jq -r '.resume_ref // ""' <<<"$input")"
              if jq -e 'has("execution_result")' <<<"$input" >/dev/null; then
                execution_result_json="$(jq -c '.execution_result' <<<"$input")"
              fi
              ;;
            project.define|project.amend)
              project_ref="$(jq -r '.project_ref' <<<"$input")"
              command_input_0="$input"
              ;;
            orchestration.maintain)
              ;;
            orchestration.diagnose|production.reconcile|github.pull_request.mark_ready|github.workflow.dispatch|github.apply_changeset|github.coalesce_changeset|github.apply_text_replacements)
              command_input_0="$input"
              ;;
            *)
              echo "unsupported prepared command: $command" >&2
              exit 2
              ;;
          esac

          jq -n \
            --arg ref "dev" \
            --arg request_id "$request_id" \
            --arg command "$command" \
            --arg project_ref "$project_ref" \
            --arg expected_head "$dev_head" \
            --arg transition_id "$transition_id" \
            --arg resume_ref "$resume_ref" \
            --arg execution_result_json "$execution_result_json" \
            --arg command_input_0 "$command_input_0" \
            '{ref:$ref,return_run_details:true,inputs:{request_id:$request_id,command:$command,project_ref:$project_ref,expected_head:$expected_head,transition_id:$transition_id,resume_ref:$resume_ref,execution_result_json:$execution_result_json,command_input_0:$command_input_0,command_input_1:"",command_input_2:"",command_input_3:"",command_input_4:"",command_input_5:""}}' \
            > "$RUNNER_TEMP/workflow-dispatch.json"

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "expected_head=$dev_head" >> "$GITHUB_OUTPUT"

      - name: Dispatch trusted dev semantic workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          http_status="$(curl --silent --show-error \
            -o "$RUNNER_TEMP/dispatch-response.json" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'content-type: application/json' \
            -X POST \
            --data-binary @"$RUNNER_TEMP/workflow-dispatch.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/gcp-semantic-command.yml/dispatches")"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -eq 0 ] && [ "$http_status" = 200 ] && \
             jq -e '(.workflow_run_id | type == "number") and (.workflow_run_id > 0) and (.run_url | type == "string" and length > 0) and (.html_url | type == "string" and length > 0)' \
               "$RUNNER_TEMP/dispatch-response.json" >/dev/null; then
            echo 'dispatch_state=confirmed' >> "$GITHUB_OUTPUT"
            echo 'may_have_dispatched=false' >> "$GITHUB_OUTPUT"
            echo "run_id=$(jq -r '.workflow_run_id' "$RUNNER_TEMP/dispatch-response.json")" >> "$GITHUB_OUTPUT"
            echo "run_url=$(jq -r '.html_url' "$RUNNER_TEMP/dispatch-response.json")" >> "$GITHUB_OUTPUT"
          else
            echo 'dispatch_state=indeterminate' >> "$GITHUB_OUTPUT"
            echo 'may_have_dispatched=true' >> "$GITHUB_OUTPUT"
          fi
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"

      - name: Prepare bounded relay receipt
        id: receipt
        if: always() && steps.prepare.outcome == 'success' && steps.dispatch.outcome == 'success'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.prepare.outputs.request_id }}
          COMMAND: ${{ steps.prepare.outputs.command }}
          EXPECTED_HEAD: ${{ steps.prepare.outputs.expected_head }}
          DISPATCH_STATE: ${{ steps.dispatch.outputs.dispatch_state }}
          MAY_HAVE_DISPATCHED: ${{ steps.dispatch.outputs.may_have_dispatched }}
          DISPATCH_HTTP_STATUS: ${{ steps.dispatch.outputs.http_status }}
          CANONICAL_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          CANONICAL_RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          set -euo pipefail
          jq -n \
            --arg schema "overcenter-github-command-branch-response-v1" \
            --arg request_id "$REQUEST_ID" \
            --arg command "$COMMAND" \
            --arg expected_head "$EXPECTED_HEAD" \
            --arg command_branch "$GITHUB_REF_NAME" \
            --arg command_commit "$GITHUB_SHA" \
            --arg dispatch_state "${DISPATCH_STATE:-indeterminate}" \
            --arg may_have_dispatched "${MAY_HAVE_DISPATCHED:-true}" \
            --arg dispatch_http_status "${DISPATCH_HTTP_STATUS:-0}" \
            --arg canonical_run_id "${CANONICAL_RUN_ID:-}" \
            --arg canonical_run_url "${CANONICAL_RUN_URL:-}" \
            '{schema:$schema,request_id:$request_id,command:$command,expected_head:$expected_head,command_branch:$command_branch,command_commit:$command_commit,dispatch_state:$dispatch_state,may_have_dispatched:($may_have_dispatched=="true"),dispatch_http_status:($dispatch_http_status|tonumber),canonical_workflow:"gcp-semantic-command.yml",canonical_run_id:(if $canonical_run_id=="" then null else ($canonical_run_id|tonumber) end),canonical_run_url:(if $canonical_run_url=="" then null else $canonical_run_url end),response_artifact_name:("semantic-response-"+$request_id)}' \
            > "$RUNNER_TEMP/bounded-relay-receipt.json"
          echo 'artifact_ready=true' >> "$GITHUB_OUTPUT"
          {
            echo '### GCP semantic command branch relay'
            echo
            echo "- request_id: \`$REQUEST_ID\`"
            echo "- expected_head: \`$EXPECTED_HEAD\`"
            echo "- dispatch_state: \`${DISPATCH_STATE:-indeterminate}\`"
            echo "- canonical_run_id: \`${CANONICAL_RUN_ID:-unresolved}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded relay receipt
        if: always() && steps.receipt.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-relay-${{ github.sha }}
          path: ${{ runner.temp }}/bounded-relay-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Retire command branch
        if: steps.dispatch.outputs.dispatch_state == 'confirmed' && steps.receipt.outputs.artifact_ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -X DELETE \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"

      - name: Assert relay certainty
        if: always()
        shell: bash
        env:
          DISPATCH_STATE: ${{ steps.dispatch.outputs.dispatch_state }}
          CANONICAL_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          test "$DISPATCH_STATE" = confirmed
          test -n "$CANONICAL_RUN_ID"

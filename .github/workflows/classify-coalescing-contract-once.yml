name: Classify coalescing semantic contract once

on:
  push:
    branches:
      - work/make-mechanical-changeset-coalescing-actionable-b8e519a367f342661c12050d

permissions:
  contents: write

jobs:
  classify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/make-mechanical-changeset-coalescing-actionable-b8e519a367f342661c12050d
          fetch-depth: 2
      - name: Fence repair to observed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c3125da8870b56d59f6e7703090cd7c2c9f60f76"
          test "$(git show -s --format=%s HEAD)" = "chore: classify coalescing semantic contract once"
      - name: Add explicit public semantic contract classification
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = '.contract-evidence/classifications.json';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          const key = 'semantic-command:github.coalesce_mechanical_changeset#input';
          if (doc.candidates[key]) throw new Error(`${key} already classified`);
          doc.candidates[key] = {
            logical_contract: 'github.coalesce_mechanical_changeset.input',
            significance: 'public',
            semver_kind: 'semantic-command-contract',
            lifecycle: 'current'
          };
          doc.candidates = Object.fromEntries(Object.entries(doc.candidates).sort(([a],[b]) => a.localeCompare(b)));
          fs.writeFileSync(path, `${JSON.stringify(doc, null, 2)}\n`);
          NODE
      - name: Commit classification and erase this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/classify-coalescing-contract-once.yml
          git add .contract-evidence/classifications.json
          git config user.name 'overcenter-app[bot]'
          git config user.email '317681347+overcenter-app[bot]@users.noreply.github.com'
          git commit -m 'chore: classify coalescing semantic contract'
          git push origin HEAD:work/make-mechanical-changeset-coalescing-actionable-b8e519a367f342661c12050d

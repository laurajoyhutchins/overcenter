name: Neutral assurance evidence execution

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source revision to verify
        required: true
        type: string
      need_json:
        description: Canonical assurance-evidence need JSON
        required: true
        type: string

permissions: {}

jobs:
  gcp-need:
    name: Realize neutral evidence on GCP
    runs-on: [self-hosted, overcenter-gcp]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Install pinned build toolchain
        run: npm install --ignore-scripts --package-lock=false

      - name: Realize exact neutral evidence need
        shell: bash
        env:
          NEED_JSON: ${{ inputs.need_json }}
        run: |
          set -euo pipefail
          need="$RUNNER_TEMP/overcenter-assurance-evidence-need.json"
          printf '%s\n' "$NEED_JSON" > "$need"
          node --experimental-strip-types scripts/realize-assurance-evidence-need.ts "$need"

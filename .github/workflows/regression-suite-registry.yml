name: Repository verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  repository-static:
    runs-on: ubuntu-latest
    env:
      PUBLIC_RELEASE_HISTORY_REF: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every maintained regression suite is registered
        run: node scripts/verify-regression-suite-registry.mjs
      - name: Test public-release policy
        run: node --test scripts/verify-public-release.test.mjs
      - name: Test public GitHub metadata policy
        run: node --test scripts/verify-public-github-metadata.test.mjs
      - name: Verify public-release boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-public-release.mjs

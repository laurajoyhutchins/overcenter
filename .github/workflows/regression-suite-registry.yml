name: Repository verification

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  repository-static:
    runs-on: ubuntu-latest
    env:
      PUBLIC_RELEASE_HISTORY_REF: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install canonical dependencies
        run: npm ci
      - name: Verify repository through the developer front door
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify
      - name: Test project inspect runtime host
        run: node --input-type=module -e "import { runProjectInspectOvercenterHostTests } from './lib/project-inspect-overcenter-host.test.js'; await runProjectInspectOvercenterHostTests();"

  temporary-contract-evidence-refresh:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/github-repository-rename-command' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install contract evidence tooling
        run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Generate evidence for the final workflow tree
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          git show origin/dev:.github/workflows/regression-suite-registry.yml > .github/workflows/regression-suite-registry.yml
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog generated/contracts/catalog.json \
            --docs docs/generated/data-contracts.md \
            --atlas docs/generated/data-contract-authority-atlas.md
      - name: Commit exact generated outputs
        run: |
          git add generated/contracts/catalog.json docs/generated/data-contracts.md docs/generated/data-contract-authority-atlas.md
          if git diff --cached --quiet; then
            echo 'Generated contract evidence is already current.'
            exit 0
          fi
          git config user.name 'overcenter-evidence-refresh[bot]'
          git config user.email 'overcenter-evidence-refresh[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh generated contract evidence'
          git push origin HEAD:${{ github.head_ref }}

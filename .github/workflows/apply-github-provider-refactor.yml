name: Apply GitHub provider refactor

on:
  push:
    branches:
      - work/gcp-github-app-provider-boundary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Apply and verify bounded refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/github-app-auth.js')
          s = p.read_text()
          changes = [
            ('import { config } from "hatchable";\n', 'import { createDefaultGitHubAppCredentialProvider, createEnvironmentGitHubAppCredentialProvider } from "./github-app-credentials.js";\n'),
            ('const USER_AGENT = "Overcenter/1.0";\n', 'const USER_AGENT = "Overcenter/1.0";\n\nexport { createEnvironmentGitHubAppCredentialProvider };\nconst DEFAULT_GITHUB_APP_CREDENTIAL_PROVIDER = createDefaultGitHubAppCredentialProvider();\n\nasync function readGitHubAppCredentials(options = {}) {\n  const provider = options.credentialProvider || DEFAULT_GITHUB_APP_CREDENTIAL_PROVIDER;\n  if (!provider || typeof provider.get !== "function") throw Object.assign(new Error("GitHub App credential provider is unavailable."), { code: "GITHUB_APP_SETUP_REQUIRED" });\n  const appId = await provider.get("GITHUB_APP_ID");\n  const privateKeyValue = await provider.get("GITHUB_APP_PRIVATE_KEY");\n  return { appId, privateKeyValue };\n}\n'),
            ('export async function getGitHubAppIdentity() {\n  const appId = await config.get("GITHUB_APP_ID");\n  const privateKeyValue = await config.get("GITHUB_APP_PRIVATE_KEY");\n', 'export async function getGitHubAppIdentity(options = {}) {\n  const { appId, privateKeyValue } = await readGitHubAppCredentials(options);\n'),
            ('export async function getGitHubAppInstallationScope(repoInput) {\n  const repo = validateRepo(repoInput);\n  const [owner, name] = repo.split("/");\n  const appId = await config.get("GITHUB_APP_ID");\n  const privateKeyValue = await config.get("GITHUB_APP_PRIVATE_KEY");\n', 'export async function getGitHubAppInstallationScope(repoInput, options = {}) {\n  const repo = validateRepo(repoInput);\n  const [owner, name] = repo.split("/");\n  const { appId, privateKeyValue } = await readGitHubAppCredentials(options);\n'),
            ('async function createInstallationToken(repo, profileName, options = {}) {\n  const repositoryScope = options.repositoryScope || "repository";\n  const appId = await config.get("GITHUB_APP_ID");\n  const privateKeyValue = await config.get("GITHUB_APP_PRIVATE_KEY");\n', 'async function createInstallationToken(repo, profileName, options = {}) {\n  const repositoryScope = options.repositoryScope || "repository";\n  const { appId, privateKeyValue } = await readGitHubAppCredentials(options);\n'),
            ('  const auth = await createInstallationToken(repo, profileName, { repositoryScope: options.repositoryScope });\n', '  const auth = await createInstallationToken(repo, profileName, { repositoryScope: options.repositoryScope, credentialProvider: options.credentialProvider });\n'),
          ]
          for old, new in changes:
            n = s.count(old)
            if n != 1:
              raise SystemExit(f'bounded replacement expected once, observed {n}')
            s = s.replace(old, new, 1)
          if 'config.get(' in s:
            raise SystemExit('Hatchable config reads remain')
          p.write_text(s)
          PY
          node scripts/github-app-auth-portability.test.mjs
          git diff --check
      - name: Commit refactor and retire this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-github-provider-refactor.yml
          git config user.name 'Overcenter migration bot'
          git config user.email 'noreply@github.com'
          git add lib/github-app-auth.js
          git commit -m 'refactor: make GitHub App credentials provider-neutral'
          git push origin HEAD:work/gcp-github-app-provider-boundary

name: Deploy GCP runner autoscaler

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .overcenter/gcp-runner-autoscaler-deploy-request
      - .overcenter/gcp-warm-idle-readback-request
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp-runner-autoscaler
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, "overcenter-gcp-${{ github.run_id }}-deploy-${{ github.run_attempt }}"]
    timeout-minutes: 45
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      EXACT_REVISION: ${{ github.sha }}

    steps:
      - name: Check out exact infrastructure revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Prove deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/gcp-cloud-run-cloud-sql-bootstrap"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXACT_REVISION" = "$GITHUB_SHA"

      - name: Classify exact one-file observation request
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              changed="$(git diff --name-only HEAD^ HEAD)"
              if [[ "$changed" == ".overcenter/gcp-warm-idle-readback-request" ]]; then
                echo "readback=true" >> "$GITHUB_OUTPUT"
              elif grep -Fxq ".overcenter/gcp-warm-idle-readback-request" <<<"$changed"; then
                echo "::error::Readback marker cannot be mixed with any other source change"
                exit 1
              else
                echo "readback=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_dispatch)
              echo "readback=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported workflow event"
              exit 1
              ;;
          esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Deploy runner substrate
        if: steps.mode.outputs.readback != 'true'
        shell: bash
        run: bash infra/gcp/deploy-runner-autoscaler.sh

      - name: Verify idle MIG without mutating GCP
        if: steps.mode.outputs.readback == 'true'
        shell: bash
        env:
          GCP_ZONE: us-west1-a
        run: bash infra/gcp/readback-runner-idle.sh

name: Semantic kernel type verification

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install canonical dependencies
        run: npm ci
      - name: Test dist runtime artifact boundary
        run: node --test scripts/dist-runtime-artifact-boundary.test.mjs
      - name: Test semantic kernel provider boundary
        run: node --test scripts/semantic-kernel-provider-boundary.test.mjs
      - name: Test project authoring TypeScript runtime ownership
        run: node --test scripts/verify-project-authoring-typescript-runtime.test.mjs
      - name: Test monotonic project authoring mutation certainty
        run: node --test scripts/verify-github-mutation-certainty.test.mjs
      - name: Test compact execution state contracts
        run: node --test scripts/verify-compact-execution-state-contracts.test.mjs
      - name: Test compact state migration invariants
        run: node --test scripts/verify-compact-state-migrations.test.mjs
      - name: Type-check semantic kernel contracts
        run: npm run typecheck
      - name: Build canonical runtime artifacts
        run: npm run build
      - name: Test runtime provenance semantics
        run: node --test scripts/runtime-provenance.test.mjs

  portable-node-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install canonical dependencies
        run: npm ci
      - name: Execute portable Node and Postgres conformance slice
        run: npm run test:integration

name: Semantic kernel type verification

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test semantic kernel provider boundary
        run: node --test scripts/semantic-kernel-provider-boundary.test.mjs
      - name: Test project authoring TypeScript runtime ownership
        run: node --test scripts/verify-project-authoring-typescript-runtime.test.mjs
      - name: Test monotonic project authoring mutation certainty
        run: node --test scripts/verify-github-mutation-certainty.test.mjs
      - name: Type-check semantic kernel contracts
        run: npx --yes --package typescript@5.9.2 tsc -p tsconfig.semantic.json
      - name: Verify runtime materialization is generated from TypeScript source
        run: |
          rm -rf .semantic-build
          npx --yes --package typescript@5.9.2 tsc -p tsconfig.semantic.runtime.json
          diff -u lib/canonical-commands.js .semantic-build/canonical-commands.js
          diff -u lib/command-contracts.js .semantic-build/command-contracts.js
          diff -u lib/compatibility-transition-bindings.js .semantic-build/compatibility-transition-bindings.js
          diff -u lib/execution-authority-contracts.js .semantic-build/execution-authority-contracts.js
          diff -u lib/execution-authority-core.js .semantic-build/execution-authority-core.js
          diff -u lib/legacy-work-execution-authority-contracts.js .semantic-build/legacy-work-execution-authority-contracts.js
          diff -u lib/execution-evidence-contracts.js .semantic-build/execution-evidence-contracts.js
          diff -u lib/execution-evidence.js .semantic-build/execution-evidence.js
          diff -u lib/execution-lifecycle-contracts.js .semantic-build/execution-lifecycle-contracts.js
          diff -u lib/mutation-certainty.js .semantic-build/mutation-certainty.js
          diff -u lib/orchestration-drive.js .semantic-build/orchestration-drive.js
          diff -u lib/production-materialization-operation.js .semantic-build/production-materialization-operation.js
          diff -u lib/project-authoring-command-contract.js .semantic-build/project-authoring-command-contract.js
          diff -u lib/project-authoring-github-runtime.js .semantic-build/project-authoring-github-runtime.js
          diff -u lib/project-authoring-runtime.js .semantic-build/project-authoring-runtime.js
          diff -u lib/project-authoring-work-branch.js .semantic-build/project-authoring-work-branch.js
          diff -u lib/project-authoring.js .semantic-build/project-authoring.js
          diff -u lib/project-definition-changeset-writer.js .semantic-build/project-definition-changeset-writer.js
          diff -u lib/project-definition-mutation-authority.js .semantic-build/project-definition-mutation-authority.js
          diff -u lib/project-graph-contracts.js .semantic-build/project-graph-contracts.js
          diff -u lib/project-graph-reconciliation.js .semantic-build/project-graph-reconciliation.js
          diff -u lib/semantic-command-descriptors.js .semantic-build/semantic-command-descriptors.js
          diff -u lib/work-settle-contract.js .semantic-build/work-settle-contract.js
      - name: Test runtime provenance semantics
        run: node --test scripts/runtime-provenance.test.mjs

  portable-node-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile portable runtime without Hatchable SDK
        run: npx --yes --package typescript@5.9.2 tsc -p tsconfig.portable-runtime.json
      - name: Install Postgres driver for portable acceptance substrate
        run: npm install --no-save --package-lock=false pg@8.13.1
      - name: Execute portable Node + Postgres conformance slice
        run: node --test scripts/node-postgres-runtime.test.mjs

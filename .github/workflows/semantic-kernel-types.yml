name: Semantic kernel type verification

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check semantic kernel contracts
        run: npx --yes --package typescript@5.9.2 tsc -p tsconfig.semantic.json
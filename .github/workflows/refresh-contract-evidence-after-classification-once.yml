name: Refresh classified contract evidence once

on:
  push:
    branches:
      - work/make-mechanical-changeset-coalescing-actionable-b8e519a367f342661c12050d

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/make-mechanical-changeset-coalescing-actionable-b8e519a367f342661c12050d
          fetch-depth: 2
      - name: Fence repair to observed classified head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "814164001618303d07d3ad7a7c25060fb9d7a41a"
          test "$(git show -s --format=%s HEAD)" = "chore: refresh classified contract evidence once"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install contract evidence tooling
        run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Generate canonical evidence
        run: |
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog generated/contracts/catalog.json \
            --docs docs/generated/data-contracts.md \
            --atlas docs/generated/data-contract-authority-atlas.md
      - name: Commit generated evidence and erase this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-contract-evidence-after-classification-once.yml
          git add generated/contracts/catalog.json docs/generated/data-contracts.md docs/generated/data-contract-authority-atlas.md
          git config user.name 'overcenter-app[bot]'
          git config user.email '317681347+overcenter-app[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh classified contract evidence'
          git push origin HEAD:work/make-mechanical-changeset-coalescing-actionable-b8e519a367f342661c12050d

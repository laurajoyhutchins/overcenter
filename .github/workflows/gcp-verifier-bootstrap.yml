name: GCP verifier source-connection inventory

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-verifier-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Inspect managed source connections
        shell: bash
        run: |
          set -uo pipefail
          echo "== Cloud Build connections =="
          if ! gcloud builds connections list \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format="table(name,disabled,installationState.stage)"; then
            echo "connections-list: unavailable"
          fi

          echo "== Cloud Build repository resources =="
          if ! gcloud builds repositories list \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format="table(name,remoteUri)"; then
            echo "repositories-list: unavailable"
          fi

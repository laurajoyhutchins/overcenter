name: Repair verify probe

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  phase:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: npm-test
            command: npm test
          - name: create-target-recovery
            command: node scripts/verify-orchestration-create-target-recovery.mjs
          - name: build
            command: npm run build
          - name: public-release
            command: node scripts/verify-public-release.mjs
    name: ${{ matrix.name }}
    env:
      PUBLIC_RELEASE_HISTORY_REF: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install canonical dependencies
        run: npm ci
      - name: Run phase
        run: ${{ matrix.command }}

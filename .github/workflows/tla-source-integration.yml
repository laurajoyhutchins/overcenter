name: TLA source integration oracle

on:
  push:
    branches:
      - experiment/tla-source-integration-micro-verifier
    paths:
      - src/source/source-integration.ts
      - src/authority/engine.ts
      - src/effect-adapter.ts
      - experiments/tla-source-integration/**
      - .github/workflows/tla-source-integration.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/source/source-integration.ts
      - src/authority/engine.ts
      - src/effect-adapter.ts
      - experiments/tla-source-integration/**
      - .github/workflows/tla-source-integration.yml

permissions:
  contents: read

jobs:
  oracle:
    name: Source integration vs TLA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned TLC 1.7.4
        id: tlc
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Check temporal source-integration boundary
        env:
          TLA2TOOLS_JAR: ${{ steps.tlc.outputs.jar }}
        run: node --experimental-strip-types experiments/tla-source-integration/experiment.ts

name: Lean VM bootstrap
on:
  push:
    branches:
      - agent/lean-vm-bootstrap-20261001

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch pinned Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            -o lean-4.19.0-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          sha256sum lean-4.19.0-linux.tar.zst > SHA256SUMS
      - name: Upload toolchain bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: lean-4.19.0-linux
          path: |
            lean-4.19.0-linux.tar.zst
            SHA256SUMS
          compression-level: 0
          retention-days: 1

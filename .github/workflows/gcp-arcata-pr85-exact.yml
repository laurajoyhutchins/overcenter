name: Arcata PR 85 exact-head GCP verification

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-arcata-pr85-exact.yml

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      ARCATA_REVISION: ad4ff3325bcb0fdeab6bf0800cc0326028cd03ff

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Show pinned Ruff formatter diff
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input ruff==0.13.2
          mkdir -p "$RUNNER_TEMP/arcata-diagnostic/tools"
          python - <<'PY'
          from pathlib import Path
          root = Path("/home/runner/work/_temp/arcata-diagnostic")
          root.mkdir(parents=True, exist_ok=True)
          (root / "tools").mkdir(exist_ok=True)
          (root / "pyproject.toml").write_text("[tool.uv.workspace]\nmembers = [\n  \"packages/components\",\n  \"packages/conductor-sizing\",\n  \"packages/project\",\n  \"packages/load-flow\",\n  \"packages/ieee1584\",\n  \"packages/motors\",\n  \"packages/short-circuit\",\n]\n\n[tool.ruff]\nrequired-version = \"==0.13.2\"\nline-length = 100\ntarget-version = \"py37\"\nextend-exclude = [\"**/_generated_sequences.py\"]\n\n[tool.ruff.per-file-target-version]\n\"packages/conductor-sizing/**/*.py\" = \"py313\"\n\"packages/motors/**/*.py\" = \"py313\"\n\n[tool.ruff.lint]\nextend-select = [\n  \"B\",\n  \"I\",\n  \"PERF\",\n  \"PGH\",\n  \"RUF\",\n  \"SIM\",\n  \"UP\",\n]\nignore = [\n  \"RUF001\",\n  \"RUF002\",\n  \"RUF003\",\n]\n\n[tool.ruff.lint.per-file-ignores]\n\"packages/ieee1584/src/ieee1584/__init__.py\" = [\"F401\", \"RUF022\"]\n\n[tool.mypy]\npython_version = \"3.13\"\nmypy_path = [\n  \"packages/components/src\",\n  \"packages/conductor-sizing/src\",\n  \"packages/project/src\",\n  \"packages/load-flow/src\",\n  \"packages/ieee1584/src\",\n  \"packages/motors/src\",\n  \"packages/short-circuit/src\",\n  \"packages/power-quality/src\",\n]\nfiles = [\n  \"packages\",\n  \"integration\",\n]\nexclude = \"(^|/)(tests(/|$)|_generated_sequences\\\\.py$)\"\ncheck_untyped_defs = true\nno_implicit_optional = true\nstrict_equality = true\nwarn_redundant_casts = true\nwarn_unreachable = true\nwarn_unused_ignores = true\nwarn_unused_configs = true\nshow_error_codes = true\npretty = true\n\n[[tool.mypy.overrides]]\nmodule = [\n  \"arcata_project\",\n  \"arcata_project.*\",\n  \"conductor_sizing\",\n  \"conductor_sizing.*\",\n  \"electrical_components\",\n  \"electrical_components.*\",\n  \"load_flow\",\n  \"load_flow.*\",\n  \"motors\",\n  \"motors.*\",\n  \"short_circuit\",\n  \"short_circuit.*\",\n  \"power_quality\",\n  \"power_quality.*\",\n]\ndisallow_any_generics = true\ndisallow_incomplete_defs = true\ndisallow_subclassing_any = true\ndisallow_untyped_calls = true\ndisallow_untyped_decorators = true\ndisallow_untyped_defs = true\nextra_checks = true\nno_implicit_reexport = true\nwarn_return_any = true\n")
          (root / "tools" / "freeze_sequence_kernels.py").write_text("#!/usr/bin/env python3\n\"\"\"Compile geometric sequence semantics into dependency-free Python kernels.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport ast\nimport inspect\nimport sys\nfrom math import sqrt\nfrom pathlib import Path\n\nfrom kingdon import Algebra\nfrom kingdon import __version__ as kingdon_version\n\nROOT = Path(__file__).resolve().parents[1]\nGENERATED = (\n    ROOT / \"packages\" / \"short-circuit\" / \"src\" / \"short_circuit\" / \"_generated_sequences.py\",\n    ROOT / \"packages\" / \"power-quality\" / \"src\" / \"power_quality\" / \"_generated_sequences.py\",\n)\n\n\ndef _compile_kernels():\n    \"\"\"Return Kingdon-compiled abc<->sequence operators from one rotor model.\"\"\"\n\n    alg = Algebra(3)\n    r120 = alg.bireflection(e=0.5, e12=-0.5, e13=0.5, e23=-0.5)\n    omega = complex(-0.5, sqrt(3.0) / 2.0)\n\n    def project(state):\n        c1 = r120 >> state\n        c2 = r120 >> c1\n        zero = (state + c1 + c2) / 3\n        positive = (state + (omega**2) * c1 + omega * c2) / 3\n        negative = (state + omega * c1 + (omega**2) * c2) / 3\n        return zero, positive, negative\n\n    @alg.add_operator(symbolic=True)\n    def phase_to_sequence(state):\n        zero, positive, negative = project(state)\n        return alg.vector(e1=zero.e1, e2=positive.e1, e3=negative.e1)\n\n    phase_to_sequence(alg.vector([1 + 2j, 3 + 4j, 5 + 6j]))\n    forward = next(iter(phase_to_sequence.operator_dict.values()))\n\n    e_a = alg.vector(e1=1.0)\n    zero_basis, positive_basis, negative_basis = project(e_a)\n    zero_basis *= 3\n    positive_basis *= 3\n    negative_basis *= 3\n\n    @alg.add_operator(symbolic=True)\n    def sequence_to_phase(zero, positive, negative):\n        return zero * zero_basis + positive * positive_basis + negative * negative_basis\n\n    sequence_to_phase(alg.scalar([1 + 0j]), alg.scalar([2 + 3j]), alg.scalar([4 + 5j]))\n    inverse = next(iter(sequence_to_phase.operator_dict.values()))\n    return forward, inverse\n\n\ndef _freeze(raw_source, *, name, args, rename, unpack_count):\n    [fn] = [node for node in ast.parse(raw_source).body if isinstance(node, ast.FunctionDef)]\n    body = list(fn.body)\n    if body and isinstance(body[0], ast.Expr) and isinstance(body[0].value, ast.Constant):\n        body.pop(0)\n    if len(body) <= unpack_count or not all(\n        isinstance(stmt, ast.Assign) for stmt in body[:unpack_count]\n    ):\n        raise RuntimeError(f\"unexpected Kingdon ABI for {name}\")\n\n    class Rename(ast.NodeTransformer):\n        def visit_Name(self, node):\n            return ast.copy_location(ast.Name(id=rename.get(node.id, node.id), ctx=node.ctx), node)\n\n    fn.name = name\n    fn.args = ast.arguments(\n        posonlyargs=[],\n        args=[\n            ast.arg(arg=arg, annotation=ast.Name(id=\"complex\", ctx=ast.Load())) for arg in args\n        ],\n        vararg=None,\n        kwonlyargs=[],\n        kw_defaults=[],\n        kwarg=None,\n        defaults=[],\n    )\n    fn.body = body[unpack_count:]\n    fn.decorator_list = []\n    fn.returns = ast.Subscript(\n        value=ast.Name(id=\"tuple\", ctx=ast.Load()),\n        slice=ast.Tuple(\n            elts=[ast.Name(id=\"complex\", ctx=ast.Load()) for _ in range(3)],\n            ctx=ast.Load(),\n        ),\n        ctx=ast.Load(),\n    )\n    fn.type_comment = None\n    Rename().visit(fn)\n    ret = fn.body[-1]\n    if not isinstance(ret, ast.Return) or not isinstance(ret.value, ast.List):\n        raise RuntimeError(f\"unexpected Kingdon output ABI for {name}\")\n    ret.value = ast.Tuple(elts=ret.value.elts, ctx=ast.Load())\n    module = ast.Module(body=[fn], type_ignores=[])\n    ast.fix_missing_locations(module)\n    return ast.unparse(module)\n\n\ndef render():\n    forward, inverse = _compile_kernels()\n    specs = (\n        (\n            forward,\n            \"phase_to_sequence_kernel\",\n            (\"a\", \"b\", \"c\"),\n            {\"state1\": \"a\", \"state2\": \"b\", \"state3\": \"c\"},\n            1,\n        ),\n        (\n            inverse,\n            \"sequence_to_phase_kernel\",\n            (\"zero\", \"positive\", \"negative\"),\n            {\"z\": \"zero\", \"p\": \"positive\", \"n\": \"negative\"},\n            3,\n        ),\n    )\n\n    sections = []\n    for compiled, name, args, rename, unpack_count in specs:\n        sections.append(\n            _freeze(\n                inspect.getsource(compiled.func),\n                name=name,\n                args=args,\n                rename=rename,\n                unpack_count=unpack_count,\n            )\n        )\n\n    generated = f\"\"\"# Generated by tools/freeze_sequence_kernels.py. DO NOT EDIT BY HAND.\n# Kingdon is a build-time compiler, not a runtime dependency.\n\nfrom __future__ import annotations\n\nKINGDON_VERSION = {kingdon_version!r}\n\n{(chr(10) * 2).join(sections)}\n\n__all__ = [\n    \"KINGDON_VERSION\",\n    \"phase_to_sequence_kernel\",\n    \"sequence_to_phase_kernel\",\n]\n\"\"\"\n    return generated\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--check\", action=\"store_true\")\n    check = parser.parse_args().check\n    generated = render()\n    outputs = tuple((path, generated) for path in GENERATED)\n    stale = [\n        path for path, expected in outputs if not path.exists() or path.read_text() != expected\n    ]\n    if check:\n        for path in stale:\n            print(f\"stale generated artifact: {path}\", file=sys.stderr)\n        return 1 if stale else 0\n    for path, expected in outputs:\n        path.write_text(expected)\n        print(f\"wrote {path}\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n")
          PY
          cd "$RUNNER_TEMP/arcata-diagnostic"
          ruff format --diff tools/freeze_sequence_kernels.py || true

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Verify Arcata exact head on Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/arcata-pr85-cloudbuild.yaml"
          cat > "$config" <<'YAML'
          serviceAccount: projects/project-6b810532-a302-48dc-b56/serviceAccounts/overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
          timeout: 600s
          steps:
            - id: private-source
              name: node:22-bookworm
              entrypoint: node
              secretEnv: [GITHUB_APP_PRIVATE_KEY]
              env:
                - GITHUB_APP_ID=4616688
                - SOURCE_REVISION=${_REVISION}
              args:
                - -e
                - |
                  const crypto = require("crypto");
                  const fs = require("fs");
                  const repository = "laurajoyhutchins/arcata";
                  const revision = process.env.SOURCE_REVISION;
                  const expectedRepositoryId = 1402666660;
                  const expectedOwnerId = 219002713;
                  const b64 = value => Buffer.from(JSON.stringify(value)).toString("base64url");
                  const now = Math.floor(Date.now() / 1000);
                  const header = b64({alg:"RS256",typ:"JWT"});
                  const payload = b64({iat:now-60,exp:now+540,iss:process.env.GITHUB_APP_ID});
                  const unsigned = header + "." + payload;
                  const signature = crypto.sign(
                    "RSA-SHA256",
                    Buffer.from(unsigned),
                    process.env.GITHUB_APP_PRIVATE_KEY,
                  ).toString("base64url");
                  const jwt = unsigned + "." + signature;
                  const baseHeaders = {
                    Accept:"application/vnd.github+json",
                    "X-GitHub-Api-Version":"2022-11-28",
                    "User-Agent":"overcenter-arcata-pr85-verifier",
                  };
                  async function json(response, label) {
                    if (!response.ok) throw new Error(label + " HTTP " + response.status);
                    return response.json();
                  }
                  async function main() {
                    const installation = await json(
                      await fetch("https://api.github.com/repos/" + repository + "/installation", {
                        headers:{...baseHeaders,Authorization:"Bearer " + jwt},
                      }),
                      "installation lookup",
                    );
                    const access = await json(
                      await fetch(
                        "https://api.github.com/app/installations/" + installation.id + "/access_tokens",
                        {
                          method:"POST",
                          headers:{
                            ...baseHeaders,
                            Authorization:"Bearer " + jwt,
                            "Content-Type":"application/json",
                          },
                          body:JSON.stringify({permissions:{contents:"read"}}),
                        },
                      ),
                      "installation token",
                    );
                    const headers={...baseHeaders,Authorization:"Bearer " + access.token};
                    const repo = await json(
                      await fetch("https://api.github.com/repos/" + repository,{headers}),
                      "repository identity",
                    );
                    if (repo.id !== expectedRepositoryId || repo.owner.id !== expectedOwnerId) {
                      throw new Error("repository identity mismatch");
                    }
                    const commit = await json(
                      await fetch(
                        "https://api.github.com/repos/" + repository + "/commits/" + revision,
                        {headers},
                      ),
                      "exact revision",
                    );
                    if (commit.sha !== revision) throw new Error("revision mismatch");
                    const archive = await fetch(
                      "https://api.github.com/repos/" + repository + "/tarball/" + revision,
                      {headers,redirect:"follow"},
                    );
                    if (!archive.ok) throw new Error("archive HTTP " + archive.status);
                    const bytes=Buffer.from(await archive.arrayBuffer());
                    if (bytes.length < 1024) throw new Error("archive unexpectedly small");
                    fs.writeFileSync("/workspace/source.tar.gz",bytes,{mode:0o600});
                  }
                  main().catch(error => {
                    console.error(String(error && error.message || error));
                    process.exit(1);
                  });

            - id: extract-source
              name: python:3.13-bookworm
              entrypoint: python
              args:
                - -c
                - |
                  from pathlib import Path
                  import shutil
                  import tarfile
                  archive=Path("/workspace/source.tar.gz")
                  unpack=Path("/workspace/unpack")
                  target=Path("/workspace/source")
                  shutil.rmtree(unpack,ignore_errors=True)
                  shutil.rmtree(target,ignore_errors=True)
                  unpack.mkdir()
                  with tarfile.open(archive,"r:gz") as source:
                      source.extractall(unpack,filter="data")
                  entries=list(unpack.iterdir())
                  if len(entries) != 1 or not entries[0].is_dir():
                      raise SystemExit("unexpected archive layout")
                  shutil.move(str(entries[0]),target)

            - id: install-tools
              name: python:3.13-bookworm
              entrypoint: bash
              args:
                - -ceu
                - |
                  cd /workspace/source
                  python tools/verification_tools.py requirements > /workspace/verification-tools.txt
                  python -m venv /workspace/verification-tools
                  /workspace/verification-tools/bin/python -m pip install \
                    --disable-pip-version-check \
                    --no-input \
                    --no-compile \
                    --only-binary=:all: \
                    --no-deps \
                    --require-hashes \
                    --requirement /workspace/verification-tools.txt
                  /workspace/verification-tools/bin/python -m pip check

            - id: formatter-diff
              name: python:3.13-bookworm
              dir: source
              entrypoint: /workspace/verification-tools/bin/ruff
              args:
                - format
                - --diff
                - tools/freeze_sequence_kernels.py

          availableSecrets:
            secretManager:
              - versionName: projects/project-6b810532-a302-48dc-b56/secrets/overcenter-github-app-private-key/versions/latest
                env: GITHUB_APP_PRIVATE_KEY
          options:
            logging: CLOUD_LOGGING_ONLY
          YAML

          build_id="$(
            gcloud builds submit \
              --async \
              --no-source \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --config="$config" \
              --substitutions="_REVISION=$ARCATA_REVISION" \
              --format='value(id)'
          )"
          test -n "$build_id"
          echo "Cloud Build: $build_id" | tee -a "$GITHUB_STEP_SUMMARY"

          status=""
          for _ in $(seq 1 240); do
            status="$(
              gcloud builds describe "$build_id" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --format='value(status)'
            )"
            case "$status" in
              SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;;
            esac
            sleep 2
          done

          gcloud builds describe "$build_id" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='table(steps.id,steps.status)' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Status: $status" | tee -a "$GITHUB_STEP_SUMMARY"
          gcloud builds log "$build_id" \
            --project="$PROJECT_ID" \
            --region="$REGION" || true
          test "$status" = SUCCESS

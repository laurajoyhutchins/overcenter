name: Diagnose GCP recovery build

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .overcenter/gcp-runner-build-diagnose-request

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnose-gcp-recovery-build
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Inspect requested recovery Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(tr -d '[:space:]' < .overcenter/gcp-runner-build-diagnose-request)"
          case "$build_id" in
            ????????-????-????-????-????????????) ;;
            *) echo "invalid build id: $build_id" >&2; exit 2 ;;
          esac
          build_json="$RUNNER_TEMP/build.json"
          gcloud builds describe "$build_id" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$build_json"
          python3 - "$build_json" <<'PY'
          import base64
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)

          print("status:", body.get("status"))
          print("failure:", (body.get("failureInfo") or {}).get("detail"))
          for index, step in enumerate(body.get("steps") or []):
              print(
                  f"step[{index}] id={step.get('id')} status={step.get('status')} "
                  f"exit={step.get('exitCode')}"
              )

          outputs = (body.get("results") or {}).get("buildStepOutputs") or []
          for index, encoded in enumerate(outputs):
              if not encoded:
                  continue
              print(f"== buildStepOutputs[{index}] ==")
              try:
                  print(base64.b64decode(encoded).decode("utf-8", errors="replace"))
              except Exception as exc:
                  print(f"<decode failed: {exc}>")
          PY
          gcloud logging read "resource.type=\"build\" AND resource.labels.build_id=\"$build_id\"" --project="$GCP_PROJECT_ID" --order=asc --limit=500 --format="value(textPayload)" || true

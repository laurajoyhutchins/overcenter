name: Diagnose GCP runner source build

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .github/workflows/gcp-runner-build-diagnose.yml

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Inspect latest failed Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(gcloud builds list \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --filter='status=FAILURE' \
            --sort-by='~createTime' \
            --limit=1 \
            --format='value(id)')"
          test -n "$build_id"
          echo "Latest failed build: $build_id"
          gcloud builds describe "$build_id" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='yaml(id,status,failureInfo,steps,images,source)'
          echo "== log tail =="
          gcloud builds log "$build_id" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" 2>&1 | tail -n 160

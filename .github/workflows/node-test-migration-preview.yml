name: Node test migration preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install canonical dependencies
        run: npm ci
      - name: Migrate legacy lib tests in disposable checkout
        run: node scripts/migrate-node-tests.mjs
      - name: Syntax-check migration patch
        run: git diff --check
      - name: Execute every migrated lib test through node:test
        shell: bash
        run: |
          mapfile -t tests < <(find lib -type f -name '*.test.js' -print | sort)
          test "${#tests[@]}" -gt 0
          node --experimental-loader ./scripts/hatchable-node-test-loader.mjs --test "${tests[@]}"
      - name: Capture exact migration patch
        if: always()
        run: git diff --binary > node-test-migration.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-test-migration-patch
          path: node-test-migration.patch
          if-no-files-found: error
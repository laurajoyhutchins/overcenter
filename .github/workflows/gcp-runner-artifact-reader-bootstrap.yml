name: Bootstrap GCP runner image reader

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .overcenter/gcp-runner-artifact-reader-bootstrap-request

permissions:
  contents: read
  id-token: write

jobs:
  grant:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      GCP_RUNTIME_SERVICE_ACCOUNT: overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      GCP_ARTIFACT_REPOSITORY: cloud-run-source-deploy

    steps:
      - name: Authenticate deployer
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      - name: Grant repository-scoped runner image read
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          resource="projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/repositories/${GCP_ARTIFACT_REPOSITORY}"
          api="https://artifactregistry.googleapis.com/v1/${resource}"
          member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" \
            "${api}:getIamPolicy?options.requestedPolicyVersion=3" \
            > "$RUNNER_TEMP/artifact-policy.json"

          python3 - "$RUNNER_TEMP/artifact-policy.json" "$RUNNER_TEMP/artifact-policy-request.json" "$member" <<'PY'
          import json
          import sys

          source, destination, member = sys.argv[1:]
          with open(source, encoding="utf-8") as handle:
              policy = json.load(handle)

          bindings = policy.setdefault("bindings", [])
          readers = next(
              (binding for binding in bindings if binding.get("role") == "roles/artifactregistry.reader"),
              None,
          )
          if readers is None:
              readers = {"role": "roles/artifactregistry.reader", "members": []}
              bindings.append(readers)
          members = readers.setdefault("members", [])
          if member not in members:
              members.append(member)

          with open(destination, "w", encoding="utf-8") as handle:
              json.dump({"policy": policy}, handle)
          PY

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/artifact-policy-request.json" \
            "${api}:setIamPolicy" \
            > "$RUNNER_TEMP/artifact-policy-applied.json"

          python3 - "$RUNNER_TEMP/artifact-policy-applied.json" "$member" <<'PY'
          import json
          import sys

          path, member = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              policy = json.load(handle)
          if not any(
              binding.get("role") == "roles/artifactregistry.reader"
              and member in (binding.get("members") or [])
              for binding in policy.get("bindings") or []
          ):
              raise SystemExit("runtime Artifact Registry reader binding did not read back")
          print("runtime Artifact Registry reader binding verified")
          PY

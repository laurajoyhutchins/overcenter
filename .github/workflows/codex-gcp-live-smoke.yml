name: Codex GCP live smoke
run-name: "Codex GCP live smoke ${{ github.sha }}"

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/codex-gcp-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codex-gcp-live-smoke
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
    steps:
      - name: Check out exact dev smoke revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact dev authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"

      - name: Authenticate to authoritative GCP runtime
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
          request_reason: Codex live smoke ${{ github.sha }}

      - name: Inspect exact authoritative project state
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          request_id="codex-smoke:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}"
          printf '%s\n' '{"command":"project.inspect","input":{"project_ref":"github:laurajoyhutchins/overcenter"}}' > "$RUNNER_TEMP/codex-smoke-request.json"
          status="$(curl --silent --show-error \
            -o "$RUNNER_TEMP/codex-smoke-response.json" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'content-type: application/json' \
            -H 'x-overcenter-authority-mode: authoritative' \
            -H "x-overcenter-request-id: $request_id" \
            -X POST \
            --data-binary @"$RUNNER_TEMP/codex-smoke-request.json" \
            "$SERVICE_AUDIENCE/api/worker-command")"
          test "$status" = "200"
          jq -e --arg revision "$GITHUB_SHA" '
            .ok == true
            and .project_ref == "github:laurajoyhutchins/overcenter"
            and .authority_revision == $revision
            and (.frontier | type == "array")
          ' "$RUNNER_TEMP/codex-smoke-response.json" >/dev/null
          jq -c '{ok,project_ref,authority_revision,frontier_count:(.frontier|length)}' "$RUNNER_TEMP/codex-smoke-response.json"

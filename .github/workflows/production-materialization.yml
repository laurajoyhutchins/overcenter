name: Production materialization

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      exact_revision:
        description: Exact production revision to reconcile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: overcenter-production-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      EXACT_REVISION: ${{ inputs.exact_revision || github.sha }}
      PRODUCTION_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install canonical dependencies
        run: npm ci
      - name: Build runtime artifact
        run: npm run build:runtime
      - name: Fence exact production head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/production-materialization-head-fence.mjs
      - name: Materialize exact production revision
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
          OVERCENTER_HATCHABLE_PRODUCTION_PROJECT: ${{ vars.OVERCENTER_HATCHABLE_PRODUCTION_PROJECT }}
        run: node scripts/production-materialization-dist-http.mjs
name: Resolve GCP runner public base

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .overcenter/gcp-runner-public-base-resolve-request

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Resolve official Ubuntu 24.04 index digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect docker.io/library/ubuntu:24.04 --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "unexpected digest: $digest" >&2; exit 1 ;;
          esac
          test "${#digest}" -eq 71
          echo "ubuntu_24_04_index_digest=$digest"

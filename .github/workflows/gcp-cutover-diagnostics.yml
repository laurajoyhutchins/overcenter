name: GCP cutover diagnostics

on:
  push:
    branches:
      - work/gcp-semantic-control-plane-cutover

permissions:
  contents: read

jobs:
  dependency-cone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Report Hatchable static imports and semantic host files
        shell: bash
        run: |
          set -euo pipefail
          echo '=== static hatchable imports ==='
          grep -R -n -E "from ['\"]hatchable['\"]" mcp lib src scripts || true
          echo '=== project semantic surface ==='
          find mcp lib src -maxdepth 3 -type f \( -name '*project*inspect*' -o -name '*project*advance*' -o -name '*production*promotion*' \) | sort

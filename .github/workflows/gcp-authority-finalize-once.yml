# Re-run after bounded GCP semantic invocation repair.
name: One-shot finalize GCP authority

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-authority-finalize-once.yml

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: overcenter-gcp-authority-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
      GCP_SERVICE: overcenter-shadow
      GCP_REGION: us-west1
      PROJECT_REF: github:laurajoyhutchins/overcenter
      EXACT_REVISION: ${{ github.sha }}
      ACCEPTANCE_TRANSITION: make-mechanical-changeset-coalescing-actionable
    steps:
      - name: Check out exact GCP authority source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact development revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXACT_REVISION"

      - name: Wait for exact-revision verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/exact-revision-v8.yml/runs?branch=dev&event=push&per_page=20"
          for attempt in $(seq 1 40); do
            body="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "$api")"
            state="$(jq -r --arg revision "$EXACT_REVISION" '[.workflow_runs[] | select(.head_sha == $revision)] | first | if . == null then "missing" elif .status != "completed" then .status else .conclusion end' <<<"$body")"
            case "$state" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale) echo "exact-revision verification failed: $state" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo 'exact-revision verification did not complete in bounded window' >&2
          exit 1

      - name: Authenticate to current GCP authority
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          request_reason: Finalize Overcenter GCP authority ${{ github.sha }}

      - name: Converge production ref through Overcenter
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/reconcile.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'content-type: application/json' \
            -X POST \
            -d '{"command":"production.reconcile","input":{"repo":"laurajoyhutchins/overcenter"}}' \
            "$SERVICE_AUDIENCE/api/worker-command")"
          cat "$RUNNER_TEMP/reconcile.json" | jq . >&2 2>/dev/null || cat "$RUNNER_TEMP/reconcile.json" >&2
          test "$status" = 200
          jq -e --arg revision "$EXACT_REVISION" '.ok == true and .outcome == "converged" and .development_revision == $revision and .production_revision == $revision' "$RUNNER_TEMP/reconcile.json" >/dev/null
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXACT_REVISION"

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Deploy exact revision into authoritative GCP runtime
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OVERCENTER_GITHUB_APP_ID: ${{ vars.OVERCENTER_GITHUB_APP_ID }}
        run: bash ./scripts/gcp/deploy-authoritative.sh

      - name: Prove reversible ordinary GCP transition cycle
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OVERCENTER_GITHUB_APP_ID: ${{ vars.OVERCENTER_GITHUB_APP_ID }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: bash ./scripts/gcp/prove-authoritative-runtime-http.sh

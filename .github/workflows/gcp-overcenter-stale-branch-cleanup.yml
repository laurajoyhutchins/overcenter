name: Temporary Overcenter stale branch cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-overcenter-stale-branch-cleanup.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-overcenter-stale-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Submit exact-head stale-branch cleanup
        shell: bash
        env:
          TARGETS_JSON: '[{"pr":597,"branch":"transport/arcata-python-compat-runtimes","mode":"temporary"},{"pr":596,"branch":"transport/arcata-pr68-source","mode":"temporary"},{"pr":595,"branch":"codex/private-source-capsule","mode":"merged"},{"pr":594,"branch":"probe/gcp-wif-arcata-branch-admin","mode":"temporary"},{"pr":592,"branch":"codex/tool-capsule-workflow","mode":"merged"},{"pr":591,"branch":"codex/tool-capsule-contract","mode":"merged"},{"pr":587,"branch":"tool-ferry/ruff-mypy-20261005","mode":"temporary"},{"pr":586,"branch":"revert/private-source-ferry","mode":"merged"},{"pr":585,"branch":"feature/private-source-ferry","mode":"merged"},{"pr":583,"branch":"fix/trusted-control-plane-merge-gate","mode":"merged"},{"pr":582,"branch":"ci/relational-assurance-orchestration","mode":"merged"},{"pr":581,"branch":"overcenter/candidate/issue-571-disposable-status-effect-import-v2","mode":"merged"},{"pr":580,"branch":"fix/source-candidate-experiment-admission","mode":"merged"},{"pr":579,"branch":"fix/durable-realization-refresh-v2","mode":"merged"},{"pr":574,"branch":"refactor/semantic-strangler-orchestration","mode":"merged"},{"pr":569,"branch":"perf/realtime-effect-admission-snapshot","mode":"merged"},{"pr":565,"branch":"cleanup/delete-current-4x4-source-contract","mode":"merged"},{"pr":563,"branch":"maintenance/fix-4x4-lean-423-proof","mode":"merged"},{"pr":555,"branch":"post-4x4/04-minimum-evidence","mode":"merged"},{"pr":525,"branch":"post-4x4/03-derived-recovery","mode":"merged"},{"pr":524,"branch":"post-4x4/02-derived-explanations","mode":"merged"},{"pr":523,"branch":"post-4x4/01-freeze-kernel","mode":"merged"},{"pr":522,"branch":"migration/4x4-09-delete-legacy","mode":"merged"},{"pr":521,"branch":"migration/4x4-08-collapse-authority","mode":"merged"},{"pr":520,"branch":"migration/4x4-07-assurance-relations","mode":"merged"},{"pr":519,"branch":"migration/4x4-06-authoritative-settlement","mode":"merged"},{"pr":518,"branch":"migration/4x4-05-shadow-settlement","mode":"merged"},{"pr":517,"branch":"migration/4x4-04-authoritative-admission","mode":"merged"},{"pr":516,"branch":"migration/4x4-03-shadow-admission","mode":"merged"},{"pr":515,"branch":"migration/4x4-02-effect-projection","mode":"merged"},{"pr":514,"branch":"migration/4x4-01-semantic-boundary","mode":"merged"},{"pr":513,"branch":"fix/base-replay-policy-duplication","mode":"merged"},{"pr":512,"branch":"fix/repository-pr-protected-scope","mode":"merged"},{"pr":510,"branch":"mvp/source-verification-profile","mode":"merged"},{"pr":508,"branch":"codex/delete-root-contracts","mode":"merged"},{"pr":507,"branch":"codex/fix-source-transaction-review","mode":"merged"},{"pr":497,"branch":"fix/recover-source-bound-claim-tail","mode":"merged"},{"pr":496,"branch":"fix/recover-invalid-authority-tail","mode":"merged"},{"pr":494,"branch":"cleanup/delete-hosted-evidence-router","mode":"merged"},{"pr":492,"branch":"codex/repository-transactions-recut","mode":"merged"},{"pr":491,"branch":"cleanup/relational-hosted-evidence","mode":"merged"},{"pr":489,"branch":"cleanup/delete-shadow-realization","mode":"merged"},{"pr":488,"branch":"cleanup/delete-implicit-graph-retirement-current","mode":"merged"},{"pr":487,"branch":"self-apply/semantic-scaling-completed-followons","mode":"merged"},{"pr":485,"branch":"cleanup/reuse-graph-patch-transaction","mode":"merged"},{"pr":484,"branch":"docs/source-proposal-transport","mode":"merged"},{"pr":481,"branch":"cleanup/single-source-proposal-ingress","mode":"merged"},{"pr":477,"branch":"cleanup/unify-project-source-work","mode":"merged"},{"pr":476,"branch":"cleanup/remove-orphan-statistics-helper","mode":"merged"},{"pr":475,"branch":"cleanup/remove-legacy-bridges","mode":"merged"},{"pr":474,"branch":"cleanup/delete-shadow-machinery","mode":"merged"},{"pr":473,"branch":"research/semantic-scaling-architecture-frontier","mode":"merged"},{"pr":472,"branch":"research/semantic-scaling-architecture-attestation","mode":"merged"},{"pr":471,"branch":"research/semantic-scaling-migration-frontier","mode":"merged"},{"pr":470,"branch":"research/semantic-scaling-behavioral-frontier","mode":"merged"},{"pr":467,"branch":"codex/transaction-foundation","mode":"merged"},{"pr":466,"branch":"research/semantic-scaling-marginal-tcb","mode":"merged"},{"pr":462,"branch":"research/semantic-scaling-falsification","mode":"merged"},{"pr":461,"branch":"docs/tighten-prose","mode":"merged"},{"pr":459,"branch":"docs/transactional-architecture","mode":"merged"},{"pr":458,"branch":"self-apply/reuse-positive-temp-age","mode":"merged"},{"pr":455,"branch":"fix/semantic-transaction-divergence","mode":"merged"},{"pr":454,"branch":"fix/disposable-recovery-projection","mode":"merged"}]'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          config="$RUNNER_TEMP/cloudbuild-overcenter-branch-cleanup.yaml"
          cat > "$config" <<'YAML'
          serviceAccount: projects/project-6b810532-a302-48dc-b56/serviceAccounts/overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
          timeout: 600s
          steps:
            - id: delete-stale-branches
              name: node:22-bookworm
              entrypoint: node
              secretEnv: [GITHUB_APP_PRIVATE_KEY]
              env:
                - GITHUB_APP_ID=4616688
                - TARGET_REPOSITORY=laurajoyhutchins/overcenter
                - EXPECTED_REPOSITORY_ID=1354872053
                - EXPECTED_OWNER_ID=219002713
                - TARGETS_JSON=${_TARGETS_JSON}
              args:
                - -e
                - |
                  const crypto = require("crypto");
                  const repoName = process.env.TARGET_REPOSITORY;
                  const targets = JSON.parse(process.env.TARGETS_JSON);

                  const b64 = value => Buffer.from(JSON.stringify(value)).toString("base64url");
                  const now = Math.floor(Date.now() / 1000);
                  const header = b64({alg:"RS256",typ:"JWT"});
                  const payload = b64({iat:now-60,exp:now+540,iss:process.env.GITHUB_APP_ID});
                  const unsigned = header + "." + payload;
                  const signature = crypto.sign(
                    "RSA-SHA256",
                    Buffer.from(unsigned),
                    process.env.GITHUB_APP_PRIVATE_KEY,
                  ).toString("base64url");
                  const appJwt = unsigned + "." + signature;

                  const baseHeaders = {
                    Accept:"application/vnd.github+json",
                    "X-GitHub-Api-Version":"2022-11-28",
                    "User-Agent":"overcenter-gcp-branch-cleanup",
                  };
                  const headers = token => ({
                    ...baseHeaders,
                    Authorization:"Bearer " + token,
                  });

                  async function body(response) {
                    const text = await response.text();
                    if (!text) return null;
                    try { return JSON.parse(text); } catch { return text; }
                  }

                  async function request(url, init, label, allowed=[]) {
                    const response = await fetch(url, init);
                    const payload = await body(response);
                    if (!response.ok && !allowed.includes(response.status)) {
                      throw new Error(label + " HTTP " + response.status + ": " +
                        String(typeof payload === "string" ? payload : JSON.stringify(payload)).slice(0,500));
                    }
                    return {response,payload};
                  }

                  const refPath = branch =>
                    branch.split("/").map(encodeURIComponent).join("/");

                  async function main() {
                    if (!Array.isArray(targets) || targets.length !== 63) {
                      throw new Error("expected exactly 63 approved targets");
                    }
                    const seen = new Set();
                    for (const target of targets) {
                      if (!target || !Number.isInteger(target.pr) ||
                          typeof target.branch !== "string" ||
                          !["merged","temporary"].includes(target.mode)) {
                        throw new Error("invalid target record");
                      }
                      if (seen.has(target.branch)) throw new Error("duplicate branch " + target.branch);
                      seen.add(target.branch);
                    }

                    const installation = (await request(
                      "https://api.github.com/repos/" + repoName + "/installation",
                      {headers:headers(appJwt)},
                      "installation lookup",
                    )).payload;
                    const access = (await request(
                      "https://api.github.com/app/installations/" + installation.id + "/access_tokens",
                      {
                        method:"POST",
                        headers:{...headers(appJwt),"Content-Type":"application/json"},
                        body:JSON.stringify({
                          permissions:{
                            administration:"write",
                            contents:"write",
                            pull_requests:"read",
                          },
                        }),
                      },
                      "installation token",
                    )).payload;
                    const token = access.token;

                    const repository = (await request(
                      "https://api.github.com/repos/" + repoName,
                      {headers:headers(token)},
                      "repository identity",
                    )).payload;
                    if (String(repository.id) !== process.env.EXPECTED_REPOSITORY_ID ||
                        String(repository.owner && repository.owner.id) !== process.env.EXPECTED_OWNER_ID ||
                        repository.full_name !== repoName) {
                      throw new Error("repository identity mismatch");
                    }

                    const openHeads = new Set();
                    for (let page=1;;page++) {
                      const prs = (await request(
                        "https://api.github.com/repos/" + repoName +
                          "/pulls?state=open&per_page=100&page=" + page,
                        {headers:headers(token)},
                        "open PR inventory",
                      )).payload;
                      for (const pr of prs) {
                        if (pr.head && pr.head.repo && pr.head.repo.full_name === repoName) {
                          openHeads.add(pr.head.ref);
                        }
                      }
                      if (prs.length < 100) break;
                    }

                    const ready = [];
                    const absent = [];
                    for (const target of targets) {
                      if (target.branch === repository.default_branch) {
                        throw new Error("refuses default branch " + target.branch);
                      }
                      if (openHeads.has(target.branch)) {
                        throw new Error("branch is an open PR head: " + target.branch);
                      }

                      const pr = (await request(
                        "https://api.github.com/repos/" + repoName + "/pulls/" + target.pr,
                        {headers:headers(token)},
                        "PR #" + target.pr,
                      )).payload;
                      if (!pr.head || !pr.head.repo || pr.head.repo.full_name !== repoName ||
                          pr.head.ref !== target.branch) {
                        throw new Error("PR identity mismatch for #" + target.pr);
                      }
                      if (target.mode === "merged" && !pr.merged) {
                        throw new Error("expected merged PR #" + target.pr);
                      }
                      if (target.mode === "temporary" &&
                          (pr.state !== "closed" || pr.merged)) {
                        throw new Error("expected closed unmerged temporary PR #" + target.pr);
                      }

                      const expectedHead = pr.head.sha;
                      const refUrl = "https://api.github.com/repos/" + repoName +
                        "/git/ref/heads/" + refPath(target.branch);
                      const got = await request(
                        refUrl,
                        {headers:headers(token)},
                        "ref read " + target.branch,
                        [404],
                      );
                      if (got.response.status === 404) {
                        absent.push(target.branch);
                        continue;
                      }
                      if (!got.payload.object || got.payload.object.sha !== expectedHead) {
                        throw new Error(
                          "exact-head fence failed for " + target.branch +
                          ": expected " + expectedHead +
                          " observed " + String(got.payload.object && got.payload.object.sha)
                        );
                      }
                      ready.push({...target, expectedHead});
                    }

                    console.log("preflight complete; deleting", ready.length, "already absent", absent.length);

                    for (const target of ready) {
                      const deleteUrl = "https://api.github.com/repos/" + repoName +
                        "/git/refs/heads/" + refPath(target.branch);
                      await request(
                        deleteUrl,
                        {method:"DELETE",headers:headers(token)},
                        "delete " + target.branch,
                      );
                    }

                    for (const target of ready) {
                      const verifyUrl = "https://api.github.com/repos/" + repoName +
                        "/git/ref/heads/" + refPath(target.branch);
                      const verify = await request(
                        verifyUrl,
                        {headers:headers(token)},
                        "readback " + target.branch,
                        [404],
                      );
                      if (verify.response.status !== 404) {
                        throw new Error("branch still exists after deletion: " + target.branch);
                      }
                    }

                    console.log(JSON.stringify({
                      approved: targets.length,
                      deleted: ready.length,
                      already_absent: absent.length,
                    }));
                  }

                  main().catch(error => {
                    console.error(String(error && error.stack || error));
                    process.exit(1);
                  });

          availableSecrets:
            secretManager:
              - versionName: projects/project-6b810532-a302-48dc-b56/secrets/overcenter-github-app-private-key/versions/latest
                env: GITHUB_APP_PRIVATE_KEY
          options:
            logging: NONE
          YAML

          build_id="$(
            gcloud builds submit               --async               --no-source               --project="$PROJECT_ID"               --region="$REGION"               --config="$config"               --substitutions="_TARGETS_JSON=$TARGETS_JSON"               --format='value(id)'
          )"
          test -n "$build_id"
          echo "Cloud Build: $build_id" | tee -a "$GITHUB_STEP_SUMMARY"

          status=""
          for _ in $(seq 1 300); do
            status="$(
              gcloud builds describe "$build_id"                 --project="$PROJECT_ID"                 --region="$REGION"                 --format='value(status)'
            )"
            case "$status" in
              SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;;
            esac
            sleep 2
          done
          echo "Status: $status" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$status" = SUCCESS

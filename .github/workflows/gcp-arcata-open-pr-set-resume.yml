name: Arcata open PR GCP set resume

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-arcata-open-pr-set-resume.yml

permissions:
  contents: read
  id-token: write

jobs:
  resume-set:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Add PR 93 and publish current set
        shell: bash
        run: |
          set -uo pipefail
          config="$RUNNER_TEMP/arcata-exact-head.yaml"
          cat > "$config" <<'YAML'
          serviceAccount: projects/project-6b810532-a302-48dc-b56/serviceAccounts/overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
          timeout: 900s
          steps:
            - id: private-source
              name: node:22-bookworm
              entrypoint: node
              secretEnv: [GITHUB_APP_PRIVATE_KEY]
              env:
                - GITHUB_APP_ID=4616688
                - SOURCE_REVISION=${_REVISION}
              args:
                - -e
                - |
                  const crypto=require("crypto"),fs=require("fs");
                  const repository="laurajoyhutchins/arcata",revision=process.env.SOURCE_REVISION;
                  const b64=v=>Buffer.from(JSON.stringify(v)).toString("base64url"),now=Math.floor(Date.now()/1000);
                  const unsigned=b64({alg:"RS256",typ:"JWT"})+"."+b64({iat:now-60,exp:now+540,iss:process.env.GITHUB_APP_ID});
                  const jwt=unsigned+"."+crypto.sign("RSA-SHA256",Buffer.from(unsigned),process.env.GITHUB_APP_PRIVATE_KEY).toString("base64url");
                  const base={Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"overcenter-arcata-set"};
                  async function j(r,l){const t=await r.text();if(!r.ok)throw new Error(l+" HTTP "+r.status+": "+t.slice(0,300));return JSON.parse(t)}
                  (async()=>{
                    const i=await j(await fetch("https://api.github.com/repos/"+repository+"/installation",{headers:{...base,Authorization:"Bearer "+jwt}}),"installation");
                    const a=await j(await fetch("https://api.github.com/app/installations/"+i.id+"/access_tokens",{method:"POST",headers:{...base,Authorization:"Bearer "+jwt,"Content-Type":"application/json"},body:JSON.stringify({repository_ids:[1402666660],permissions:{contents:"read"}})}),"token");
                    const h={...base,Authorization:"Bearer "+a.token};
                    const repo=await j(await fetch("https://api.github.com/repos/"+repository,{headers:h}),"repo");
                    if(repo.id!==1402666660||!repo.owner||repo.owner.id!==219002713||repo.full_name!==repository)throw new Error("repository identity mismatch");
                    const c=await j(await fetch("https://api.github.com/repos/"+repository+"/commits/"+revision,{headers:h}),"revision");
                    if(c.sha!==revision)throw new Error("revision mismatch");
                    const a2=await fetch("https://api.github.com/repos/"+repository+"/tarball/"+revision,{headers:h,redirect:"follow"});
                    if(!a2.ok)throw new Error("archive HTTP "+a2.status);
                    fs.writeFileSync("/workspace/source.tar.gz",Buffer.from(await a2.arrayBuffer()),{mode:0o600});
                  })().catch(e=>{console.error(String(e&&e.message||e));process.exit(1)});
            - id: extract-source
              name: python:3.13-bookworm
              entrypoint: python
              args: ["-c", "from pathlib import Path; import tarfile,shutil; u=Path('/workspace/u'); s=Path('/workspace/source'); shutil.rmtree(u,ignore_errors=True); shutil.rmtree(s,ignore_errors=True); u.mkdir(); tarfile.open('/workspace/source.tar.gz','r:gz').extractall(u,filter='data'); e=list(u.iterdir()); assert len(e)==1 and e[0].is_dir(); shutil.move(str(e[0]),s)"]
            - id: install-tools
              name: python:3.13-bookworm
              entrypoint: bash
              args:
                - -ceu
                - |
                  cd /workspace/source
                  python tools/verification_tools.py requirements > /workspace/verification-tools.txt
                  python -m venv /workspace/verification-tools
                  /workspace/verification-tools/bin/python -m pip install --disable-pip-version-check --no-input --no-compile --only-binary=:all: --no-deps --require-hashes --requirement /workspace/verification-tools.txt
                  /workspace/verification-tools/bin/python -m pip check
            - id: arcata-check
              name: python:3.13-bookworm
              dir: source
              entrypoint: bash
              args: ["-ceu", "export PATH=/workspace/verification-tools/bin:$$PATH; python tools/check.py"]
          availableSecrets:
            secretManager:
              - versionName: projects/project-6b810532-a302-48dc-b56/secrets/overcenter-github-app-private-key/versions/latest
                env: GITHUB_APP_PRIVATE_KEY
          options:
            logging: NONE
          YAML

          sha93=93ff81c0a3a7c8c7837a8f0ca0ed16e46a5b2e3d
          id93="$(gcloud builds submit --async --no-source --project="$PROJECT_ID" --region="$REGION" --config="$config" --substitutions="_REVISION=$sha93" --format='value(id)' 2>/dev/null || true)"
          test -n "$id93" || { echo "failed to submit PR #93"; exit 1; }
          echo "PR #93 Cloud Build: $id93"

          for _ in $(seq 1 300); do
            s="$(gcloud builds describe "$id93" --project="$PROJECT_ID" --region="$REGION" --format='value(status)' 2>/dev/null || true)"
            case "$s" in SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;; esac
            sleep 2
          done

          builds="$RUNNER_TEMP/current-set.tsv"
          cat > "$builds" <<BUILDS
          93 $sha93 $id93
          92 44e665a8ada6a4f58ff92aeca0ab0490677af370 c49b0e0c-bd06-4977-abcb-f5fb14f6fa98
          91 691eb17e56b7f62beeadcc03c135cad24bd77914 746d7ad4-346a-4384-abda-2c0e7109f4f0
          90 8738d4e966b00590e19411b20c205bc9749903b5 0bc3d25d-89cc-4ebb-8164-ae5140d73908
          89 06a3e144ed724c89aadb524d241d2a45a1f1c923 0259f164-ced8-4e90-ad0e-d00d64b4262f
          88 708368241cfb671f456ece2d8b3629e9176aa7a6 e8728652-e273-44aa-aa36-da9d7f78d071
          85 0adafcddddf2ff769926b81ae4f13582015516d0 9e3f7fad-f595-42ae-952b-77dc488d5462
          84 eea412516f5561c0451082425d1a8ce850046363 fbec0ded-4cb2-44a4-90a9-7124a0be1485
          82 f1eda022a5c5b1ed71f9149c5977521a90ed1ea7 b0f7a1f3-da4d-460e-8d4d-c5b7f1cecdc6
          80 5669b06e9b21ed118596cb40f7540a4f84c3bcc2 c7d7db25-6d3e-479c-b28e-df0466b2748e
          24 7d0865a02e83404c59de531a3f8b7586043a07b9 6cecd9cc-2fb4-49e8-8495-f90de36eac8c
          20 357cf6153ac29f6bd46f246d1acf6394b9855f63 fb1b06fe-3bf3-4b4a-b813-e38689fb2edc
          19 5a3e7f2f25dc833fb62f942c2a09f76e926b6c09 1bcedd62-672e-4a0d-87d5-9ddd89783f2a
          17 2a3065c1b548446b1f1cca91065386c8498a084d 5f33a48a-a88b-4626-954a-def8d0804060
          15 9ee3cf6c261d37a949e99b205a44c5ac5c98125c 0d37481a-0168-4546-99c3-cfc0646328e2
          BUILDS
          echo "## Current Arcata open PR GCP set" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '| PR | exact head | status | phases |' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '| ---: | --- | --- | --- |' | tee -a "$GITHUB_STEP_SUMMARY"
          while read -r pr sha id; do
            j="$RUNNER_TEMP/$pr.json"
            if ! gcloud builds describe "$id" --project="$PROJECT_ID" --region="$REGION" --format=json > "$j" 2>/dev/null; then
              echo "| #$pr | \`$sha\` | \`DESCRIBE_ERROR\` |  |" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            python - "$j" "$pr" "$sha" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json,sys
          body=json.load(open(sys.argv[1],encoding='utf-8'))
          phases=', '.join(f"{s.get('id')}={s.get('status')}" for s in body.get('steps',[]))
          print(f"| #{sys.argv[2]} | `{sys.argv[3]}` | `{body.get('status')}` | `{phases}` |")
          PY
          done < "$builds"

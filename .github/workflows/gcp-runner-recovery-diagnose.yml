name: Diagnose recovery runner builds

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .overcenter/gcp-runner-recovery-diagnose.json

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Inspect requested recovery builds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/build-ids"
          import json
          body=json.load(open(".overcenter/gcp-runner-recovery-diagnose.json"))
          for build_id in body["build_ids"]:
              print(build_id)
          PY
          while IFS= read -r build_id; do
            echo "===== $build_id ====="
            gcloud builds describe "$build_id"               --project="$GCP_PROJECT_ID"               --region="$GCP_REGION"               --format='yaml(id,status,failureInfo,steps.id,steps.status,createTime,startTime,finishTime)'
            echo "===== log tail $build_id ====="
            gcloud builds log "$build_id"               --project="$GCP_PROJECT_ID"               --region="$GCP_REGION" 2>&1 | tail -n 180 || true
          done < "$RUNNER_TEMP/build-ids"

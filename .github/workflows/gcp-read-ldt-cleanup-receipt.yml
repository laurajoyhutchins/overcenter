name: Read Laura Dev Tools cleanup receipt

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-read-ldt-cleanup-receipt.yml

permissions:
  contents: read
  id-token: write

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      BUILD_ID: 23506301-74c3-4b88-abb5-f0a173f53ede
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Read receipt
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds describe "$BUILD_ID" --project="$PROJECT_ID" --region="$REGION" --format=json > "$RUNNER_TEMP/build.json"
          python - "$RUNNER_TEMP/build.json" <<'PY'
          import base64, json, sys
          body=json.load(open(sys.argv[1],encoding='utf-8'))
          print("BUILD_STATUS="+str(body.get("status")))
          for raw in body.get("results",{}).get("buildStepOutputs",[]):
              if not raw:
                  continue
              raw=raw.strip()
              raw += "=" * (-len(raw) % 4)
              print(base64.b64decode(raw).decode("utf-8","replace"))
          PY

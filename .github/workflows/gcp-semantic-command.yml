name: GCP semantic command
run-name: GCP semantic ${{ inputs.command }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation id emitted by the bounded Hatchable broker
        required: true
        type: string
      command:
        description: Allowlisted Overcenter semantic command
        required: true
        type: choice
        options:
          - project.inspect
          - project.advance
      project_ref:
        description: Canonical repository-owned project ref
        required: true
        type: string
      expected_head:
        description: Exact main revision expected by the caller
        required: true
        type: string
      transition_id:
        description: Optional exact transition nomination for project.advance
        required: false
        default: ''
        type: string
      resume_ref:
        description: Optional durable project.advance continuation ref
        required: false
        default: ''
        type: string
      execution_result_json:
        description: Optional JSON settlement result paired with resume_ref
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: overcenter-gcp-semantic-${{ inputs.project_ref }}
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
      COMMAND: ${{ inputs.command }}
      PROJECT_REF: ${{ inputs.project_ref }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      TRANSITION_ID: ${{ inputs.transition_id }}
      RESUME_REF: ${{ inputs.resume_ref }}
      EXECUTION_RESULT_JSON: ${{ inputs.execution_result_json }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Check out exact invocation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact authoritative target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_HEAD"
          test "$PROJECT_REF" = 'github:laurajoyhutchins/overcenter'
          case "$COMMAND" in
            project.inspect|project.advance) ;;
            *) echo "unsupported semantic command: $COMMAND" >&2; exit 2 ;;
          esac
          if [ "$COMMAND" = project.inspect ]; then
            test -z "$TRANSITION_ID"
            test -z "$RESUME_REF"
            test -z "$EXECUTION_RESULT_JSON"
          fi
          if [ -n "$EXECUTION_RESULT_JSON" ]; then
            test -n "$RESUME_REF"
            jq -e 'type == "object"' <<<"$EXECUTION_RESULT_JSON" >/dev/null
          fi

      - name: Authenticate to authoritative GCP runtime
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          request_reason: Overcenter semantic command ${{ inputs.request_id }}

      - name: Invoke semantic command
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          input="$(jq -n --arg project_ref "$PROJECT_REF" '{project_ref:$project_ref}')"
          if [ "$COMMAND" = project.advance ]; then
            if [ -n "$TRANSITION_ID" ]; then
              input="$(jq --arg transition_id "$TRANSITION_ID" '. + {transition_id:$transition_id}' <<<"$input")"
            fi
            if [ -n "$RESUME_REF" ]; then
              input="$(jq --arg resume_ref "$RESUME_REF" '. + {resume_ref:$resume_ref}' <<<"$input")"
            fi
            if [ -n "$EXECUTION_RESULT_JSON" ]; then
              input="$(jq --argjson execution_result "$EXECUTION_RESULT_JSON" '. + {execution_result:$execution_result}' <<<"$input")"
            fi
          fi
          payload="$(jq -n --arg command "$COMMAND" --argjson input "$input" '{command:$command,input:$input}')"
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/semantic-response.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'content-type: application/json' \
            -H 'x-overcenter-authority-mode: authoritative' \
            -H "x-overcenter-request-id: $REQUEST_ID" \
            -X POST \
            -d "$payload" \
            "$SERVICE_AUDIENCE/api/worker-command")"
          jq . "$RUNNER_TEMP/semantic-response.json" || cat "$RUNNER_TEMP/semantic-response.json"
          test "$status" = 200
          jq -e '.ok == true' "$RUNNER_TEMP/semantic-response.json" >/dev/null

name: GCP semantic command
run-name: GCP semantic ${{ inputs.command }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation id emitted by the bounded Hatchable broker
        required: true
        type: string
      command:
        description: Allowlisted Overcenter semantic command
        required: true
        type: choice
        options:
          - project.inspect
          - project.advance
          - project.amend
          - github.pull_request.mark_ready
          - github.apply_changeset
          - github.apply_text_replacements
      project_ref:
        description: Canonical target project ref for project commands; empty for lease/integration commands
        required: false
        default: ''
        type: string
      expected_head:
        description: Exact Overcenter dev control-plane revision expected by the caller
        required: true
        type: string
      transition_id:
        description: Optional exact transition nomination for project.advance
        required: false
        default: ''
        type: string
      resume_ref:
        description: Optional durable project.advance continuation ref
        required: false
        default: ''
        type: string
      execution_result_json:
        description: Optional JSON settlement result paired with resume_ref
        required: false
        default: ''
        type: string
      command_input_0:
        description: Bounded internal mutation input chunk 0
        required: false
        default: ''
        type: string
      command_input_1:
        description: Bounded internal mutation input chunk 1
        required: false
        default: ''
        type: string
      command_input_2:
        description: Bounded internal mutation input chunk 2
        required: false
        default: ''
        type: string
      command_input_3:
        description: Bounded internal mutation input chunk 3
        required: false
        default: ''
        type: string
      command_input_4:
        description: Bounded internal mutation input chunk 4
        required: false
        default: ''
        type: string
      command_input_5:
        description: Bounded internal mutation input chunk 5
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: overcenter-gcp-semantic-control-plane
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
      COMMAND: ${{ inputs.command }}
      PROJECT_REF: ${{ inputs.project_ref }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      TRANSITION_ID: ${{ inputs.transition_id }}
      RESUME_REF: ${{ inputs.resume_ref }}
      EXECUTION_RESULT_JSON: ${{ inputs.execution_result_json }}
      COMMAND_INPUT_0: ${{ inputs.command_input_0 }}
      COMMAND_INPUT_1: ${{ inputs.command_input_1 }}
      COMMAND_INPUT_2: ${{ inputs.command_input_2 }}
      COMMAND_INPUT_3: ${{ inputs.command_input_3 }}
      COMMAND_INPUT_4: ${{ inputs.command_input_4 }}
      COMMAND_INPUT_5: ${{ inputs.command_input_5 }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Check out exact invocation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact authoritative target
        shell: bash
        run: |
          set -euo pipefail
          command_input_json="${COMMAND_INPUT_0}${COMMAND_INPUT_1}${COMMAND_INPUT_2}${COMMAND_INPUT_3}${COMMAND_INPUT_4}${COMMAND_INPUT_5}"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_HEAD"
          # Production convergence is enforced by promotion/deployment, not generic semantic admission.
          case "$COMMAND" in
            project.inspect|project.advance|project.amend|github.pull_request.mark_ready|github.apply_changeset|github.apply_text_replacements) ;;
            *) echo "unsupported semantic command: $COMMAND" >&2; exit 2 ;;
          esac
          case "$COMMAND" in
            project.inspect)
              [[ "$PROJECT_REF" =~ ^github:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
              test -z "$TRANSITION_ID"
              test -z "$RESUME_REF"
              test -z "$EXECUTION_RESULT_JSON"
              test -z "$command_input_json"
              ;;
            project.advance)
              [[ "$PROJECT_REF" =~ ^github:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
              test -z "$command_input_json"
              if [ -n "$EXECUTION_RESULT_JSON" ]; then
                test -n "$RESUME_REF"
                jq -e 'type == "object"' <<<"$EXECUTION_RESULT_JSON" >/dev/null
              fi
              ;;
            project.amend)
              [[ "$PROJECT_REF" =~ ^github:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
              test -z "$TRANSITION_ID"
              test -z "$RESUME_REF"
              test -z "$EXECUTION_RESULT_JSON"
              test -n "$command_input_json"
              jq -e \
                --arg project_ref "$PROJECT_REF" \
                'type == "object"
                  and (keys == ["amendment","expected_revision","project_ref"])
                  and (.project_ref == $project_ref)
                  and (.expected_revision | type == "string" and test("^[0-9a-f]{40}$"))
                  and ((.amendment | type) == "object")' \
                <<<"$command_input_json" >/dev/null
              ;;
            github.pull_request.mark_ready)
              test -z "$PROJECT_REF"
              test -z "$TRANSITION_ID"
              test -z "$RESUME_REF"
              test -z "$EXECUTION_RESULT_JSON"
              test -n "$command_input_json"
              jq -e '
                type == "object"
                and ((keys - ["expected_head","pull_request","repo","run_id"]) | length == 0)
                and has("repo") and has("pull_request") and has("expected_head")
                and (.repo | type == "string" and test("^[A-Za-z0-9_.-]+\\/[A-Za-z0-9_.-]+$"))
                and (.pull_request | type == "number")
                and (.pull_request >= 1 and .pull_request == (.pull_request | floor))
                and (.expected_head | type == "string" and test("^[0-9a-f]{40}$"))
                and ((has("run_id") | not) or (.run_id | type == "string" and length > 0 and length <= 512))' \
                <<<"$command_input_json" >/dev/null
              ;;
            github.apply_changeset|github.apply_text_replacements)
              test -z "$PROJECT_REF"
              test -z "$TRANSITION_ID"
              test -z "$RESUME_REF"
              test -z "$EXECUTION_RESULT_JSON"
              test -n "$command_input_json"
              jq -e 'type == "object" and (.lease_ref | type == "string" and length > 0)' <<<"$command_input_json" >/dev/null
              ;;
          esac

      - name: Authenticate to authoritative GCP runtime
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          request_reason: Overcenter semantic command ${{ inputs.request_id }}

      - name: Invoke semantic command
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          command_input_json="${COMMAND_INPUT_0}${COMMAND_INPUT_1}${COMMAND_INPUT_2}${COMMAND_INPUT_3}${COMMAND_INPUT_4}${COMMAND_INPUT_5}"
          case "$COMMAND" in
            project.amend|github.pull_request.mark_ready|github.apply_changeset|github.apply_text_replacements)
              input="$command_input_json"
              ;;
            *)
              input="$(jq -n --arg project_ref "$PROJECT_REF" '{project_ref:$project_ref}')"
              if [ "$COMMAND" = project.advance ]; then
                if [ -n "$TRANSITION_ID" ]; then
                  input="$(jq --arg transition_id "$TRANSITION_ID" '. + {transition_id:$transition_id}' <<<"$input")"
                fi
                if [ -n "$RESUME_REF" ]; then
                  input="$(jq --arg resume_ref "$RESUME_REF" '. + {resume_ref:$resume_ref}' <<<"$input")"
                fi
                if [ -n "$EXECUTION_RESULT_JSON" ]; then
                  input="$(jq --argjson execution_result "$EXECUTION_RESULT_JSON" '. + {execution_result:$execution_result}' <<<"$input")"
                fi
              fi
              ;;
          esac
          payload="$(jq -n --arg command "$COMMAND" --argjson input "$input" '{command:$command,input:$input}')"
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/semantic-response.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'content-type: application/json' \
            -H 'x-overcenter-authority-mode: authoritative' \
            -H "x-overcenter-request-id: $REQUEST_ID" \
            -X POST \
            -d "$payload" \
            "$SERVICE_AUDIENCE/api/worker-command")"
          jq . "$RUNNER_TEMP/semantic-response.json" || cat "$RUNNER_TEMP/semantic-response.json"
          test "$status" = 200
          jq -e '.ok == true' "$RUNNER_TEMP/semantic-response.json" >/dev/null

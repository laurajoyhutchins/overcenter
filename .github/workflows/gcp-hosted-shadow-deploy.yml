name: GCP hosted shadow deployment

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prove-authoritative-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_REVISION: d94369c349c57e25b92ceb5f713ea80bb0eee5c6
      EXPECTED_FREEZE_DIGEST: sha256:3ff040b3ebb60b89af860c1d3a140aef3be58652fdb1abca592ec45fb7c764b5
      GCP_SERVICE: overcenter-shadow
      GCP_REGION: us-west1
      PROJECT_REF: github:laurajoyhutchins/overcenter
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
    steps:
      - name: Prove repository authority is still frozen revision
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote https://github.com/laurajoyhutchins/overcenter.git refs/heads/main | cut -f1)"
          test "$observed" = "$EXPECTED_REVISION"
          echo "main exact revision: $observed"

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
          id_token_include_email: true
          request_reason: Overcenter post-cutover project.inspect diagnosis

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Prove Cloud Run authority binding
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$GCP_SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          ready="$(jq -r '.status.latestReadyRevisionName' "$RUNNER_TEMP/service.json")"
          created="$(jq -r '.status.latestCreatedRevisionName' "$RUNNER_TEMP/service.json")"
          mode="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "OVERCENTER_AUTHORITY_MODE") | .value' "$RUNNER_TEMP/service.json")"
          revision="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "OVERCENTER_SOURCE_REVISION") | .value' "$RUNNER_TEMP/service.json")"
          digest="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "OVERCENTER_SOURCE_FREEZE_DIGEST") | .value' "$RUNNER_TEMP/service.json")"
          url="$(jq -r '.status.url' "$RUNNER_TEMP/service.json")"
          test -n "$ready" && test "$ready" = "$created"
          test "$mode" = authoritative
          test "$revision" = "$EXPECTED_REVISION"
          test "$digest" = "$EXPECTED_FREEZE_DIGEST"
          test "$url" = "$SERVICE_AUDIENCE"
          echo "ready revision: $ready"
          echo "authority mode: $mode"
          echo "source revision: $revision"
          echo "freeze digest: $digest"

      - name: Diagnose project.inspect semantic response
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          test -n "$ID_TOKEN"
          health_status="$(curl --silent --show-error -o "$RUNNER_TEMP/health.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_AUDIENCE/health")"
          echo "health HTTP $health_status"
          jq . "$RUNNER_TEMP/health.json"
          test "$health_status" = 200

          direct_status="$(curl --silent --show-error -o "$RUNNER_TEMP/direct.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'content-type: application/json' -X POST -d "{\"project_ref\":\"$PROJECT_REF\"}" "$SERVICE_AUDIENCE/api/authoritative-state/project-inspect")"
          echo "direct project-inspect HTTP $direct_status"
          jq . "$RUNNER_TEMP/direct.json"

          worker_status="$(curl --silent --show-error -o "$RUNNER_TEMP/worker.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'content-type: application/json' -X POST -d "{\"command\":\"project.inspect\",\"input\":{\"project_ref\":\"$PROJECT_REF\"}}" "$SERVICE_AUDIENCE/api/worker-command")"
          echo "worker project.inspect HTTP $worker_status"
          jq . "$RUNNER_TEMP/worker.json"
          test "$worker_status" = 200

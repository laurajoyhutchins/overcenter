name: GCP hosted shadow deployment

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  describe-repair-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove repository authority is still frozen revision
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote https://github.com/laurajoyhutchins/overcenter.git refs/heads/main | cut -f1)"
          test "$observed" = "d94369c349c57e25b92ceb5f713ea80bb0eee5c6"

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          request_reason: Describe failed Overcenter repair execution

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Describe failed execution
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs executions describe overcenter-prefreeze-residue-repair-8n9gs \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region=us-west1 \
            --format='yaml(metadata.name,status.conditions,status.failedCount,status.succeededCount,status.logUri)'

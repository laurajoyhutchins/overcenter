name: GCP hosted shadow deployment

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-project-advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SERVICE: overcenter-shadow
      GCP_REGION: us-west1
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          request_reason: Read authoritative Overcenter project.advance failure logs

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Read bounded Cloud Run logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="overcenter-shadow" AND timestamp>="2026-09-08T23:32:55Z" AND timestamp<="2026-09-08T23:33:20Z"' \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --limit=200 \
            --order=asc \
            --format=json > "$RUNNER_TEMP/logs.json"
          jq '[.[] | {timestamp,severity,textPayload,jsonPayload,httpRequest,labels,resource}]' "$RUNNER_TEMP/logs.json"

name: One-shot GCP authority promotion

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-production-promote-once.yml

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: overcenter-gcp-production-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
      EXACT_REVISION: ${{ github.sha }}
    steps:
      - name: Prove exact development source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$GITHUB_SHA" = "$EXACT_REVISION"

      - name: Wait for exact-revision verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/exact-revision-v8.yml/runs?branch=dev&event=push&per_page=20"
          for attempt in $(seq 1 40); do
            body="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "$api")"
            state="$(jq -r --arg revision "$EXACT_REVISION" '
              [.workflow_runs[] | select(.head_sha == $revision)] | first |
              if . == null then "missing"
              elif .status != "completed" then .status
              else .conclusion end' <<<"$body")"
            case "$state" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale) echo "exact-revision verification failed: $state" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo 'exact-revision verification did not complete in bounded window' >&2
          exit 1

      - name: Authenticate to current GCP authority
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          request_reason: One-shot Overcenter semantic production promotion ${{ github.sha }}

      - name: Promote through Overcenter semantic authority
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/promotion.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'content-type: application/json' \
            -X POST \
            -d '{"command":"production.promote","input":{"repo":"laurajoyhutchins/overcenter"}}' \
            "$SERVICE_AUDIENCE/api/worker-command")"
          if [[ "$status" != 200 ]]; then
            printf 'production.promote failed (HTTP %s)\n' "$status" >&2
            jq . "$RUNNER_TEMP/promotion.json" >&2 2>/dev/null || cat "$RUNNER_TEMP/promotion.json" >&2
            exit 1
          fi
          jq -e --arg revision "$EXACT_REVISION" \
            '.ok == true and .source_revision == $revision and .production_revision == $revision and (.verification_ref | type == "string")' \
            "$RUNNER_TEMP/promotion.json" >/dev/null

      - name: Prove production readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXACT_REVISION"

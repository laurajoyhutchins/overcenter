name: GitHub object transport proof

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize]
    paths:
      - '.github/workflows/github-object-transport-proof.yml'

permissions: {}

jobs:
  runtime-capsule:
    name: CPython ${{ matrix.python-version }} runtime capsule
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Materialize interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Package exact runtime
        shell: bash
        run: |
          set -euo pipefail
          python -VV
          printf '%s\n' "$pythonLocation" > python-location.txt
          python - <<'PY' > runtime.json
          import json, platform, sys
          print(json.dumps({
              "implementation": platform.python_implementation(),
              "version": platform.python_version(),
              "version_info": list(sys.version_info[:3]),
              "executable": sys.executable,
              "prefix": sys.prefix,
              "platform": platform.platform(),
              "machine": platform.machine(),
          }, sort_keys=True))
          PY
          tar -C "$pythonLocation" -czf "cpython-${{ matrix.python-version }}-linux-x64.tar.gz" .
          sha256sum "cpython-${{ matrix.python-version }}-linux-x64.tar.gz" > runtime.sha256

      - name: Upload runtime capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpython-${{ matrix.python-version }}-linux-x64
          path: |
            cpython-${{ matrix.python-version }}-linux-x64.tar.gz
            runtime.sha256
            runtime.json
            python-location.txt
          if-no-files-found: error
          retention-days: 1

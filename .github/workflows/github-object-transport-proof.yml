name: GitHub object transport proof

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize]
    paths:
      - '.github/workflows/github-object-transport-proof.yml'

permissions: {}

jobs:
  arcata-source-capsule:
    name: Arcata exact-source capsule
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions: {}
    env:
      ARCATA_REPOSITORY: laurajoyhutchins/arcata
      BASE_SHA: 678543912fb9c1c9c9364b3b68b584377a26e539
      FEATURE_SHA: 031237805748f1577ba823eaa7444e28cead1a6e
    steps:
      - name: Materialize synthetic merge tree
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location             "https://codeload.github.com/${ARCATA_REPOSITORY}/tar.gz/${BASE_SHA}"             -o base.tar.gz
          curl --fail --silent --show-error --location             "https://codeload.github.com/${ARCATA_REPOSITORY}/tar.gz/${FEATURE_SHA}"             -o feature.tar.gz

          mkdir source feature
          tar -xzf base.tar.gz --strip-components=1 -C source
          tar -xzf feature.tar.gz --strip-components=1 -C feature

          paths=(
            benchmarks/tests/test_workloads.py
            benchmarks/workloads.py
            packages/short-circuit/src/short_circuit/linalg.py
            packages/short-circuit/src/short_circuit/solver.py
            packages/short-circuit/tests/test_linalg.py
            packages/short-circuit/tests/test_short_circuit.py
          )

          : > feature-blobs.tsv
          for path in "${paths[@]}"; do
            test -f "feature/${path}"
            mkdir -p "source/$(dirname "${path}")"
            cp -p "feature/${path}" "source/${path}"
            blob="$(git hash-object "feature/${path}")"
            printf '%s\t%s\n' "${path}" "${blob}" >> feature-blobs.tsv
          done

          (
            cd source
            git init -q
            git add -A -f .
            synthetic_tree="$(git write-tree)"
            printf '%s\n' "${synthetic_tree}" > ../synthetic-tree.txt
            rm -rf .git
          )
          synthetic_tree="$(cat synthetic-tree.txt)"

          jq -n             --arg schema "arcata-source-capsule/v1"             --arg repository "${ARCATA_REPOSITORY}"             --arg base_sha "${BASE_SHA}"             --arg feature_sha "${FEATURE_SHA}"             --arg synthetic_tree "${synthetic_tree}"             --rawfile feature_blobs feature-blobs.tsv             '{schema:$schema,repository:$repository,base_sha:$base_sha,feature_sha:$feature_sha,synthetic_tree_sha:$synthetic_tree,feature_blobs_tsv:$feature_blobs}'             > manifest.json

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -czf arcata-source.tar.gz -C source .
          sha256sum arcata-source.tar.gz > arcata-source.tar.gz.sha256
          sha256sum manifest.json > manifest.json.sha256

      - name: Upload source capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcata-pr68-source-capsule
          path: |
            arcata-source.tar.gz
            arcata-source.tar.gz.sha256
            manifest.json
            manifest.json.sha256
            feature-blobs.tsv
            synthetic-tree.txt
          if-no-files-found: error
          retention-days: 1

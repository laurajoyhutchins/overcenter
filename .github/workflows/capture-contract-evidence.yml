name: Capture generated contract evidence

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Generate and commit exact evidence
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog generated/contracts/catalog.json \
            --docs docs/generated/data-contracts.md \
            --atlas docs/generated/data-contract-authority-atlas.md
          rm .github/workflows/capture-contract-evidence.yml
          git add generated/contracts/catalog.json docs/generated/data-contracts.md docs/generated/data-contract-authority-atlas.md .github/workflows/capture-contract-evidence.yml
          if git diff --cached --quiet; then
            echo "No generated evidence delta to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate contract evidence"
          git push origin "HEAD:${HEAD_REF}"

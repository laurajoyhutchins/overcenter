name: Capture generated contract evidence

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Generate exact evidence
        run: |
          mkdir -p "$RUNNER_TEMP/contract-evidence/generated/contracts" "$RUNNER_TEMP/contract-evidence/docs/generated"
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog "$RUNNER_TEMP/contract-evidence/generated/contracts/catalog.json" \
            --docs "$RUNNER_TEMP/contract-evidence/docs/generated/data-contracts.md" \
            --atlas "$RUNNER_TEMP/contract-evidence/docs/generated/data-contract-authority-atlas.md"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-contract-evidence
          path: ${{ runner.temp }}/contract-evidence
          if-no-files-found: error
          retention-days: 1

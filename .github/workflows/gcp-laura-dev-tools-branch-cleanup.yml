name: Laura Dev Tools GCP branch cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-laura-dev-tools-branch-cleanup.yml

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Run exact-head branch cleanup through Laura Dev Tools
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/ldt-cleanup.yaml"
          cat > "$config" <<'YAML'
          serviceAccount: projects/project-6b810532-a302-48dc-b56/serviceAccounts/overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
          timeout: 600s
          steps:
            - id: ldt-cleanup
              name: node:22.16.0-bookworm
              entrypoint: bash
              secretEnv: [GITHUB_APP_PRIVATE_KEY]
              env: [GITHUB_APP_ID=4616688]
              args:
                - -c
                - |
                  set +e
                  (
                    set -euo pipefail
                    node - <<'NODE'
                  const crypto=require('crypto'),fs=require('fs');
                  const repo='laurajoyhutchins/laura-dev-tools';
                  const repoId=1383875536;
                  const rev='324b84814b4e7b006911584a942202f23ac96bc5';
                  const b64=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
                  const now=Math.floor(Date.now()/1000);
                  const unsigned=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iat:now-60,exp:now+540,iss:process.env.GITHUB_APP_ID});
                  const jwt=unsigned+'.'+crypto.sign('RSA-SHA256',Buffer.from(unsigned),process.env.GITHUB_APP_PRIVATE_KEY).toString('base64url');
                  const base={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','User-Agent':'overcenter-ldt-cleanup'};
                  async function json(r,label){const t=await r.text();if(!r.ok)throw new Error(label+' HTTP '+r.status+': '+t.slice(0,300));return JSON.parse(t)}
                  (async()=>{
                    const installation=await json(await fetch('https://api.github.com/repos/'+repo+'/installation',{headers:{...base,Authorization:'Bearer '+jwt}}),'installation');
                    const access=await json(await fetch('https://api.github.com/app/installations/'+installation.id+'/access_tokens',{
                      method:'POST',
                      headers:{...base,Authorization:'Bearer '+jwt,'Content-Type':'application/json'},
                      body:JSON.stringify({repository_ids:[repoId],permissions:{contents:'read'}})
                    }),'installation token');
                    const archive=await fetch('https://api.github.com/repos/'+repo+'/tarball/'+rev,{headers:{...base,Authorization:'Bearer '+access.token},redirect:'follow'});
                    if(!archive.ok)throw new Error('Laura Dev Tools archive HTTP '+archive.status);
                    fs.writeFileSync('/workspace/laura-dev-tools.tar.gz',Buffer.from(await archive.arrayBuffer()));
                  })().catch(e=>{console.error(e);process.exit(1)});
                  NODE
                  rm -rf /workspace/ldt-unpack /workspace/ldt
                  mkdir -p /workspace/ldt-unpack /workspace/ldt
                  tar -xzf /workspace/laura-dev-tools.tar.gz -C /workspace/ldt-unpack
                  root="$(find /workspace/ldt-unpack -mindepth 1 -maxdepth 1 -type d -print -quit)"
                  test -n "$$root"
                  cp -a "$$root"/. /workspace/ldt/
                  cd /workspace/ldt
                  export LAURA_DEV_TOOLS_GITHUB_APP_ID="$$GITHUB_APP_ID"
                  export LAURA_DEV_TOOLS_GITHUB_APP_PRIVATE_KEY="$$GITHUB_APP_PRIVATE_KEY"
                  export LAURA_DEV_TOOLS_OPERATION='git.branch.delete'

                  delete_branch() {
                    branch="$$1"
                    head="$$2"
                    export LAURA_DEV_TOOLS_INPUT_JSON
                    LAURA_DEV_TOOLS_INPUT_JSON="$$(printf '{"repo":"laurajoyhutchins/overcenter","branch":"%s","expected_head":"%s"}' "$$branch" "$$head")"
                    node --experimental-strip-types src/cli.ts
                  }

                    delete_branch 'perf/gcp-verification-substrate' 'f408a18c3b81ab4d74ae385fbc88ed3fc67268f2'
                    delete_branch 'fix/gcp-exact-job-runners' '606c0c307635afbf293ef6117406b73ef0173bda'
                    delete_branch 'test/gcp-exact-job-runners' '16e08d7c124bdd7ad17a225fa63ccca524fc6a0e'
                  ) > /workspace/diagnostic.txt 2>&1
                  rc=$?
                  printf '\nLDT_RC=%s\n' "$rc" >> /workspace/diagnostic.txt
                  cat /workspace/diagnostic.txt
                  cp /workspace/diagnostic.txt /builder/outputs/output
                  exit 0
          availableSecrets:
            secretManager:
              - versionName: projects/project-6b810532-a302-48dc-b56/secrets/overcenter-github-app-private-key/versions/latest
                env: GITHUB_APP_PRIVATE_KEY
          options: { logging: NONE }
          YAML

          build_id="$(gcloud builds submit --async --no-source --project="$PROJECT_ID" --region="$REGION" --config="$config" --format='value(id)')"
          echo "Cloud Build: $build_id" | tee -a "$GITHUB_STEP_SUMMARY"
          for _ in $(seq 1 300); do
            status="$(gcloud builds describe "$build_id" --project="$PROJECT_ID" --region="$REGION" --format='value(status)')"
            case "$status" in SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;; esac
            sleep 2
          done
          gcloud builds describe "$build_id" --project="$PROJECT_ID" --region="$REGION" --format=json > "$RUNNER_TEMP/build.json"
          python - "$RUNNER_TEMP/build.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import base64,json,sys
          body=json.load(open(sys.argv[1],encoding='utf-8'))
          def decode(raw):
              raw=raw.strip()
              raw += '=' * (-len(raw) % 4)
              return decode(raw)
          print('Status:', body.get('status'))
          for raw in body.get('results',{}).get('buildStepOutputs',[]):
              if raw:
                  print(decode(raw))
          outputs=[]
          for raw in body.get('results',{}).get('buildStepOutputs',[]):
              if raw:
                  outputs.append(decode(raw))
          text='\n'.join(outputs)
          if body.get('status') != 'SUCCESS' or 'LDT_RC=0' not in text:
              raise SystemExit(1)
          PY

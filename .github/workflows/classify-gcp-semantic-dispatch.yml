name: Classify GCP semantic dispatch boundary

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Classify, regenerate, and commit
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = '.contract-evidence/classifications.json';
          const data = JSON.parse(await readFile(path, 'utf8'));
          data.candidates['http:api/gcp-semantic-command-dispatch.js#request-response'] = {
            logical_contract: 'gcp.semantic-command-dispatch.http-boundary',
            significance: 'boundary-internal',
            semver_kind: 'adapter-layout'
          };
          data.candidates = Object.fromEntries(Object.entries(data.candidates).sort(([a], [b]) => a.localeCompare(b)));
          await writeFile(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog generated/contracts/catalog.json \
            --docs docs/generated/data-contracts.md \
            --atlas docs/generated/data-contract-authority-atlas.md
          rm .github/workflows/classify-gcp-semantic-dispatch.yml
          git add .contract-evidence/classifications.json generated/contracts/catalog.json docs/generated/data-contracts.md docs/generated/data-contract-authority-atlas.md .github/workflows/classify-gcp-semantic-dispatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: classify GCP semantic dispatch contract"
          git push origin "HEAD:${HEAD_REF}"

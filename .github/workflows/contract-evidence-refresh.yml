name: Temporary contract evidence refresh

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install contract evidence tooling
        run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Capture committed and exact generated evidence
        run: |
          mkdir -p "$RUNNER_TEMP/contract-evidence/current/generated/contracts" "$RUNNER_TEMP/contract-evidence/current/docs/generated"
          mkdir -p "$RUNNER_TEMP/contract-evidence/generated/generated/contracts" "$RUNNER_TEMP/contract-evidence/generated/docs/generated"
          cp generated/contracts/catalog.json "$RUNNER_TEMP/contract-evidence/current/generated/contracts/catalog.json"
          cp docs/generated/data-contracts.md "$RUNNER_TEMP/contract-evidence/current/docs/generated/data-contracts.md"
          cp docs/generated/data-contract-authority-atlas.md "$RUNNER_TEMP/contract-evidence/current/docs/generated/data-contract-authority-atlas.md"
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog "$RUNNER_TEMP/contract-evidence/generated/generated/contracts/catalog.json" \
            --docs "$RUNNER_TEMP/contract-evidence/generated/docs/generated/data-contracts.md" \
            --atlas "$RUNNER_TEMP/contract-evidence/generated/docs/generated/data-contract-authority-atlas.md"
      - name: Export exact evidence delta inputs
        uses: actions/upload-artifact@v4
        with:
          name: contract-evidence-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/contract-evidence
          retention-days: 1
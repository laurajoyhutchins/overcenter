name: GCP authoritative deployment

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/gcp-authoritative-deploy.yml
  workflow_dispatch:
    inputs:
      exact_revision:
        description: Exact revision already promoted to both dev and main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: overcenter-gcp-authoritative-deploy
  cancel-in-progress: false

jobs:
  deploy-authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SERVICE: overcenter-shadow
      GCP_REGION: us-west1
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
      PROJECT_REF: github:laurajoyhutchins/overcenter
      FAILED_TRANSITION: finish-hatchable-gcp-authoritative-state-migration
      FAILED_OBSERVED_AT: 2026-09-09T00:27:08.894Z
      ACCEPTANCE_TRANSITION: make-mechanical-changeset-coalescing-actionable
    steps:
      - name: Check out exact authoritative source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.exact_revision || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact revision is production authority
        shell: bash
        env:
          EXACT_REVISION: ${{ inputs.exact_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          test "$GITHUB_SHA" = "$EXACT_REVISION"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXACT_REVISION"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXACT_REVISION"

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          request_reason: Overcenter authoritative deployment ${{ inputs.exact_revision || github.sha }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Prove deployment identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -Fx "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"

      - name: Inspect failed GCP project.advance state read-only
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: bash ./scripts/gcp/prove-authoritative-runtime.sh inspect-failed

      - name: Deploy without changing authority epoch
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OVERCENTER_GITHUB_APP_ID: ${{ vars.OVERCENTER_GITHUB_APP_ID }}
          EXACT_REVISION: ${{ inputs.exact_revision || github.sha }}
        run: bash ./scripts/gcp/deploy-authoritative.sh

      - name: Reconcile failed attempt and prove reversible GCP acceptance cycle
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OVERCENTER_GITHUB_APP_ID: ${{ vars.OVERCENTER_GITHUB_APP_ID }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          EXACT_REVISION: ${{ inputs.exact_revision || github.sha }}
        run: bash ./scripts/gcp/prove-authoritative-runtime.sh prove

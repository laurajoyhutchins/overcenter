name: GCP authoritative deployment

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      exact_revision:
        description: Exact revision already promoted to both dev and main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: overcenter-gcp-authoritative-deploy
  cancel-in-progress: false

jobs:
  deploy-authoritative:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-gcp-authority]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SERVICE: overcenter-shadow
      GCP_REGION: us-west1
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
      PROJECT_REF: github:laurajoyhutchins/overcenter
      MIGRATION_TRANSITION: finish-hatchable-gcp-authoritative-state-migration
      EXACT_REVISION: ${{ inputs.exact_revision || github.sha }}
    steps:
      - name: Check out exact authoritative source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact revision is production authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          test "$GITHUB_SHA" = "$EXACT_REVISION"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXACT_REVISION"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXACT_REVISION"

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          request_reason: Overcenter authoritative deployment ${{ env.EXACT_REVISION }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Prove deployment identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -Fx "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"

      - name: Deploy without changing authority epoch
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OVERCENTER_GITHUB_APP_ID: ${{ vars.OVERCENTER_GITHUB_APP_ID }}
        run: bash ./scripts/gcp/deploy-authoritative.sh

      - name: Prove live authoritative GCP runtime and settle migration
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          test -n "$ID_TOKEN"

          fail_json() {
            label="$1"
            status="$2"
            file="$3"
            printf '%s\n' "$label failed (HTTP $status). Response:"
            jq . "$file" 2>/dev/null || cat "$file"
            exit 1
          }

          post_json() {
            output="$1"
            payload="$2"
            curl --silent --show-error -o "$output" -w '%{http_code}' \
              -H "Authorization: Bearer $ID_TOKEN" \
              -H 'content-type: application/json' \
              -X POST \
              -d "$payload" \
              "$SERVICE_AUDIENCE/api/worker-command"
          }

          gcloud run services describe "$GCP_SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/service.json"
          ready="$(jq -r '.status.latestReadyRevisionName' "$RUNNER_TEMP/service.json")"
          created="$(jq -r '.status.latestCreatedRevisionName' "$RUNNER_TEMP/service.json")"
          mode="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "OVERCENTER_AUTHORITY_MODE") | .value' "$RUNNER_TEMP/service.json")"
          revision="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "OVERCENTER_SOURCE_REVISION") | .value' "$RUNNER_TEMP/service.json")"
          digest="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "OVERCENTER_SOURCE_FREEZE_DIGEST") | .value' "$RUNNER_TEMP/service.json")"
          url="$(jq -r '.status.url' "$RUNNER_TEMP/service.json")"
          printf '%s\n' \
            "Cloud Run ready revision: $ready" \
            "Cloud Run created revision: $created" \
            "Authority mode: $mode" \
            "Source revision: $revision" \
            "Source freeze digest: $digest" \
            "Service URL: $url"
          test -n "$ready" && test "$ready" = "$created"
          test "$mode" = authoritative
          test "$revision" = "$EXACT_REVISION"
          test "$url" = "$SERVICE_AUDIENCE"
          test "$digest" = 'sha256:3ff040b3ebb60b89af860c1d3a140aef3be58652fdb1abca592ec45fb7c764b5'

          health_status="$(curl --silent --show-error -o "$RUNNER_TEMP/health.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            "$SERVICE_AUDIENCE/health")"
          echo "Health HTTP: $health_status"
          test "$health_status" = 200 || fail_json health "$health_status" "$RUNNER_TEMP/health.json"
          jq -e '.ok == true and .database == "ready" and .authority_mode == "authoritative"' "$RUNNER_TEMP/health.json" >/dev/null \
            || fail_json health-contract "$health_status" "$RUNNER_TEMP/health.json"

          inspect_status="$(curl --silent --show-error -o "$RUNNER_TEMP/inspect-before.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'content-type: application/json' \
            -X POST \
            -d "{\"project_ref\":\"$PROJECT_REF\"}" \
            "$SERVICE_AUDIENCE/api/authoritative-state/project-inspect")"
          echo "Project inspect before settlement HTTP: $inspect_status"
          test "$inspect_status" = 200 || fail_json project-inspect-before "$inspect_status" "$RUNNER_TEMP/inspect-before.json"
          jq -e '.ok == true and .authority_mode == "authoritative" and .inspection.ok == true' "$RUNNER_TEMP/inspect-before.json" >/dev/null \
            || fail_json project-inspect-before-contract "$inspect_status" "$RUNNER_TEMP/inspect-before.json"

          initial_payload="$(jq -nc \
            --arg project "$PROJECT_REF" \
            --arg transition "$MIGRATION_TRANSITION" \
            '{command:"project.advance",input:{project_ref:$project,transition_id:$transition}}')"
          advance_status="$(post_json "$RUNNER_TEMP/advance.json" "$initial_payload")"
          echo "Migration project.advance HTTP: $advance_status"
          test "$advance_status" = 200 || fail_json migration-advance "$advance_status" "$RUNNER_TEMP/advance.json"
          jq . "$RUNNER_TEMP/advance.json"

          outcome="$(jq -r '.outcome // empty' "$RUNNER_TEMP/advance.json")"
          if [[ "$outcome" == "PROJECT_COMPLETE" ]]; then
            test "$(jq -r '.transition.state // empty' "$RUNNER_TEMP/advance.json")" = "DONE"
            echo "Migration transition was already authoritatively DONE."
          else
            test "$outcome" = "AGENT_EXECUTION_REQUIRED" || fail_json migration-advance-contract "$advance_status" "$RUNNER_TEMP/advance.json"
            resume_ref="$(jq -r '.resume_ref // empty' "$RUNNER_TEMP/advance.json")"
            lease_ref="$(jq -r '.lease_ref // empty' "$RUNNER_TEMP/advance.json")"
            test -n "$resume_ref" && test -n "$lease_ref" || fail_json migration-advance-lease "$advance_status" "$RUNNER_TEMP/advance.json"

            settle_payload="$(jq -nc \
              --arg project "$PROJECT_REF" \
              --arg transition "$MIGRATION_TRANSITION" \
              --arg resume "$resume_ref" \
              --arg deploy_run "github-actions-run:${GITHUB_RUN_ID}" \
              --arg revision_ref "git-revision:${EXACT_REVISION}" \
              --arg freeze_ref 'sha256:3ff040b3ebb60b89af860c1d3a140aef3be58652fdb1abca592ec45fb7c764b5' \
              '{command:"project.advance",input:{project_ref:$project,transition_id:$transition,resume_ref:$resume,execution_result:{disposition:"completed",evidence:[{kind:"gcp_authoritative_deployment",ref:$deploy_run},{kind:"gcp_authority_revision",ref:$revision_ref},{kind:"source_freeze_digest",ref:$freeze_ref}],reason:"Hatchable source is irreversibly frozen; the sealed recovery seed is bound to the source freeze digest; GCP is the sole authoritative writer; Cloud SQL health is ready; and fresh GCP-backed project.inspect succeeded at the exact deployed revision."}}}')"
            settle_status="$(post_json "$RUNNER_TEMP/settle.json" "$settle_payload")"
            echo "Migration settlement HTTP: $settle_status"
            test "$settle_status" = 200 || fail_json migration-settlement "$settle_status" "$RUNNER_TEMP/settle.json"
            jq -e '.ok == true' "$RUNNER_TEMP/settle.json" >/dev/null \
              || fail_json migration-settlement-contract "$settle_status" "$RUNNER_TEMP/settle.json"
            jq . "$RUNNER_TEMP/settle.json"
          fi

          post_inspect_status="$(curl --silent --show-error -o "$RUNNER_TEMP/inspect-after.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'content-type: application/json' \
            -X POST \
            -d "{\"project_ref\":\"$PROJECT_REF\"}" \
            "$SERVICE_AUDIENCE/api/authoritative-state/project-inspect")"
          echo "Project inspect after settlement HTTP: $post_inspect_status"
          test "$post_inspect_status" = 200 || fail_json project-inspect-after "$post_inspect_status" "$RUNNER_TEMP/inspect-after.json"
          jq -e '.ok == true and .authority_mode == "authoritative" and .inspection.ok == true' "$RUNNER_TEMP/inspect-after.json" >/dev/null \
            || fail_json project-inspect-after-contract "$post_inspect_status" "$RUNNER_TEMP/inspect-after.json"

          printf '%s\n' \
            "GCP migration proof complete" \
            "Cloud Run revision: $ready" \
            "Authority mode: $mode" \
            "Source revision: $revision" \
            "Source freeze digest: $digest" \
            "Health: authoritative Cloud SQL ready" \
            "Project inspect: migrated authority readable before and after settlement" \
            "Migration transition: completed through GCP project.advance"

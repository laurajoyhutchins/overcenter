name: GCP authoritative deployment

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-authoritative-deploy.yml
  workflow_dispatch:
    inputs:
      exact_revision:
        description: Exact verified dev revision to deploy to authoritative GCP runtime
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: overcenter-gcp-authoritative-deploy
  cancel-in-progress: false

jobs:
  deploy-authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SERVICE: overcenter-shadow
      GCP_REGION: us-west1
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
      PROJECT_REF: github:laurajoyhutchins/overcenter
      FAILED_TRANSITION: finish-hatchable-gcp-authoritative-state-migration
      FAILED_OBSERVED_AT: 2026-09-09T00:27:08.894Z
      ACCEPTANCE_TRANSITION: make-mechanical-changeset-coalescing-actionable
      EXACT_REVISION: ${{ inputs.exact_revision || github.sha }}
    steps:
      - name: Check out exact authoritative source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.exact_revision || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact revision is authoritative development source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          test "$GITHUB_SHA" = "$EXACT_REVISION"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXACT_REVISION"

      - name: Wait for exact-revision verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/exact-revision-v8.yml/runs?branch=dev&event=push&per_page=20"
          for attempt in $(seq 1 40); do
            body="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "$api")"
            state="$(jq -r --arg revision "$EXACT_REVISION" '[.workflow_runs[] | select(.head_sha == $revision)] | first | if . == null then "missing" elif .status != "completed" then .status else .conclusion end' <<<"$body")"
            case "$state" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale) echo "exact-revision verification failed: $state" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo 'exact-revision verification did not complete in bounded window' >&2
          exit 1

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          request_reason: Overcenter authoritative deployment ${{ env.EXACT_REVISION }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Prove deployment identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -Fx "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"

      - name: Deploy without changing authority epoch
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OVERCENTER_GITHUB_APP_ID: ${{ vars.OVERCENTER_GITHUB_APP_ID }}
        run: bash ./scripts/gcp/deploy-authoritative.sh

      - name: Reconcile failed attempt and prove reversible GCP acceptance cycle
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          OVERCENTER_GITHUB_APP_ID: ${{ vars.OVERCENTER_GITHUB_APP_ID }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: bash ./scripts/gcp/prove-authoritative-runtime-http.sh

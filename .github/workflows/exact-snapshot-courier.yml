name: Exact Overcenter Snapshot Courier

on:
  push:
    branches:
      - agent/datalog-vm-bootstrap-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  courier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27250c746bbbdab22573ac732c7439ea71194b93
          fetch-depth: 1

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "27250c746bbbdab22573ac732c7439ea71194b93"
          git status --short

      - name: Package exact repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/overcenter-27250c74.tar.gz .
          sha256sum /tmp/overcenter-27250c74.tar.gz | sed 's#/tmp/##' > /tmp/overcenter-27250c74.tar.gz.sha256

      - name: Upload exact repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: overcenter-27250c74
          path: |
            /tmp/overcenter-27250c74.tar.gz
            /tmp/overcenter-27250c74.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

name: Temporary GCP failed-state inspection

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .github/workflows/temporary-gcp-failed-state-inspect-push.yml

permissions:
  contents: read
  id-token: write

env:
  DIAGNOSTIC_REVISION: 33fcc60d67c56e8c2918000f81928e1e0a27759c
  INSPECTOR_SERVICE: overcenter-authority-proof-inspector
  GCP_REGION: us-west1
  CLOUD_SQL_CONNECTION_NAME: project-6b810532-a302-48dc-b56:us-west1:overcenter-postgres
  RUNTIME_SA: overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
  PROJECT_REF: github:laurajoyhutchins/overcenter
  FAILED_TRANSITION: finish-hatchable-gcp-authoritative-state-migration
  FAILED_OBSERVED_AT: 2026-09-09T00:27:08.894Z

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DIAGNOSTIC_REVISION }}
          persist-credentials: false
          fetch-depth: 1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          request_reason: Read failed Overcenter GCP durable state
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Deploy private read-only inspector
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$INSPECTOR_SERVICE" \
            --source . --project="${{ vars.GCP_PROJECT_ID }}" --region="$GCP_REGION" \
            --service-account="$RUNTIME_SA" --add-cloudsql-instances="$CLOUD_SQL_CONNECTION_NAME" \
            --set-env-vars="PGHOST=/cloudsql/${CLOUD_SQL_CONNECTION_NAME},PGDATABASE=overcenter,PGUSER=overcenter,OVERCENTER_AUTHORITY_MODE=shadow" \
            --set-secrets="PGPASSWORD=overcenter-db-password:latest" \
            --command=/cnb/lifecycle/launcher --args="--,node,scripts/cloud-run-authority-proof-http.mjs" \
            --startup-probe="httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,failureThreshold=12,timeoutSeconds=3,periodSeconds=5" \
            --no-allow-unauthenticated --min-instances=0 --max-instances=1 --quiet
          url="$(gcloud run services describe "$INSPECTOR_SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$url"
          echo "INSPECTOR_URL=$url" >> "$GITHUB_ENV"
      - name: Read failed durable state directly
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-identity-token --audiences="$INSPECTOR_URL")"
          payload="$(jq -nc --arg project "$PROJECT_REF" --arg transition "$FAILED_TRANSITION" --arg observed "$FAILED_OBSERVED_AT" '{phase:"failed-attempt",project_ref:$project,transition_id:$transition,observed_at:$observed}')"
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/failed-state-response.json" -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H 'content-type: application/json' -X POST -d "$payload" "$INSPECTOR_URL/inspect")"
          test "$status" = 200 || { cat "$RUNNER_TEMP/failed-state-response.json"; exit 1; }
          jq -e '.ok == true and .proof.schema == "overcenter-authority-proof-inspect-v1"' "$RUNNER_TEMP/failed-state-response.json" >/dev/null
          jq '.proof' "$RUNNER_TEMP/failed-state-response.json" > "$RUNNER_TEMP/failed-state.json"
          jq '{run,execution_state,leases,slots,active_transition_leases,counts,target_epoch}' "$RUNNER_TEMP/failed-state.json"
          printf 'FAILED_DURABLE_STATE runs=%s leases=%s active_transition_leases=%s run_status=%s lease_statuses=%s\n' \
            "$(jq -r '.counts.runs' "$RUNNER_TEMP/failed-state.json")" \
            "$(jq -r '.counts.leases' "$RUNNER_TEMP/failed-state.json")" \
            "$(jq -r '.counts.active_transition_leases' "$RUNNER_TEMP/failed-state.json")" \
            "$(jq -r '.run.status // "none"' "$RUNNER_TEMP/failed-state.json")" \
            "$(jq -r '[.leases[].status] | join(",")' "$RUNNER_TEMP/failed-state.json")"
      - name: Upload inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-gcp-project-advance-state-${{ github.run_id }}
          path: ${{ runner.temp }}/failed-state.json
          if-no-files-found: warn
      - name: Delete temporary inspector
        if: always()
        shell: bash
        run: gcloud run services delete "$INSPECTOR_SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="$GCP_REGION" --quiet || true

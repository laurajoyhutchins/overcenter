name: Distributed authority handoff

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source revision to verify; defaults to the dispatched revision
        required: false
        type: string

concurrency:
  group: distributed-authority-handoff-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  AUTHORITY_REF: refs/heads/overcenter-ha-proof-${{ github.run_id }}-${{ github.run_attempt }}
  STATUS_CONTEXT: overcenter/ha-proof/${{ github.run_id }}/${{ github.run_attempt }}

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      initial_revision: ${{ steps.setup.outputs.initial_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Run deterministic local contract
        run: npm run test:distributed-authority-handoff
      - name: Initialize remote authority
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          result="$(node --experimental-strip-types experiments/distributed-authority-handoff/controller.ts setup \
            "$AUTHORITY_REF" \
            "${{ github.repository_id }}" \
            "${{ github.repository }}" \
            "$SOURCE_SHA" \
            "$STATUS_CONTEXT")"
          echo "$result"
          echo "initial_revision=$(jq -r .initial_revision <<<"$result")" >> "$GITHUB_OUTPUT"

  race:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: npm install --ignore-scripts --package-lock=false
      - name: Race exact READY claim from isolated controllers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          root="$RUNNER_TEMP/distributed-authority-handoff"
          mkdir -p "$root"
          remote="https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git"

          prepare_controller() {
            local contender="$1"
            local repo="$root/$contender"
            git init -q "$repo"
            git -C "$repo" remote add origin "$remote"
            git -C "$repo" fetch --quiet --depth=1 origin "$SOURCE_SHA"
            git -C "$repo" checkout -q --detach "$SOURCE_SHA"
          }

          prepare_controller a
          prepare_controller b

          controller="$GITHUB_WORKSPACE/experiments/distributed-authority-handoff/controller.ts"
          (
            cd "$root/a"
            node --experimental-strip-types "$controller" race               "$AUTHORITY_REF" "${{ needs.setup.outputs.initial_revision }}" a "$SOURCE_SHA"               > "$root/a.json"
          ) &
          a_pid=$!
          (
            cd "$root/b"
            node --experimental-strip-types "$controller" race               "$AUTHORITY_REF" "${{ needs.setup.outputs.initial_revision }}" b "$SOURCE_SHA"               > "$root/b.json"
          ) &
          b_pid=$!

          a_status=0
          b_status=0
          wait "$a_pid" || a_status=$?
          wait "$b_pid" || b_status=$?
          cat "$root/a.json"
          cat "$root/b.json"
          test "$a_status" -eq 0
          test "$b_status" -eq 0

          winners="$(jq -s '[.[] | select(.outcome == "won")] | length' "$root/a.json" "$root/b.json")"
          losers="$(jq -s '[.[] | select(.outcome == "lost")] | length' "$root/a.json" "$root/b.json")"
          test "$winners" -eq 1
          test "$losers" -eq 1

  reserve-effect:
    needs: [setup, race]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: npm install --ignore-scripts --package-lock=false
      - name: Verify exactly one claim winner from a fresh controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --experimental-strip-types experiments/distributed-authority-handoff/controller.ts verify-race "$AUTHORITY_REF"
      - name: Reserve and perform effect, then terminate without settlement
        run: node --experimental-strip-types experiments/distributed-authority-handoff/controller.ts reserve "$AUTHORITY_REF"

  recover:
    needs: [setup, reserve-effect]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: npm install --ignore-scripts --package-lock=false
      - name: Reconstruct, block replay, and settle from fresh observation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --experimental-strip-types experiments/distributed-authority-handoff/controller.ts recover "$AUTHORITY_REF"

  controls:
    needs: [setup, recover]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: npm install --ignore-scripts --package-lock=false
      - name: Prove stale authority rejection and remote-unavailable fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --experimental-strip-types experiments/distributed-authority-handoff/controller.ts controls \
            "$AUTHORITY_REF" "${{ needs.setup.outputs.initial_revision }}"

  cleanup:
    if: ${{ always() }}
    needs: [setup, race, reserve-effect, recover, controls]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: true
      - name: Remove ephemeral authority and barrier refs
        shell: bash
        run: |
          set +e
          git push --quiet origin ":$AUTHORITY_REF"
          git push --quiet origin ":${AUTHORITY_REF}-ready-a"
          git push --quiet origin ":${AUTHORITY_REF}-ready-b"
          exit 0

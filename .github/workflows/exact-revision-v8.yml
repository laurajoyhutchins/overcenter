name: Exact revision V8 verification

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character Git commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: overcenter-exact-revision-v8-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET_REVISION: ${{ github.event.pull_request.head.sha || github.event.inputs.revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REVISION }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install canonical dependencies
        run: npm ci
      - name: Verify invocation attach and peek semantics
        run: node --test scripts/verify-invocation-attach-peek.test.mjs
      - name: Generate contract evidence candidate for repair
        run: |
          npm install --prefix scripts/contract-evidence --no-save --package-lock=false
          mkdir -p "$RUNNER_TEMP/contract-evidence/generated/contracts" "$RUNNER_TEMP/contract-evidence/docs/generated"
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog "$RUNNER_TEMP/contract-evidence/generated/contracts/catalog.json" \
            --docs "$RUNNER_TEMP/contract-evidence/docs/generated/data-contracts.md" \
            --atlas "$RUNNER_TEMP/contract-evidence/docs/generated/data-contract-authority-atlas.md"
      - name: Upload contract evidence candidate for repair
        uses: actions/upload-artifact@v4
        with:
          name: contract-evidence-candidate
          path: ${{ runner.temp }}/contract-evidence
      - name: Build runtime artifact
        run: npm run build:runtime
      - name: Verify project authoring authority contracts
        run: node --test scripts/verify-project-authoring-readback-contract.test.mjs scripts/verify-project-authoring-github-adapter.test.mjs
      - name: Verify exact revision in isolated Hatchable V8 runtime
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXACT_REVISION: ${{ env.TARGET_REVISION }}
          HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
          OVERCENTER_HATCHABLE_VERIFICATION_PROJECT: ${{ vars.OVERCENTER_HATCHABLE_VERIFICATION_PROJECT }}
          OVERCENTER_HATCHABLE_PRODUCTION_PROJECT: ${{ vars.OVERCENTER_HATCHABLE_PRODUCTION_PROJECT }}
        run: node scripts/exact-revision-v8-dist-verification-http.mjs
name: Exact revision V8 verification

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character Git commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: overcenter-exact-revision-runtime
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET_REVISION: ${{ github.event.pull_request.head.sha || github.event.inputs.revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REVISION }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prove exact revision checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_REVISION"
      - name: Install canonical dependencies
        run: npm ci
      - name: Build portable GCP runtime artifact
        run: npm run build:portable
      - name: Verify portable GCP runtime and ingress contracts
        run: >-
          node --test
          scripts/cloud-run-command-ingress-host.test.mjs
          scripts/cloud-run-host.test.mjs
          scripts/cloud-run-target-authority.test.mjs
          scripts/cloud-run-target-activation-exit.test.mjs
          scripts/gcp-semantic-project-amend-bridge.test.mjs
          scripts/github-command-issue.test.mjs
      - name: Verify project authoring authority contracts
        run: node --test scripts/verify-project-authoring-readback-contract.test.mjs scripts/verify-project-authoring-github-adapter.test.mjs

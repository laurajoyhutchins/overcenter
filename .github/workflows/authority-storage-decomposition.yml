name: Authority storage decomposition

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source revision to verify; defaults to the dispatched revision
        required: false
        type: string

concurrency:
  group: authority-storage-decomposition-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.source_sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: npm install --ignore-scripts --package-lock=false
      - name: Run decomposition treatment
        run: npm run test:authority-storage-decomposition

name: Authority storage decomposition

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: authority-storage-decomposition-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - id: impact
        name: Plan assurance evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/plan-assurance-evidence.ts "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - if: contains(fromJSON(steps.impact.outputs.evidence_json), 'authority-storage-proof')
        run: npm install --ignore-scripts --package-lock=false
      - name: Run decomposition treatment
        if: contains(fromJSON(steps.impact.outputs.evidence_json), 'authority-storage-proof')
        run: npm run test:authority-storage-decomposition

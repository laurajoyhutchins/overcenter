name: Arcata baseline format publish

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/gcp-arcata-baseline-format-publish.yml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROJECT_ID: project-6b810532-a302-48dc-b56
      REGION: us-west1
      WIF_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      DEPLOYER_SA: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 363.0.0"
      - name: Publish exact formatter result
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/publish.yaml"
          cat > "$config" <<'YAML'
          serviceAccount: projects/project-6b810532-a302-48dc-b56/serviceAccounts/overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
          timeout: 600s
          steps:
            - id: publish
              name: python:3.13-bookworm
              entrypoint: bash
              secretEnv: [GITHUB_APP_PRIVATE_KEY]
              env: [GITHUB_APP_ID=4616688]
              args:
                - -ceu
                - |
                  apt-get update -qq
                  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates git nodejs
                  python - <<'PY'
                  import base64, os, subprocess
                  from pathlib import Path
                  repository='laurajoyhutchins/arcata'
                  branch='repair/verification-baseline-format'
                  expected='4a943347960da6ae929440ddaba01ef328d7866c'
                  script=r'''
                  const crypto=require('crypto'),fs=require('fs');
                  const repo=process.argv[1],branch=process.argv[2],expected=process.argv[3];
                  const b64=v=>Buffer.from(JSON.stringify(v)).toString('base64url'),now=Math.floor(Date.now()/1000);
                  const u=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iat:now-60,exp:now+540,iss:process.env.GITHUB_APP_ID});
                  const jwt=u+'.'+crypto.sign('RSA-SHA256',Buffer.from(u),process.env.GITHUB_APP_PRIVATE_KEY).toString('base64url');
                  const h=t=>({Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2026-03-10','User-Agent':'overcenter-baseline-format-publish'});
                  async function j(r,l){const t=await r.text();if(!r.ok)throw new Error(l+' HTTP '+r.status+': '+t.slice(0,300));return JSON.parse(t)}
                  (async()=>{const i=await j(await fetch('https://api.github.com/repos/'+repo+'/installation',{headers:h(jwt)}),'installation');
                  const a=await j(await fetch('https://api.github.com/app/installations/'+i.id+'/access_tokens',{method:'POST',headers:{...h(jwt),'Content-Type':'application/json'},body:JSON.stringify({repository_ids:[1402666660],permissions:{contents:'write'}})}),'token');
                  const p=branch.split('/').map(encodeURIComponent).join('/');const ref=await j(await fetch('https://api.github.com/repos/'+repo+'/git/ref/heads/'+p,{headers:h(a.token)}),'ref');
                  if(ref.object.sha!==expected)throw new Error('exact-head lease mismatch');fs.writeFileSync('/workspace/token',a.token,{mode:0o600});})().catch(e=>{console.error(e);process.exit(1)});
                  '''
                  subprocess.run(['node','-e',script,repository,branch,expected],env=os.environ,check=True)
                  token=Path('/workspace/token').read_text(); auth=base64.b64encode(f'x-access-token:{token}'.encode()).decode()
                  root=Path('/workspace/source'); root.mkdir()
                  subprocess.run(['git','init','-q'],cwd=root,check=True)
                  subprocess.run(['git','remote','add','origin',f'https://github.com/{repository}.git'],cwd=root,check=True)
                  subprocess.run(['git','-c',f'http.https://github.com/.extraheader=AUTHORIZATION: basic {auth}','fetch','--no-tags','origin',f'refs/heads/{branch}:refs/remotes/origin/candidate'],cwd=root,check=True)
                  actual=subprocess.check_output(['git','rev-parse','refs/remotes/origin/candidate'],cwd=root,text=True).strip()
                  if actual!=expected: raise SystemExit('candidate moved during fetch')
                  subprocess.run(['git','checkout','-q','--detach',expected],cwd=root,check=True)
                  req=Path('/workspace/req.txt')
                  with req.open('w') as h: subprocess.run(['python','tools/verification_tools.py','requirements'],cwd=root,stdout=h,text=True,check=True)
                  subprocess.run(['python','-m','venv','/workspace/venv'],check=True)
                  py='/workspace/venv/bin/python'
                  subprocess.run([py,'-m','pip','install','--disable-pip-version-check','--no-input','--no-compile','--only-binary=:all:','--no-deps','--require-hashes','-r',str(req)],cwd=root,check=True)
                  subprocess.run(['/workspace/venv/bin/ruff','format','.'],cwd=root,check=True)
                  changed=subprocess.check_output(['git','diff','--name-only'],cwd=root,text=True).splitlines()
                  if changed!=['tools/repo_config.py']: raise SystemExit(f'unexpected formatter write set: {changed}')
                  subprocess.run(['git','config','user.name','Overcenter GCP Repair'],cwd=root,check=True)
                  subprocess.run(['git','config','user.email','noreply@users.noreply.github.com'],cwd=root,check=True)
                  subprocess.run(['git','add','tools/repo_config.py'],cwd=root,check=True)
                  subprocess.run(['git','commit','-m','Format verification repository configuration'],cwd=root,check=True)
                  head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
                  subprocess.run(['git','-c',f'http.https://github.com/.extraheader=AUTHORIZATION: basic {auth}','push','origin',f'{head}:refs/heads/{branch}',f'--force-with-lease=refs/heads/{branch}:{expected}'],cwd=root,check=True)
                  print('REPAIRED_HEAD='+head)
                  PY
          availableSecrets:
            secretManager:
              - versionName: projects/project-6b810532-a302-48dc-b56/secrets/overcenter-github-app-private-key/versions/latest
                env: GITHUB_APP_PRIVATE_KEY
          options: { logging: CLOUD_LOGGING_ONLY }
          YAML
          id="$(gcloud builds submit --async --no-source --project="$PROJECT_ID" --region="$REGION" --config="$config" --format='value(id)')"
          for _ in $(seq 1 300); do
            s="$(gcloud builds describe "$id" --project="$PROJECT_ID" --region="$REGION" --format='value(status)')"
            case "$s" in SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;; esac
            sleep 2
          done
          echo "Build: $id status=$s"
          test "$s" = SUCCESS

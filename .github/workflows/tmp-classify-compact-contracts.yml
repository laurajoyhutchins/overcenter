name: Temporary compact contract classification

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: overcenter
          POSTGRES_USER: overcenter
          POSTGRES_PASSWORD: overcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overcenter -d overcenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: overcenter
      PGUSER: overcenter
      PGPASSWORD: overcenter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install contract evidence tooling
        run: npm install --prefix scripts/contract-evidence --no-save --package-lock=false
      - name: Classify compact state contracts
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const classificationPath = '.contract-evidence/classifications.json';
          const catalogPath = 'generated/contracts/catalog.json';
          const document = JSON.parse(await readFile(classificationPath, 'utf8'));
          const catalog = JSON.parse(await readFile(catalogPath, 'utf8'));
          const candidates = document.candidates;
          const unclassified = new Set(catalog.unclassified_source_identities || []);

          const authority = (source, logical, significance, semver_kind) => {
            if (!unclassified.has(source)) throw new Error(`authority source is not currently unclassified: ${source}`);
            candidates[source] = { logical_contract:logical, significance, semver_kind };
          };
          const projection = (source, logical) => {
            if (!unclassified.has(source)) throw new Error(`projection source is not currently unclassified: ${source}`);
            candidates[source] = { significance:'projection', projection_of:logical };
          };
          const projectPrefix = (prefix, logical, except = new Set()) => {
            for (const source of [...unclassified].filter((value) => value.startsWith(prefix)).sort()) {
              if (!except.has(source)) projection(source, logical);
            }
          };

          const executionAuthority = 'typescript:src/semantic/compact-execution-state.ts#ExecutionState';
          const operationAuthority = 'typescript:src/semantic/compact-execution-state.ts#OperationState';
          const proofAuthority = 'typescript:src/semantic/compact-execution-state.ts#ProofState';
          authority(executionAuthority, 'compact.execution-state', 'durable-internal', 'internal-module-layout');
          authority(operationAuthority, 'compact.operation-state', 'durable-internal', 'internal-module-layout');
          authority(proofAuthority, 'compact.proof-state', 'durable-internal', 'internal-module-layout');

          for (const name of ['ExecutionFence', 'ExecutionSubjectKind', 'ProgressHashWindow']) {
            projection(`typescript:src/semantic/compact-execution-state.ts#${name}`, 'compact.execution-state');
          }
          projection('typescript:src/semantic/compact-execution-state.ts#OperationLifecycleState', 'compact.operation-state');
          projection('typescript:src/semantic/compact-execution-state.ts#ProofEvidenceRef', 'compact.proof-state');

          projectPrefix('postgres:public.execution_state#', 'compact.execution-state');
          projectPrefix('postgres:public.operation_state#', 'compact.operation-state');
          projectPrefix('postgres:public.proof_state#', 'compact.proof-state');

          const storeAuthority = 'typescript:src/ports/compact-execution-state-store.ts#CompactExecutionStateStore';
          authority(storeAuthority, 'compact.execution-state.store', 'boundary-internal', 'adapter-layout');
          projectPrefix('typescript:src/ports/compact-execution-state-store.ts#', 'compact.execution-state.store', new Set([storeAuthority]));

          authority(
            'typescript:src/adapters/postgres/node-postgres-runtime.ts#NodePostgresTransactionExecutor',
            'postgres.transaction-executor',
            'implementation-only',
            'runtime-host-detail',
          );
          authority(
            'javascript:lib/orchestration-current-failure.js#orchestrationCurrentFailureInternals',
            'orchestration.current-failure-internals',
            'implementation-only',
            'internal-module-layout',
          );

          const runAuthority = 'postgres:public.orchestration_runs#table';
          if (!unclassified.has(runAuthority)) throw new Error('orchestration_runs table candidate is not available for classification');
          candidates[runAuthority] = {
            logical_contract:'orchestration.run.persistence',
            significance:'durable-internal',
            semver_kind:'database-layout',
          };
          for (const suffix of [
            'active_subject_key',
            'constraint:orchestration_runs_active_subject_key_fkey',
            'constraint:orchestration_runs_current_failure_check',
            'constraint:orchestration_runs_unresolved_operation_id_fkey',
            'current_failure_command',
            'current_failure_error_class',
            'current_failure_error_code',
            'current_failure_may_have_mutated',
            'current_failure_rejection',
            'current_failure_retryable',
            'current_failure_streak',
            'final_effect_refs',
            'final_evidence_sha256',
            'unresolved_operation_id',
          ]) projection(`postgres:public.orchestration_runs#${suffix}`, 'orchestration.run.persistence');

          const sorted = Object.fromEntries(Object.entries(candidates).sort(([a], [b]) => a.localeCompare(b)));
          await writeFile(classificationPath, `${JSON.stringify({ schema:document.schema, candidates:sorted }, null, 2)}\n`);
          NODE
      - name: Regenerate contract evidence
        run: |
          node scripts/contract-evidence/cli.mjs generate \
            --repo-root . \
            --config scripts/contract-evidence/overcenter/config.mjs \
            --catalog generated/contracts/catalog.json \
            --docs docs/generated/data-contracts.md
      - name: Commit classified evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .contract-evidence/classifications.json generated/contracts/catalog.json docs/generated/data-contracts.md
          git commit -m "chore: classify compact state contracts"
          git push origin "HEAD:${{ github.head_ref }}"

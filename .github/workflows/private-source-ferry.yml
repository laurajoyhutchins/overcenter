name: Private source ferry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/private-source-ferry.yml'
      - 'scripts/private-source-ferry.sh'
      - 'scripts/materialize-private-source-ferry.sh'
      - 'docs/private-source-ferry.md'
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify request and encryption contract
        run: bash scripts/private-source-ferry.sh self-test

  ferry:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 584 &&
      github.event.issue.locked == true &&
      github.actor == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/ferry arcata ')
    runs-on: [self-hosted, arcata-ferry]
    timeout-minutes: 5
    steps:
      - name: Checkout public ferry implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Stream exact Arcata source into encrypted capsule
        id: ferry
        shell: bash
        env:
          ARCATA_FERRY_TOKEN: ${{ secrets.ARCATA_FERRY_TOKEN }}
          REQUEST_BODY: ${{ github.event.comment.body }}
          REQUEST_ISSUE: ${{ github.event.issue.number }}
          REQUEST_COMMENT_ID: ${{ github.event.comment.id }}
        run: bash scripts/private-source-ferry.sh ferry "$REQUEST_BODY"

      - name: Upload ciphertext capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-source-ferry-${{ steps.ferry.outputs.nonce }}
          path: ferry-out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove local ciphertext
        if: ${{ always() }}
        shell: bash
        run: rm -rf ferry-out

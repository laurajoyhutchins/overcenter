name: Codex agent execution

on:
  workflow_dispatch:
    inputs:
      transition_id:
        description: Exact Overcenter project transition to execute
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: codex-agent-${{ github.repository }}-${{ inputs.transition_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: [self-hosted, codex]
    timeout-minutes: 28
    env:
      SERVICE_AUDIENCE: https://overcenter-shadow-bwcce2cokq-uw.a.run.app
    steps:
      - name: Check out executor control code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted executor control revision
        shell: bash
        working-directory: control
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: Install executor dependencies
        run: npm ci --prefix control

      - name: Authenticate prepare to authoritative GCP runtime
        id: auth_prepare
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
          request_reason: Codex prepare ${{ inputs.transition_id }} at ${{ github.sha }}

      - name: Acquire exact Overcenter execution packet
        id: prepare
        run: node control/scripts/codex-project-agent-execution.mjs prepare
        env:
          OVERCENTER_SERVICE_URL: ${{ env.SERVICE_AUDIENCE }}
          OVERCENTER_ID_TOKEN: ${{ steps.auth_prepare.outputs.id_token }}
          OVERCENTER_REQUEST_ID: codex:${{ github.run_id }}:${{ github.run_attempt }}:prepare:${{ inputs.transition_id }}
          CODEX_TRANSITION_ID: ${{ inputs.transition_id }}
          CODEX_PACKET_PATH: ${{ runner.temp }}/overcenter-codex-packet.json
          CODEX_PROMPT_PATH: ${{ runner.temp }}/overcenter-codex-prompt.txt

      - name: Check out exact execution revision
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.prepare.outputs.repository }}
          ref: ${{ steps.prepare.outputs.revision }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Execute disposable Codex agent
        run: node control/scripts/codex-project-agent-execution.mjs execute
        env:
          CODEX_PACKET_PATH: ${{ runner.temp }}/overcenter-codex-packet.json
          CODEX_PROMPT_PATH: ${{ runner.temp }}/overcenter-codex-prompt.txt
          CODEX_RESULT_PATH: ${{ runner.temp }}/overcenter-codex-result.json
          CODEX_EVENTS_PATH: ${{ runner.temp }}/overcenter-codex-events.jsonl
          CODEX_RESULT_SCHEMA: ${{ github.workspace }}/control/schemas/codex-agent-execution-result.schema.json
          CODEX_WORKSPACE: ${{ github.workspace }}/workspace

      - name: Authenticate apply to authoritative GCP runtime
        id: auth_apply
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
          request_reason: Codex apply ${{ inputs.transition_id }} at ${{ github.sha }}

      - name: Apply Codex changes through Overcenter authority
        id: apply
        run: node control/scripts/codex-project-agent-execution.mjs apply
        env:
          OVERCENTER_SERVICE_URL: ${{ env.SERVICE_AUDIENCE }}
          OVERCENTER_ID_TOKEN: ${{ steps.auth_apply.outputs.id_token }}
          OVERCENTER_REQUEST_ID: codex:${{ github.run_id }}:${{ github.run_attempt }}:apply:${{ inputs.transition_id }}
          CODEX_PACKET_PATH: ${{ runner.temp }}/overcenter-codex-packet.json
          CODEX_RESULT_PATH: ${{ runner.temp }}/overcenter-codex-result.json
          CODEX_APPLY_RECEIPT_PATH: ${{ runner.temp }}/overcenter-codex-apply-receipt.json
          CODEX_WORKSPACE: ${{ github.workspace }}/workspace

      - name: Publish bounded execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-execution-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/overcenter-codex-result.json
            ${{ runner.temp }}/overcenter-codex-apply-receipt.json

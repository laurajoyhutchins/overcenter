name: Direct GCP exact-head verification

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .overcenter/gcp-direct-verification-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: direct-gcp-exact-head-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove submission authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/gcp-cloud-run-cloud-sql-bootstrap"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - id: request
        name: Resolve exact verification request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(".overcenter/gcp-direct-verification-request.json", encoding="utf-8") as handle:
              request = json.load(handle)
          if set(request) != {"schema", "repository", "revision", "profile"}:
              raise SystemExit("invalid direct-verification request keys")
          if request["schema"] != "overcenter-gcp-direct-verification/v1":
              raise SystemExit("unsupported direct-verification request schema")
          if request["repository"] != "laurajoyhutchins/arcata":
              raise SystemExit("repository is not admitted for this verifier")
          revision = str(request["revision"])
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("revision must be an exact 40-hex SHA")
          if request["profile"] != "arcata-check":
              raise SystemExit("unsupported verification profile")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={request['repository']}\n")
              output.write(f"revision={revision}\n")
          PY

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Compile bounded verification request
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$RUNNER_TEMP/gcp-direct-bootstrap"
          rm -rf "$bootstrap"
          mkdir -p "$bootstrap"
          python3 - <<'PY'
          import base64
          import json
          import os
          import re

          request_path = ".overcenter/gcp-direct-verification-request.json"
          with open(request_path, encoding="utf-8") as handle:
              request = json.load(handle)

          if set(request) != {"schema", "repository", "revision", "profile"}:
              raise SystemExit("invalid direct-verification request keys")
          if request["schema"] != "overcenter-gcp-direct-verification/v1":
              raise SystemExit("unsupported direct-verification request schema")
          if request["repository"] != "laurajoyhutchins/arcata":
              raise SystemExit("repository is not admitted for this verifier")
          revision = str(request["revision"])
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("revision must be an exact 40-hex SHA")
          if request["profile"] != "arcata-check":
              raise SystemExit("unsupported verification profile")

          repository = request["repository"]
          with open("scripts/materialize-github-tree-for-verification.ts", encoding="utf-8") as handle:
              materializer_source = handle.read()
          materializer_encoded = base64.b64encode(materializer_source.encode()).decode()
          materializer_chunks = [
              materializer_encoded[index:index + 8000]
              for index in range(0, len(materializer_encoded), 8000)
          ]
          materializer_chunk_env = [
              f"MATERIALIZER_CHUNK_{index}={chunk}"
              for index, chunk in enumerate(materializer_chunks)
          ]
          materializer_expression = "".join(
              f"$$MATERIALIZER_CHUNK_{index}"
              for index in range(len(materializer_chunks))
          )
          materializer_runner = (
              "printf '%s' \"" + materializer_expression +
              "\" | base64 -d > /tmp/materialize.ts; " +
              "node --experimental-strip-types /tmp/materialize.ts"
          )
          materializer_outer = "\n".join([
              "set +e",
              materializer_runner + " > /workspace/materialization.log 2>&1",
              "status=$?",
              "set -e",
              'printf "%s\\n" "$status" > /workspace/materialization-exit-code',
              "exit 0",
          ])
          inner = f"""set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          test "$(uname -m)" = "x86_64"
          for variable in GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_GHA_CREDS_PATH; do
            if printenv "$variable" >/dev/null 2>&1; then
              echo "ambient GCP credential variable reached candidate container: $variable" >&2
              exit 70
            fi
          done
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl iproute2
          ip route replace blackhole 169.254.169.254/32
          for endpoint in \
            http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
            http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token
          do
            status="$(curl --silent --output /dev/null --write-out '%{{http_code}}' --connect-timeout 1 --max-time 2 -H 'Metadata-Flavor: Google' "$endpoint" || true)"
            if [ "$status" = "200" ]; then
              echo "GCP metadata credentials are reachable from candidate container" >&2
              exit 71
            fi
          done
          python - "{revision}" "{repository}" <<'PYVERIFY'
          import json
          import sys
          manifest = json.load(open("/candidate-source/.overcenter-source-manifest.json", encoding="utf-8"))
          if manifest.get("schema") != "overcenter-github-tree-materialization/v1":
              raise SystemExit("SOURCE_MANIFEST_SCHEMA_INVALID")
          if manifest.get("revision") != sys.argv[1]:
              raise SystemExit("SOURCE_MANIFEST_REVISION_MISMATCH")
          if manifest.get("repository") != sys.argv[2]:
              raise SystemExit("SOURCE_MANIFEST_REPOSITORY_MISMATCH")
          if not isinstance(manifest.get("entries"), list) or not manifest["entries"]:
              raise SystemExit("SOURCE_MANIFEST_EMPTY")
          PYVERIFY
          mkdir -p /tmp/arcata
          cp -a /candidate-source/. /tmp/arcata/
          rm -f /tmp/arcata/.overcenter-source-manifest.json
          cd /tmp/arcata
          python tools/verification_tools.py requirements > /tmp/verification-tools.txt
          python -m venv /tmp/verification-tools-env
          /tmp/verification-tools-env/bin/python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --no-compile \
            --only-binary=:all: \
            --no-index \
            --no-deps \
            --require-hashes \
            --find-links /tool-capsule/wheelhouse \
            --requirement /tmp/verification-tools.txt
          /tmp/verification-tools-env/bin/python -m pip check
          export PATH="/tmp/verification-tools-env/bin:$PATH"
          python tools/check.py
          """
          encoded = base64.b64encode(inner.encode()).decode()
          runner = "printf %s " + encoded + " | base64 -d > /tmp/verify.sh; exec bash /tmp/verify.sh"
          outer = "\n".join([
              "if [ ! -s /workspace/materialization-exit-code ]; then",
              '  echo "source materialization exit code missing" > /workspace/direct-verification.log',
              '  printf "80\\n" > /workspace/direct-verification-exit-code',
              "  exit 0",
              "fi",
              'materialization_status="$(cat /workspace/materialization-exit-code)"',
              'if [ "$materialization_status" != "0" ]; then',
              "  cat /workspace/materialization.log > /workspace/direct-verification.log || true",
              '  printf "%s\\n" "$materialization_status" > /workspace/direct-verification-exit-code',
              "  exit 0",
              "fi",
              "if [ ! -s /workspace/tool-materialization-exit-code ]; then",
              '  echo "tool materialization exit code missing" > /workspace/direct-verification.log',
              '  printf "81\\n" > /workspace/direct-verification-exit-code',
              "  exit 0",
              "fi",
              'tool_materialization_status="$(cat /workspace/tool-materialization-exit-code)"',
              'if [ "$tool_materialization_status" != "0" ]; then',
              "  cat /workspace/tool-materialization.log > /workspace/direct-verification.log || true",
              '  printf "%s\\n" "$tool_materialization_status" > /workspace/direct-verification-exit-code',
              "  exit 0",
              "fi",
              "set +e",
              "docker run --rm --network bridge --cap-add=NET_ADMIN --volume /workspace/candidate-source:/candidate-source:ro --volume /workspace/tool-capsule:/tool-capsule:ro --entrypoint bash python:3.13-bookworm -c "
              + json.dumps(runner)
              + " > /workspace/direct-verification.log 2>&1",
              "status=$?",
              "set -e",
              'printf "%s\\n" "$status" > /workspace/direct-verification-exit-code',
              "exit 0",
          ])

          build = {
              "serviceAccount": (
                  "projects/project-6b810532-a302-48dc-b56/serviceAccounts/"
                  "overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com"
              ),
              "timeout": "1200s",
              "steps": [
                  {
                      "id": "materialize-exact-source",
                      "name": "node:22-bookworm",
                      "entrypoint": "bash",
                      "secretEnv": ["GITHUB_APP_PRIVATE_KEY"],
                      "env": [
                          "GITHUB_APP_ID=4616688",
                          "TARGET_REPOSITORY=" + repository,
                          "TARGET_REPOSITORY_ID=1402666660",
                          "TARGET_OWNER_ID=219002713",
                          "TARGET_REVISION=" + revision,
                          *materializer_chunk_env,
                      ],
                      "args": ["-ceu", materializer_outer],
                  },
                  {
                      "id": "materialize-verification-tools",
                      "name": "python:3.13-bookworm",
                      "entrypoint": "bash",
                      "args": [
                          "-ceu",
                          """set +e
          (
          set -euo pipefail
          capsule=/workspace/tool-capsule
          rm -rf "$capsule"
          mkdir -p "$capsule/wheelhouse"
          python - "$capsule" <<'PYTOOLS'
          import hashlib
          import json
          import pathlib
          import re
          import sys
          
          capsule = pathlib.Path(sys.argv[1])
          source = pathlib.Path("/workspace/candidate-source")
          manifest = json.loads(
              (source / ".overcenter-source-manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("schema") != "overcenter-github-tree-materialization/v1":
              raise SystemExit("SOURCE_MANIFEST_SCHEMA_INVALID")
          
          lock_path = "tools/verification-tools.lock.json"
          entries = manifest.get("entries")
          if not isinstance(entries, list):
              raise SystemExit("SOURCE_MANIFEST_ENTRIES_INVALID")
          matches = [
              entry
              for entry in entries
              if isinstance(entry, dict) and entry.get("path") == lock_path
          ]
          if len(matches) != 1:
              raise SystemExit("VERIFICATION_TOOL_LOCK_MANIFEST_ENTRY_INVALID")
          entry = matches[0]
          
          content = (source / lock_path).read_bytes()
          blob_sha = hashlib.sha1(
              f"blob {len(content)}\0".encode() + content
          ).hexdigest()
          if blob_sha != entry.get("blob_sha"):
              raise SystemExit("VERIFICATION_TOOL_LOCK_BLOB_DIGEST_MISMATCH")
          if hashlib.sha256(content).hexdigest() != entry.get("sha256"):
              raise SystemExit("VERIFICATION_TOOL_LOCK_SHA256_MISMATCH")
          
          lock = json.loads(content)
          if lock.get("schema") != "arcata-verification-tools/v1":
              raise SystemExit("VERIFICATION_TOOL_LOCK_SCHEMA_MISMATCH")
          if lock.get("target") != {
              "python_version": "3.13",
              "platform": "linux-x86-64",
          }:
              raise SystemExit("VERIFICATION_TOOL_TARGET_MISMATCH")
          
          packages = lock.get("packages")
          if not isinstance(packages, list) or not packages:
              raise SystemExit("VERIFICATION_TOOL_PACKAGE_LIST_EMPTY")
          
          names = []
          lines = []
          authorized_hashes = []
          for package in packages:
              if set(package) != {"name", "version", "hashes"}:
                  raise SystemExit("VERIFICATION_TOOL_PACKAGE_RECORD_INVALID")
              name = package["name"]
              version = package["version"]
              hashes = package["hashes"]
              if not isinstance(name, str) or not re.fullmatch(
                  r"[a-z0-9]+(?:-[a-z0-9]+)*", name
              ):
                  raise SystemExit("VERIFICATION_TOOL_PACKAGE_NAME_INVALID")
              if not isinstance(version, str) or not version:
                  raise SystemExit("VERIFICATION_TOOL_PACKAGE_VERSION_INVALID")
              if (
                  not isinstance(hashes, list)
                  or not hashes
                  or any(
                      not isinstance(item, str)
                      or not re.fullmatch(r"[0-9a-f]{64}", item)
                      for item in hashes
                  )
              ):
                  raise SystemExit("VERIFICATION_TOOL_PACKAGE_HASHES_INVALID")
              names.append(name)
              sorted_hashes = sorted(hashes)
              lines.append(f"{name}=={version} \\")
              for index, digest in enumerate(sorted_hashes):
                  continuation = " \\" if index < len(sorted_hashes) - 1 else ""
                  lines.append(f"    --hash=sha256:{digest}{continuation}")
                  authorized_hashes.append(digest)
          
          if names != sorted(names) or len(names) != len(set(names)):
              raise SystemExit("VERIFICATION_TOOL_PACKAGES_NOT_UNIQUE_SORTED")
          
          (capsule / "lock.json").write_bytes(content)
          (capsule / "requirements.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          (capsule / "authority.json").write_text(
              json.dumps(
                  {
                      "schema": "overcenter-direct-tool-capsule-authority/v1",
                      "repository": manifest.get("repository"),
                      "revision": manifest.get("revision"),
                      "lock_path": lock_path,
                      "lock_blob_sha": blob_sha,
                      "authorized_hashes": sorted(set(authorized_hashes)),
                      "package_count": len(packages),
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PYTOOLS
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --require-hashes \
            --dest "$capsule/wheelhouse" \
            --requirement "$capsule/requirements.txt"
          python - "$capsule" <<'PYMANIFEST'
          import hashlib
          import json
          import pathlib
          import sys
          
          capsule = pathlib.Path(sys.argv[1])
          authority = json.loads((capsule / "authority.json").read_text(encoding="utf-8"))
          allowed = set(authority["authorized_hashes"])
          wheels = sorted((capsule / "wheelhouse").iterdir())
          if len(wheels) != authority["package_count"]:
              raise SystemExit(
                  f"TOOL_CAPSULE_FILE_COUNT_MISMATCH:{len(wheels)}:"
                  f"{authority['package_count']}"
              )
          files = []
          for wheel in wheels:
              if not wheel.is_file():
                  raise SystemExit("TOOL_CAPSULE_NON_FILE_ENTRY")
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              if digest not in allowed:
                  raise SystemExit(f"TOOL_CAPSULE_UNAUTHORIZED_DIGEST:{wheel.name}")
              files.append(
                  {"filename": wheel.name, "sha256": digest, "size": wheel.stat().st_size}
              )
          (capsule / "manifest.json").write_text(
              json.dumps(
                  {"schema": "overcenter-direct-tool-capsule/v1", "files": files},
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "event": "verification_tool_capsule_materialized",
                      "revision": authority["revision"],
                      "lock_blob_sha": authority["lock_blob_sha"],
                      "files": len(files),
                  }
              )
          )
          PYMANIFEST
          ) > /workspace/tool-materialization.log 2>&1
          status=$?
          set -e
          printf "%s\\n" "$status" > /workspace/tool-materialization-exit-code
          cat /workspace/tool-materialization.log
          exit 0"""
                      ],
                  },
                  {
                      "id": "verify-exact-head",
                      "name": "gcr.io/cloud-builders/docker",
                      "entrypoint": "bash",
                      "args": ["-ceu", outer],
                  },
                  {
                      "id": "capture-verification-output",
                      "name": "ubuntu:24.04",
                      "entrypoint": "bash",
                      "args": [
                          "-ceu",
                          'set -euo pipefail; captured=/workspace/captured-verification-output.log; { cat /workspace/materialization.log 2>/dev/null || true; cat /workspace/tool-materialization.log 2>/dev/null || true; cat /workspace/direct-verification.log 2>/dev/null || true; } | tail -c 96000 > "$captured"; cat "$captured"; mkdir -p /builder/outputs; cp "$captured" /builder/outputs/output',
                      ],
                  },
                  {
                      "id": "require-verification-success",
                      "name": "ubuntu:24.04",
                      "entrypoint": "bash",
                      "args": [
                          "-ceu",
                          'test -s /workspace/direct-verification-exit-code; status="$(cat /workspace/direct-verification-exit-code)"; test "$status" = "0"',
                      ],
                  },
              ],
              "availableSecrets": {
                  "secretManager": [
                      {
                          "versionName": (
                              "projects/project-6b810532-a302-48dc-b56/secrets/"
                              "overcenter-github-app-private-key/versions/latest"
                          ),
                          "env": "GITHUB_APP_PRIVATE_KEY",
                      }
                  ]
              },
              "options": {"logging": "CLOUD_LOGGING_ONLY"},
          }
          with open("/tmp/cloudbuild.json", "w", encoding="utf-8") as handle:
              json.dump(build, handle)
          with open("/tmp/request-summary", "w", encoding="utf-8") as handle:
              handle.write(repository + " " + revision + " arcata-check\n")
          PY
          cat /tmp/request-summary

      - name: Submit and observe GCP verification
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(
            gcloud builds submit --no-source               --async               --project="$GCP_PROJECT_ID"               --region="$GCP_REGION"               --config=/tmp/cloudbuild.json               --format='value(id)'
          )"
          test -n "$build_id"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          status=""
          for _ in $(seq 1 180); do
            status="$(
              gcloud builds describe "$build_id"                 --project="$GCP_PROJECT_ID"                 --region="$GCP_REGION"                 --format='value(status)'
            )"
            case "$status" in
              SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                break
                ;;
            esac
            sleep 5
          done
          echo "GCP build $build_id terminal status: $status"
          build_json="$RUNNER_TEMP/direct-gcp-build.json"
          gcloud builds describe "$build_id"             --project="$GCP_PROJECT_ID"             --region="$GCP_REGION"             --format=json > "$build_json"
          python3 - "$build_json" <<'PY'
          import base64
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)
          print("status:", body.get("status"))
          print("failure:", (body.get("failureInfo") or {}).get("detail"))
          for index, step in enumerate(body.get("steps") or []):
              print(
                  f"step[{index}] id={step.get('id')} status={step.get('status')} "
                  f"exit={step.get('exitCode')}"
              )
          outputs = (body.get("results") or {}).get("buildStepOutputs") or []
          for index, value in enumerate(outputs):
              if not value:
                  continue
              raw = str(value)
              print(f"== buildStepOutputs[{index}] ==")
              compact = "".join(raw.split())
              if len(compact) % 4 != 1:
                  try:
                      decoded = base64.b64decode(
                          compact + ("=" * ((-len(compact)) % 4)),
                          validate=False,
                      )
                      print(decoded.decode("utf-8", errors="replace"))
                      continue
                  except Exception:
                      pass
              print(raw)
          PY
          test "$status" = "SUCCESS"

      - name: Publish direct verification receipt
        if: always()
        shell: bash
        env:
          BUILD_ID: ${{ steps.submit.outputs.build_id }}
        run: |
          {
            echo "## Direct GCP exact-head verification"
            echo
            echo "- request: $(cat /tmp/request-summary 2>/dev/null || echo unavailable)"
            echo "- Cloud Build: ${BUILD_ID:-unavailable}"
            echo "- control revision: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

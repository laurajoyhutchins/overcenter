name: Probe runtime Cloud Build authority

on:
  push:
    branches:
      - work/gcp-cloud-run-cloud-sql-bootstrap
    paths:
      - .github/workflows/gcp-runtime-cloudbuild-probe.yml

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      GCP_PROJECT_ID: project-6b810532-a302-48dc-b56
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github/providers/overcenter
      GCP_DEPLOY_SERVICE_ACCOUNT: overcenter-deployer@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      GCP_RUNTIME_SERVICE_ACCOUNT: overcenter-runtime@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
      CONTROL_IMAGE: us-west1-docker.pkg.dev/project-6b810532-a302-48dc-b56/cloud-run-source-deploy/overcenter-gcp-runner-control@sha256:ca4edd83474c1966e561cf827a9fdc7b52b71692f5c7608d217742c58aa20d51

    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Deploy one-shot runtime authority probe
        shell: bash
        run: |
          set -euo pipefail
          script='
          const fs = require("fs");
          async function main() {
            const tokenResponse = await fetch(
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",
              { headers: { "Metadata-Flavor": "Google" } },
            );
            const tokenBody = await tokenResponse.json();
            if (!tokenResponse.ok || !tokenBody.access_token) process.exit(21);
            const response = await fetch(
              "https://cloudbuild.googleapis.com/v1/projects/project-6b810532-a302-48dc-b56/locations/us-west1/builds",
              {
                method: "POST",
                headers: {
                  Authorization: "Bearer " + tokenBody.access_token,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  steps: [{ name: "ubuntu:24.04", args: ["echo", "runtime-cloudbuild-probe"] }],
                  options: { logging: "CLOUD_LOGGING_ONLY" },
                }),
              },
            );
            const text = await response.text();
            console.log(response.status + " " + text.slice(0, 500));
            process.exit(response.ok ? 0 : 22);
          }
          main().catch(error => { console.error(error); process.exit(23); });
          '
          gcloud run jobs deploy overcenter-runtime-cloudbuild-probe             --project="$GCP_PROJECT_ID"             --region="$GCP_REGION"             --image="$CONTROL_IMAGE"             --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT"             --command=node             --args="-e,$script"             --max-retries=0             --task-timeout=3m             --quiet
          gcloud run jobs execute overcenter-runtime-cloudbuild-probe             --project="$GCP_PROJECT_ID"             --region="$GCP_REGION"             --wait             --quiet

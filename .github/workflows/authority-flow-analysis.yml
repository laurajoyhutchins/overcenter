name: Authority flow analysis

on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: authority-flow-analysis-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  authority-flow-analysis:
    name: Static authority-flow differential
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node from repository
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - id: impact
        name: Plan assurance evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ env.SOURCE_SHA }}
        run: node --experimental-strip-types scripts/plan-assurance-evidence.ts "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Install pinned build toolchain
        if: contains(fromJSON(steps.impact.outputs.evidence_json), 'authority-flow-proof')
        run: npm install --ignore-scripts --package-lock=false

      - name: Type-check repository
        if: contains(fromJSON(steps.impact.outputs.evidence_json), 'authority-flow-proof')
        run: npm run typecheck

      - name: Authority-flow analysis
        if: contains(fromJSON(steps.impact.outputs.evidence_json), 'authority-flow-proof')
        run: npm run test:authority-flow-analysis

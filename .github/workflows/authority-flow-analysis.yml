name: Authority flow analysis

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source revision to verify; defaults to the dispatched revision
        required: false
        type: string
concurrency:
  group: authority-flow-analysis-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  authority-flow-analysis:
    name: Static authority-flow differential
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node from repository
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'


      - name: Install pinned build toolchain
        run: npm install --ignore-scripts --package-lock=false

      - name: Type-check repository
        run: npm run typecheck

      - name: Authority-flow analysis
        run: npm run test:authority-flow-analysis

name: Overcenter internal · candidate handoff

on:
  workflow_dispatch:
  push:
    branches:
      - 'overcenter/candidate/**'

permissions: {}

jobs:
  classify:
    name: Classify candidate transport
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      run_id: ${{ steps.classify.outputs.run_id }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify exact candidate
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_REF_NAME#overcenter/candidate/}"
          test -n "$run_id"
          test "$run_id" != "$GITHUB_REF_NAME"

          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          if [ "$changed" = ".overcenter/candidate.json" ]; then
            candidate_run_id="$(git show "$GITHUB_SHA:.overcenter/candidate.json" | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d).on("end",()=>{
                const value=JSON.parse(s);
                if (typeof value.run_id!=="string" || !value.run_id) process.exit(2);
                process.stdout.write(value.run_id);
              });
            ')"
            test "$candidate_run_id" = "$run_id"
            kind="pure-candidate"
          else
            kind="source-change"
          fi

          test "$(git rev-list --parents -n1 "$GITHUB_SHA" | wc -w)" -eq 2
          echo "base_sha=$(git rev-parse "$GITHUB_SHA^")" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  signal:
    name: Internal candidate handoff
    needs: classify
    if: ${{ needs.classify.outputs.kind == 'pure-candidate' }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Emit no authority
        run: 'true'

  source-evidence:
    name: Verify source candidate
    needs: classify
    if: ${{ needs.classify.outputs.kind == 'source-change' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      expensive: true
      accepted_baseline_sha: ${{ needs.classify.outputs.base_sha }}

  source-record:
    name: Record source verification
    needs: [classify, source-evidence]
    if: ${{ always() && needs.classify.outputs.kind == 'source-change' }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      CANDIDATE_RUN_ID: ${{ needs.classify.outputs.run_id }}
      EVIDENCE_RESULT: ${{ needs.source-evidence.result }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Locate immutable runtime from candidate binding
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          trailers="$(git show -s --format=%B "$CANDIDATE_SHA" | git interpret-trailers --parse)"
          runtime_sha="$(printf '%s\n' "$trailers" | awk -F ': ' '$1=="Overcenter-Runtime-Sha"{print $2}')"
          test "$(printf '%s\n' "$runtime_sha" | sed '/^$/d' | wc -l)" -eq 1
          [[ "$runtime_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "runtime_sha=$runtime_sha" >> "$GITHUB_OUTPUT"

      - name: Check out bound trusted runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.binding.outputs.runtime_sha }}
          path: trusted-runtime
          persist-credentials: false

      - name: Use runtime-pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: trusted-runtime/.node-version
          package-manager-cache: false

      - name: Record exact verification result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVERCENTER_RUNTIME_SHA: ${{ steps.binding.outputs.runtime_sha }}
        run: node --experimental-strip-types trusted-runtime/scripts/record-source-verification.ts

      - name: Publish source verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overcenter-source-verification
          path: source-verification/source-verification.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
